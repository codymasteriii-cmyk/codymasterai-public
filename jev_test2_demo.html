8. Recoveries — if we pay a loss and property/payment is later recovered: notify the other party promptly;
   recovery expenses are reimbursed first; the insured may keep recovered property by refunding the claim
   paid (or a lesser agreed amount); if claim paid was reduced by a deductible/limit, any recovery is pro-rated
   by respective interests.
9. Subrogation — we may require the insured to assign recovery rights against a responsible third party, to
   the extent of our payment; we are not liable if the insured impairs our recovery right after a loss (a
   pre-loss written waiver of recovery rights does not void coverage); if the insured separately recovers
   damages for the same loss, they hold that amount in trust for us.
10. Suit Against Us —
    a. Property Coverages: no suit unless policy terms were fully complied with and suit commences within
       2 years after the loss.
    b. Liability Coverage: no suit unless policy terms were fully complied with and the insured's liability was
       conclusively fixed by final judgment after trial or written agreement among insured/claimant/us; no
       one may join/implead us in an action to determine an insured's liability.
11. Bankruptcy of an Insured — does not relieve us of policy obligations.

CONDITIONS APPLICABLE TO PROPERTY COVERAGES ONLY
12. Abandonment of Property — we may take property at agreed/appraised value; the insured may not
    abandon covered property to us unless we specifically agree.
13. Appraisal — if the parties disagree on repair/replacement cost, actual cash value, or loss amount, either
    may demand appraisal: each selects a competent independent appraiser within 20 days of a written
    demand; the two select an impartial umpire (or a court judge selects one if they can't agree within 15
    days); the appraisers determine amounts itemized by building item/personal property item; a signed
    agreement by any two of the three (appraisers + umpire) sets the amount. Each party pays their own
    appraiser; other appraisal expenses and the umpire are split equally.
14. No Benefit to Bailee — coverage does not directly/indirectly benefit any paid custodian of covered property.
15. Secured Party Coverage (mobile homes and personal property only; void unless a secured party is named
    in the Declarations) — loss payable to the secured party and the insured as interests appear (priority order
    if multiple); a claim denial to the insured doesn't apply to a secured party who notified us of relevant
    changes, paid demanded premium, and submitted a timely sworn proof of loss. Appraisal/Suit Against Us/
    Loss Payment conditions apply to the secured party; at least 10 days' cancellation notice is given to them.
    If we pay the secured party on a claim denied to the insured, we are subrogated to the secured party's
    rights, or may pay off the remaining security-agreement balance and take a full assignment. The secured
    party's interest is not covered for conversion/embezzlement/secretion by an insured in possession of the
    property, unless specifically insured and paid for.
16. Mortgage Clause (buildings only; void unless a mortgagee/trustee is named in the Declarations) — loss is
    payable to the named mortgagee/trustee as interests appear, in order of mortgage precedence; this
    interest is not invalidated by the mortgagor/owner's acts/neglect, foreclosure proceedings, title/ownership
    changes, or more-hazardous occupation of the premises — provided that if the mortgagor/owner fails to
    pay premium, the mortgagee/trustee must pay it on demand. The mortgagee/trustee must notify us of
    ownership/occupancy changes or hazard increases known to them and pay any resulting increased
    premium on demand, or the policy becomes null and void as noted. We may cancel per policy terms, but
    the policy continues for the mortgagee/trustee's benefit for 10 days after notice to them, then ceases (we
    may then cancel this agreement on like notice). If we pay the mortgagee/trustee while denying liability to
    the mortgagor/owner, we are subrogated to the mortgagee/trustee's rights under the mortgage-debt
    collateral, or may pay off the mortgage principal/interest and take a full assignment of the mortgage and
    other securities — without impairing the mortgagee/trustee's right to recover their full claim.

--- PRINCIPAL LIABILITY AND MEDICAL PAYMENTS COVERAGES ---

Coverage L — Personal Liability
Pays, up to the limit of liability, all sums an insured is legally liable for because of bodily injury or property
damage caused by an occurrence to which this coverage applies. We will defend (with our own counsel) any
suit seeking damages from bodily injury/property damage not excluded, may investigate/settle any claim or
suit as we see fit, and are not obligated to keep defending after paying (by judgment or settlement) an amount
equal to our limit of liability.

Coverage M — Medical Payments to Others
Pays necessary medical expenses incurred or medically determined within 3 years of an accident causing
bodily injury, applying only to: a person on the insured premises with an insured's permission; or a person
away from the premises if the injury results from a condition on the premises, an insured's activities, a
domestic employee's duties, an animal owned/cared for by an insured, or is suffered by a domestic employee
in the course of employment.

--- INCIDENTAL LIABILITY AND MEDICAL PAYMENTS COVERAGES ---
(Subject to Principal Coverage terms; do not increase Principal limits except Claims/Defense Expense and
First Aid Expense Coverage.)

1. Damage to Property of Others — regardless of legal liability, we pay for or repair/replace (with equivalent
   property) property of others damaged/destroyed by an insured, up to $500 per occurrence. Excludes:
   property owned/rented/leased by an insured, another household resident, or a tenant of an insured;
   damage intentionally caused by an insured aged 13+; property covered under Property Coverages; or
   damage from an insured's business activities, non-insured-premises property controlled by an insured, or
   ownership/operation/maintenance/use/loading/unloading of motorized vehicles/aircraft/watercraft.
2. Contracts and Agreements Coverage — pays bodily injury/property damage damages from liability assumed
   under a written contract made before the loss, if not connected to business activities.
3. Claims and Defense Expense Coverage — pays, for a suit we defend under Coverage L: costs taxed to the
   insured; our incurred expenses; actual lost earnings up to $50/day for time away from work at our request;
   other necessary expenses we request; post-judgment interest until we tender/pay up to our limit;
   prejudgment interest on the portion of judgment we pay (not for time after a tendered offer); appeal-bond/
   attachment-release-bond premiums up to our limit; and up to $500 per bail bond for an insured's
   accident/traffic violation from covered vehicle use. Does NOT pay punitive/exemplary damages or related
   defense costs, regardless of any other policy provision.
4. First Aid Expense Coverage — regardless of legal liability, pays first-aid expenses for bodily injury
   (covered by this policy) to persons other than insureds.
5. Incidental Motorized Vehicle Coverage — pays bodily injury/property damage from: (a) on-premises
   ownership/maintenance/use/loading/unloading of non-registrable motorized vehicles or recreational motor
   vehicles; (b) anywhere — golf carts used for golfing, utility/boat/camp/mobile-home trailers (unless
   carried/towed/attached to a motor vehicle), off-public-road service vehicles for the premises, or vehicles for
   assisting the handicapped not subject to registration; (c) an insured's use of a non-owned recreational
   motor vehicle.
6. Watercraft — pays bodily injury/property damage from watercraft maintenance/use/loading/unloading: (a)
   on the insured premises, or not owned/rented by an insured if resulting from an insured's activities; (b)
   owned/rented craft with inboard/inboard-outboard motors totaling ≤50 HP, or sailing vessels <26 feet
   (with/without auxiliary power); (c) craft with outboard motors totaling ≤50 HP; (d) craft with outboard
   motors >50 HP only if the motors are shown on the Declarations/endorsement for Personal Liability, or
   reported/requested within 45 days of acquisition, or not owned by any insured.
7. Incidental Business Coverage — pays bodily injury/property damage from: occasional residential rental of
   the insured's normally-occupied portion; rental of another portion for residential purposes (max 2 roomers/
   boarders per family unit); rental of a portion as school/studio/office/private garage; incidental activities
   normally performed by minors; and business-adjacent activities ordinarily considered non-business.

--- EXCLUSIONS ---
1. Exclusions Applying to Both Personal Liability and Medical Payments to Others — does not apply to

   l. from an insured's transmission of a communicable disease;
   m. from instances/occurrences/allegations of child abuse;
   n. from instances/occurrences/allegations of sexual abuse of any person;
   o. from instances/occurrences/allegations of criminal activity by employees of the named insured.

2. Exclusions Applying Only to Personal Liability — does not apply to liability:
   a. for bodily injury to you, resident relatives, or persons under 21 in your/their care;

   d. for damage to property rented to/occupied by/used by/in the care of an insured (exception: property

3. Exclusions Applying Only to Medical Payments to Others — does not apply to bodily injury:
   a. to an insured or other regular resident of the premises (except a domestic employee);
   b. to a person on the premises because a business/professional service is conducted there;
   c. to any person (including a domestic employee) covered by workers' comp/non-occupational
      disability/occupational disease benefits under law.

--- WORKERS' COMPENSATION — CERTAIN RESIDENCE EMPLOYEES ---
Applies when Perils Section ML-1R, ML-2, ML-3, ML-8, ML-1T, ML-2T, ML-3T or ML-1 is attached (this
policy has ML-2T attached, so this coverage applies). Does NOT apply if ML-4 or ML-4T is attached.

What We Agree To Do:
  Coverage I (Workers' Compensation) — pay all benefits required of an insured under the NY Workers'
    Compensation Law when due.
  Coverage II (Employers' Liability) — pay on behalf of an insured all damages for which the insured is

    employee is a US/Canadian citizen or resident. Coverage II excludes suits/judgments from courts outside

Who Is Covered: a residence employee who is (a) in regular employment under 40 hrs/week or casual
employment, and (b) defined as an employee under NY workers' comp law for whom benefits must be
provided.

Application of Coverage: applies only to bodily injury occurring during the policy period (disease must be
caused/aggravated by employment conditions during the period; last exposure must occur during the
period). Under Coverage I: notice/knowledge of an insured is deemed our notice/knowledge; the insured's
jurisdiction is deemed our jurisdiction for compensation-liability law purposes.

Limits of Liability — Coverage II: we may not limit our liability to pay damages for a covered residence
employee's bodily injury arising from employment subject to and compensable under NY Workers'
Compensation Law.

Provisions of ML-20 That Apply: Definitions (Bodily Injury, Business, Insured — Residence Employee is
defined under "Who Is Covered" above); "What You Must Do In Case of Loss" (liability provisions); Policy
Conditions: Assignment, Cancellation (Property and Liability), Change/Modification/Waiver (Property and
Liability), Subrogation (Property and Liability), Suit Against Us (Liability), Bankruptcy of an Insured
(Liability).

Provisions of ML-9/ML-10 That Apply: our agreement to defend under Coverage L; Claims and Defense
Expense Coverage item (b) — expenses incurred by us (claim expenses).

Other Provisions:
  a. Other Insurance — if a covered loss is also covered by other insurance, we pay only our share (equal
     shares of all applicable insurance until the loss is paid) — EXCEPT this insurance is primary over
     insurance written for a sole-proprietor insured's business employees.
  b. Conformity to Statute — conflicting terms are amended to conform to the NY Workers' Compensation Law.

Exclusions (Workers' Compensation — Certain Residence Employees): does not apply to liability for bodily
injury from an insured's business pursuits. Under Coverage II, does not apply to: liability assumed under any
contract/agreement; any workers' comp/employment/disability-benefits-law obligation; punitive/exemplary
damages for a residence employee employed in violation of law; bodily injury to such an employee with an
insured's knowledge of the violation; bodily injury intentionally caused/aggravated by an insured; or damages
from unlawful discharge/coercion/discrimination against a covered residence employee.

function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderStep1(){
  const doc = `<textarea class="doc-view" readonly spellcheck="false" onkeydown="event.preventDefault()">${escapeHtml(FULL_POLICY_TEXT)}</textarea>`;
  const tiers = ["easy","medium","hard"];
  const tierNames = {easy:"Easy — single location",medium:"Medium — 2–3 locations",hard:"Hard — rule application"};
  const groups = tiers.map(t=>{
    const qs = QUESTIONS.filter(q=>q.tier===t);
    const rows = qs.map((q,i)=>`
      <div class="q-row" onclick="this.dataset.open = this.dataset.open==='true' ? 'false':'true'">
        <div class="q-row-top">
          <span class="q-idx mono">${q.id}</span>
          <span class="q-text">${escapeHtml(q.text)}</span>
          <span class="gold-badge">GOLD ✓</span>
          <span class="sc-count mono">${q.subclaims.length} sub-claim${q.subclaims.length>1?'s':''}</span>
        </div>
        <div class="q-detail">
          <div class="label">Canonical answer</div>
          ${escapeHtml(q.gold)}
        </div>
      </div>`).join("");
    return `<div class="tier-group">
      <div class="tier-label" style="color:${TIER_COLOR[t]}"><span class="tier-swatch" style="background:${TIER_COLOR[t]}"></span>${tierNames[t]} (${qs.length})</div>
      <div class="q-list">${rows}</div>
    </div>`;
  }).join("");

  return `
  <div class="panel-head">
    <div><h2>Document &amp; question bank</h2><p>The authored policy, 18 questions across three difficulty tiers, and the human-labeled canonical answers used as ground truth.</p></div>
  </div>
  <div class="doc-grid">
    <div class="card">
      <h3>Source document</h3>
      ${doc}
    </div>
    <div class="card">
      <h3>Question bank — click a question to view its gold answer</h3>
      ${groups}
    </div>
  </div>`;
}

// ===========================================================================
// Routing-panel figures are derived from state.routing ALONE — never from state.totals.
// state.totals[key] is that model's running total across ALL FIVE steps, so reading it here
// made the routing column's "Cost" quietly absorb answer-generation and judging spend the
// moment those steps had run, while "Elapsed" beside it stayed routing-only. Same function
// feeds both the initial render and the live updates during a run, so the two can't diverge.
// Jev is the ONLY model here that reports a per-decision confidence. Claude and Gemini are
// deliberately never asked for one in Test 2 routing: a verbalized "high confidence" string is
// a token sequence, not a calibrated posterior, and showing the two side by side would invite
// exactly the false equivalence this benchmark exists to avoid. Returning "" for a missing
// confidence is what leaves the other two columns untouched with no per-model branching.
//
// A bar, because the correlation is the point and it reads at a glance: the short bars cluster
// on the wrong rows. Measured on the 2026-09-30 run -- mean confidence 0.70 when Jev matched the
// gold tier vs 0.41 when it did not, AUROC 0.838. The exceptions matter just as much: h5 (0.78)
// and h6 (0.72) are CONFIDENTLY wrong, which is the failure mode no confidence number protects
// against, and both are the hard-to-medium under-rate that sends an Opus question to Sonnet.
// Jev is the only judge that reports a confidence, so the marker is Jev-only by construction
// rather than by a per-model branch. The tooltip carries the number; the "?" badge itself comes
// from CSS, which matters because the live SSE path writes the cell with textContent and so
// cannot inject markup.
//
// MODULE SCOPE, deliberately. This first lived inside renderStep4() beside verdictLabel(), which
// looked tidy and was wrong: runFactCheck()'s live handler is a DIFFERENT function scope, so the
// very first judge result threw ReferenceError, the fact-check stream aborted, and the UI showed
// a "is the backend running?" alert while the backend was in fact running the job to completion.
// It survived review because the render path was verified and the live path was not -- the two
// call sites are in different scopes, so testing one proves nothing about the other.
function uncertainMark(m, conf){
  return (m === "jev" && typeof conf === "number" && conf < JEV_JUDGE_UNCERTAIN)
    ? {cls:" uncertain", title:"Jev judged this at confidence " + conf.toFixed(2)
        + " (below " + JEV_JUDGE_UNCERTAIN + ") - worth a human look"}
    : {cls:"", title:""};
}

// The confidence VALUE as an attribute, so both render paths can set it the same way and the
// live path can update it without rebuilding the element. Jev-only, like uncertainMark().
// "" unless BOTH a human label and a model verdict exist and they differ. Returning a class
// fragment (not a boolean) keeps the two render paths writing the same string.
function mismatchCls(gold, verdict){
  return (gold && verdict && verdict !== gold) ? " mismatch" : "";
}

function confAttr(m, conf){
  return (m === "jev" && typeof conf === "number") ? ` data-conf="${conf.toFixed(2)}"` : "";
}

function confBar(conf){
  if(typeof conf !== "number") return "";
  const col = conf < 0.4 ? "var(--bad)" : (conf < 0.7 ? "var(--tier-medium)" : "var(--good)");
  return `<span class="conf" title="Jev confidence ${conf.toFixed(2)}">`
    + `<span class="conf-track"><span class="conf-fill" style="width:${Math.round(conf*100)}%;background:${col}"></span></span>`
    + `<span class="conf-num mono">${conf.toFixed(2)}</span></span>`;
}

// One source of truth for a race row's contents. It was built by hand in TWO places before --
// renderStep2() for the initial/hydrate render and onResult() for the live SSE update -- which
// is exactly how a cell ends up looking different depending on whether you watched it arrive or
// switched tabs and came back. Same reasoning as routingTotals() below.
function raceRowInner(qid, res, ok){
  if(!res) return `<span class="q mono">${qid}</span><span class="pending">pending</span>`;
  if(res.error) return `<span class="q mono">${qid}</span>`
    + `<span class="mark no" title="${escapeHtml(res.error)}">error</span>`;
  return `<span class="q mono">${qid}</span>`
    + `<span class="chip" style="background:${TIER_DIM[res.tier]};color:${TIER_COLOR[res.tier]}">${res.tier}</span>`
    + confBar(res.confidence)
    + `<span class="mark ${ok?'ok':'no'}">${ok?'✓':'✗'}</span>`;
}

// The argument for showing confidence at all, reduced to two numbers: if the gap between them is
// wide the number is actionable, and if it collapses it is decoration. Jev only -- see confBar().
function jevConfSplit(){
  const ok = [], no = [];
  QUESTIONS.forEach(q => {
    const r = state.routing[q.id]?.jev;
    if(!r || typeof r.confidence !== "number") return;
    (r.tier === q.tier ? ok : no).push(r.confidence);
  });
  const mean = a => a.reduce((x,y)=>x+y,0) / a.length;
  return (ok.length && no.length)
    ? ` &middot; conf <b style="color:var(--good)">${mean(ok).toFixed(2)}</b>✓`
      + ` vs <b style="color:var(--bad)">${mean(no).toFixed(2)}</b>✗`
    : "";
}

function raceFooter(key, N){
  const t = routingTotals(key);
  if(!t.done) return "Not run yet.";
  return `<b>${t.matches}/${N}</b> correct &middot; <b>${(t.ms/1000).toFixed(1)}s</b> total`
       + ` &middot; <b>${Math.round(t.median)}ms</b>/call median`
       + ` &middot; <b>$${t.cost.toFixed(4)}</b>${key === "jev" ? jevConfSplit() : ""}`;
}

function routingTotals(key){
  let cost=0, ms=0, done=0, matches=0;
  const each=[];
  QUESTIONS.forEach(q=>{
    const r = state.routing[q.id]?.[key];
    if(!r) return;
    done++; cost += r.cost||0; ms += r.ms||0; each.push(r.ms||0);
    if(r.tier === q.tier) matches++;
  });
  // MEDIAN as well as the sum, because the sum is not robust and the failure is not
  // hypothetical: in the 2026-10-01 run a single Jev call (h2) took 5,604 ms -- 23x its own
  // median -- and that one tail event was 53% of Jev's whole 10.5 s total, which made Jev
  // read as level with Haiku's 10.3 s when per call it was 241 ms against 557 ms. A sum over
  // 18 calls answers "how long did this column take"; only the median answers "how fast is
  // this model", and the speed claim is about the latter.
  const sorted = each.slice().sort((a,b)=>a-b);
  const median = sorted.length
    ? (sorted.length % 2 ? sorted[(sorted.length-1)/2]
                         : (sorted[sorted.length/2-1] + sorted[sorted.length/2]) / 2)
    : 0;
  return {cost, ms, done, matches, median};
}

function renderStep2(){
  const cols = [
    // Model labels must track scripts/config.py — GEMINI_ROUTING_MODEL is 3.6 Flash for this
    // step (judging uses 3.8 Flash; see the deliberate per-role split documented in config.py).
    ["jev","Jev","var(--jev)","non-autoregressive · Choice"],
    ["claude","Claude Haiku 4.5","var(--claude)","decomposed prompt, verbalized"],
    ["gemini","Gemini 3.6 Flash","var(--gemini)","decomposed prompt, verbalized"],
  ];
  const N = QUESTIONS.length;
  // Hydrate from state so switching tabs mid-run or after completion never loses progress.
  const colsHTML = cols.map(([key,name,color])=>{
    const t = routingTotals(key);
    const rowsHTML = QUESTIONS.map(q=>{
      const res = state.routing[q.id]?.[key];
      return `<div class="race-row" id="race-${key}-${q.id}">`
        + raceRowInner(q.id, res, res && res.tier === q.tier) + `</div>`;
    }).join("");
    const clockMs = t.ms, matches = t.matches;
    const footer = raceFooter(key, N);
    return `<div class="race-col">
      <div class="race-head">
        <div class="model" style="color:${color}"><span class="dot" style="background:${color}"></span>${name}</div>
        <div class="sub">${key==="jev"?"routes off the question text alone":"same rubric, dual-baseline pattern"}</div>
      </div>
      <div class="race-stats">
        <div class="stat"><span>Elapsed</span><b class="mono" id="stat-${key}-ms">${(clockMs/1000).toFixed(1)}s</b></div>
        <div class="stat"><span>Cost</span><b class="mono" id="stat-${key}-cost">$${t.cost.toFixed(4)}</b></div>
        <div class="stat"><span>Match</span><b class="mono" id="stat-${key}-match">${matches}/${N}</b></div>
      </div>
      <div class="race-rows" id="rows-${key}">${rowsHTML}</div>
      <div class="footer-score" id="footer-${key}">${footer}</div>
    </div>`;
  }).join("");

  const chartHTML = state.routingDone ? routingChartHTML() : "";

  return `
  <div class="panel-head">
    <div><h2>Routing race</h2><p>Jev, Claude Haiku and Gemini Flash each classify all 18 questions into {easy, medium, hard} — scored against the pre-assigned gold tier.</p></div>
    <div style="display:flex; gap:8px;">
      <button class="btn ghost sm" onclick="resetRouting()" ${state.routingRunning?'disabled':''}>↺ Reset</button>
      <button class="btn" id="runRoutingBtn" onclick="runRouting()" ${state.routingRunning?'disabled':''}>▶ ${state.routingDone?'Run again':'Run routing (18 questions)'}</button>
    </div>
  </div>
  <div id="strip-routing">${stripFor("routing")}</div>
  <div class="race-grid">${colsHTML}</div>
  <div class="barchart" id="routingChart" style="display:${state.routingDone?'block':'none'};">
    <h3 style="margin-top:0;">Accuracy vs. gold tier</h3>
    <div id="chartRows">${chartHTML}</div>
  </div>`;
}
function routingChartHTML(){
  const names = {jev:["Jev","var(--jev)"], claude:["Claude",'var(--claude)'], gemini:["Gemini",'var(--gemini)']};
  return Object.keys(names).map(k=>{
    const total = QUESTIONS.length;
    const correct = QUESTIONS.filter(q=>state.routing[q.id]?.[k]?.tier===q.tier).length;
    const pct = Math.round(correct/total*100);
    return `<div class="bar-row">
      <span style="color:${names[k][1]};font-weight:700;">${names[k][0]}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${names[k][1]}"></div></div>
      <span class="mono">${pct}%</span>
    </div>`;
  }).join("");
}

async function resetRouting(){
  // Refuse mid-run: clearing state.routing while the columns are still awaiting would leave
  // the in-flight loop writing results back into the store we just emptied, so the panel
  // would repopulate itself a moment after "reset" — confusing on camera, and it would also
  // strand routingRunning=true with a permanently disabled Run button.
  if(state.routingRunning){ return; }
  state.routing = {}; state.routingDone=false;
  recomputeTotals(); // totals are derived, so clearing routing data alone rolls its cost/tokens/time
                      // back out of the scoreboard — Answers' and Fact-Check's contributions are untouched.
  render();
}

async function runRouting(){
  if(state.routingRunning) return;
  state.routingRunning = true;
  followLatest = true;
  const N = QUESTIONS.length;
  const btn = document.getElementById("runRoutingBtn"); if(btn) btn.disabled = true;
  const chart = document.getElementById("routingChart"); if(chart) chart.style.display = "none";

  // One event handler for both modes: live SSE and replay feed identical event shapes,
  // so the reveal animation is the same code path and a recorded take looks like a live one.
  const onResult = (qid, model, res) => {
    state.routing[qid] = state.routing[qid] || {};
    state.routing[qid][model] = adopt(res);
    const q = QUESTIONS.find(x => x.id === qid); if(!q) return;
    const ok = res.tier === q.tier;
    const row = document.getElementById(`race-${model}-${qid}`);
    if(row) row.innerHTML = raceRowInner(qid, res, ok);
    recomputeTotals(); renderScoreboard(); refreshStrips();
    // Each column scrolls its OWN .race-rows frame, so all three follow independently with
    // no conflict. Deliberately followInner and not followEl: only the page scroll would be
    // contested between the three columns, and the race grid sits at a fixed spot on the
    // page anyway, so it never needs to move.
    followInner(row);
    const t = routingTotals(model);
    const setText = (id, txt) => { const el = document.getElementById(id); if(el) el.textContent = txt; };
    setText(`stat-${model}-ms`, (t.ms/1000).toFixed(1)+"s");
    setText(`stat-${model}-cost`, "$"+t.cost.toFixed(4));
    setText(`stat-${model}-match`, t.matches+"/"+N);
    const foot = document.getElementById(`footer-${model}`);
    if(foot) foot.innerHTML = raceFooter(model, N);
  };

  for(const ev of replayRoutingEvents(DATA.run)){
    onResult(ev.question_id, ev.model, ev.res);
    await replayPace(ev.res.ms);
  }
  state.routingDone = true;
  state.routingRunning = false;
  render();
}

// ===========================================================================
// STEP 3 — Answers
// ===========================================================================
function renderStep3(){
  const rows = QUESTIONS.map(q=>{
    const res = state.answers[q.id];
    // A real backend can hand back a result with an "error" and empty text; show that rather
    // than an empty card that looks like a successful but blank answer.
    const body = res ? (res.text ? escapeHtml(res.text) : "(no text returned)") : "Not generated yet.";
    const meta = res ? `<span>${(res.ms/1000).toFixed(2)}s</span><span>${res.tokensIn+res.tokensOut} tokens</span><span>$${res.cost.toFixed(4)}</span>` : "";
    return `<div class="a-card" id="ans-${q.id}">
      <div class="a-top">
        <span class="q mono" style="color:${TIER_COLOR[q.tier]}">${q.id}</span>
        <span class="a-q">${escapeHtml(q.text)}</span>
        <span class="model-badge" style="background:var(--claude-dim);color:var(--claude);border:1px solid var(--claude-line)">${res && res.model ? PRETTY_MODEL(res.model) : ANSWER_MODEL[q.tier]}</span>
      </div>
      <div class="a-body" id="ansbody-${q.id}">${body}</div>
      <div class="a-meta" id="ansmeta-${q.id}">${meta}</div>
    </div>`;
  }).join("");
  return `
  <div class="panel-head">
    <div><h2>Answer generation</h2><p>Tier-appropriate, single-vendor: Haiku (easy) → Sonnet (medium) → Opus (hard). Jev doesn't participate here — free-text generation isn't a System One task.</p></div>
    <button class="btn" id="runAnswersBtn" onclick="runAnswers()" ${state.answersRunning?'disabled':''}>▶ ${state.answersDone?'Regenerate all':'Generate answers (18 questions)'}</button>
  </div>
  <div id="strip-answers">${stripFor("answers")}</div>
  <div class="a-list">${rows}</div>`;
}
async function runAnswers(){
  if(state.answersRunning) return;
  state.answersRunning = true;
  followLatest = true;
  const btn = document.getElementById("runAnswersBtn"); if(btn) btn.disabled = true;

  const showTyping = qid => {
    const q = QUESTIONS.find(x => x.id === qid);
    const body = document.getElementById(`ansbody-${qid}`);
    if(body && q) body.innerHTML = `<span style="color:var(--text-faint)">${ANSWER_MODEL[q.tier]} is answering…</span><span class="cursor-blink"></span>`;
    followEl(document.getElementById(`ans-${qid}`));   // bring the pending card into view
  };

  const onAnswer = async (qid, res) => {
    state.answers[qid] = adopt(res);
    recomputeTotals(); renderScoreboard(); refreshStrips();
    const body = document.getElementById(`ansbody-${qid}`);
    const full = res.text || "";
    if(body){
      if(!full){
        body.innerHTML = `<span style="color:var(--tier-hard)">${escapeHtml(res.error || "(no text returned)")}</span>`;
      } else {
        // typewriter reveal, escaped — a real answer can contain < or &
        const step = Math.max(1, Math.round(full.length/40));
        for(let i=0;i<full.length;i+=step){
          body.innerHTML = escapeHtml(full.slice(0,i+step)) + '<span class="cursor-blink"></span>';
          await sleep(12);
        }
        body.textContent = full;
      }
    }
    const meta = document.getElementById(`ansmeta-${qid}`);
    if(meta) meta.innerHTML = `<span>${(res.ms/1000).toFixed(2)}s</span><span>${(res.tokens_in||0)+(res.tokens_out||0)} tokens</span><span>$${(res.cost||0).toFixed(4)}</span>`;
    // Swap the tier-map placeholder for the model that actually answered, as each result
    // lands — otherwise the badge stays a prediction until the final render() at the end.
    const badge = document.querySelector(`#ans-${qid} .model-badge`);
    if(badge && res.model) badge.textContent = PRETTY_MODEL(res.model);
  };

  for(const q of QUESTIONS){
    const res = (DATA.run.answers || {})[q.id];
    if(!res) continue;
    showTyping(q.id);
    await replayPace(res.ms);
    await onAnswer(q.id, res);
  }
  state.answersDone = true;
  state.answersRunning = false;
  state.summaryHTML = null;
  render();
}

// ===========================================================================
// STEP 4 — Fact-check
// ===========================================================================
function renderStep4(){
  if(!state.answersDone){
    return `<div class="empty"><div class="big">🧾</div>Generate answers in Step 3 first — the fact-check step judges those candidate answers.</div>`;
  }
  const verdictLabel = v => v==="stated_correct"?["correct","Correct"]:v==="stated_wrong"?["wrong","Wrong"]:v==="not_stated"?["notstated","Absent"]:["pending","—"];
  const cards = QUESTIONS.map(q=>{
    const judged = !!state.judged[q.id];
    let sTotal={jev:0,claude:0,gemini:0}, cTotal={jev:0,claude:0,gemini:0};
    const subRows = q.subclaims.map(sc=>{
      const r = state.judgeResults[sc.id];
      const g = state.goldLabels[sc.id] || null;
    const cell = m => { const [cls,txt] = verdictLabel(r?.[m]); if(r){ sTotal[m]+=r[m+"Ms"]||0; cTotal[m]+=r[m+"Cost"]||0; }
      const u = uncertainMark(m, r?.[m+"Conf"]);
      const bad = mismatchCls(g, r?.[m]);
      return `<span class="verdict ${cls}${u.cls}${bad}" id="v-${m}-${sc.id}" title="${bad ? "Disagrees with the human label (" + verdictLabel(g)[1] + "). " : ""}${u.title}"`
           + `${confAttr(m, r?.[m+"Conf"])}>${txt}</span>`; };
    const humanCell = () => { const [cls,txt] = verdictLabel(g);
      return `<span class="verdict ${cls} human" id="v-human-${sc.id}" title="${g ? "Human gold label" : "Not labelled yet"}">${txt}</span>`; };
      return `<div class="sub-row" id="sub-${sc.id}" style="animation:none;opacity:1;transform:none;">
        <span class="sub-fact">${escapeHtml(sc.fact)}</span>
        ${humanCell()}${cell("jev")}${cell("claude")}${cell("gemini")}
      </div>`;
    }).join("");
    const costLine = judged ? `<span style="color:var(--jev)">Jev ${(sTotal.jev/1000).toFixed(1)}s · $${cTotal.jev.toFixed(4)}</span>
       <span style="color:var(--claude)">Claude ${(sTotal.claude/1000).toFixed(1)}s · $${cTotal.claude.toFixed(4)}</span>
       <span style="color:var(--gemini)">Gemini ${(sTotal.gemini/1000).toFixed(1)}s · $${cTotal.gemini.toFixed(4)}</span>` : "";
    return `
    <div class="fc-card" data-judged="${judged}" id="fccard-${q.id}">
      <div class="fc-row1">
        <input type="checkbox" class="fc-checkbox" id="chk-${q.id}" data-qid="${q.id}"
               ${judged?'disabled checked':(state.fcSelected[q.id]?'checked':'')}>
        <div class="fc-main">
          <div class="fc-qtext"><span class="mono" style="color:${TIER_COLOR[q.tier]}">${q.id}</span> &nbsp;${escapeHtml(q.text)}</div>
          <div class="fc-answer" id="fcanswer-${q.id}">${escapeHtml(state.answers[q.id]?.text || "No answer recorded for this question.")}</div>
        </div>
        <span class="judged-pill">✓ Judged</span>
        <button class="fc-expand-btn" onclick="toggleSub('${q.id}')">▾</button>
      </div>
      <div class="subclaims" id="subclaims-${q.id}" data-open="${!!state.fcOpen[q.id]}">
        <div class="judge-col-heads"><span>Required fact (${q.subclaims.length})</span><span style="color:var(--text-dim)">Human</span><span style="color:var(--jev)">Jev</span><span style="color:var(--claude)">Claude</span><span style="color:var(--gemini)">Gemini</span></div>
        <div class="subclaims-scroll">${subRows}</div>
      </div>
      <div class="fc-cost" id="fccost-${q.id}">${costLine}</div>
    </div>`;
  }).join("");
  return `
  <div class="panel-head">
    <div><h2>Fact-check</h2><p>Select answers, then fire the judges. Once judged, a card locks so you can't accidentally re-spend on it.</p></div>
  </div>
  <div class="fc-toolbar">
    <!-- Rendered from state, not hardcoded to "0": render() rebuilds this span on every tab
         switch, so a literal placeholder here showed "0 selected" next to three visibly
         ticked boxes as soon as the viewer navigated away and back. -->
    <span class="count" id="fcCount">${selectedQuestionIds().length} selected</span>
    <button class="btn ghost sm" onclick="selectAllRemaining()">Select all remaining</button>
    <button class="btn sm" id="runFcBtn" onclick="runFactCheck()">▶ Judge selected</button>
  </div>
  <div id="strip-factcheck">${stripFor("factcheck")}</div>
  <div id="fcList">${cards}</div>`;
}
function toggleSub(qid){
  state.fcOpen[qid] = !state.fcOpen[qid];   // state-backed so it survives a re-render
  const el = document.getElementById(`subclaims-${qid}`);
  if(el) el.dataset.open = state.fcOpen[qid] ? "true" : "false";
}
function selectAllRemaining(){
  QUESTIONS.forEach(q=>{
    if(state.judged[q.id]) return;
    state.fcSelected[q.id] = true;
    const c = document.getElementById(`chk-${q.id}`); if(c) c.checked = true;
  });
  updateFcCount();
}
// Selection count is derived from state.fcSelected, not from querying the DOM — same reason
// the selection itself is stored there (see `state`'s comment).
function selectedQuestionIds(){
  return QUESTIONS.filter(q=>!state.judged[q.id] && state.fcSelected[q.id]).map(q=>q.id);
}
function updateFcCount(){
  const el = document.getElementById("fcCount");
  if(el) el.textContent = selectedQuestionIds().length+" selected";
}
// Single delegated listener: the checkboxes are re-created by every render(), so binding
// per-element handlers would need re-binding each time. Mirrors the tick into state.fcSelected.
document.addEventListener("change", (e)=>{
  const t = e.target;
  if(!t.classList?.contains("fc-checkbox")) return;
  const qid = t.dataset.qid;
  if(qid) state.fcSelected[qid] = t.checked;
  updateFcCount();
});

async function runFactCheck(){
  const selectedIds = selectedQuestionIds();
  if(selectedIds.length === 0) return;
  followLatest = true;
  const btn = document.getElementById("runFcBtn"); if(btn) btn.disabled = true;

  const VERDICT = v => v==="stated_correct"?["correct","Correct"]
                    : v==="stated_wrong"?["wrong","Wrong"]
                    : v==="not_stated"?["notstated","Absent"]:["pending","—"];

  const onSubclaim = (qid, scid, ev) => {
    followEl(document.getElementById(`sub-${scid}`) || document.getElementById(`fccard-${qid}`));
    const rec = state.judgeResults[scid] = state.judgeResults[scid] || {};
    ["jev","claude","gemini"].forEach(m => {
      const r = ev[m]; if(!r) return;
      rec[m] = r.verdict;
      rec[m+"Cost"] = r.cost || 0; rec[m+"Ms"] = r.ms || 0;
      rec[m+"Tokens"] = (r.tokens_in||0)+(r.tokens_out||0);
      // Dropped before: the backend persists a judging confidence for Jev, and discarding it
      // here meant it survived in latest_run.json but could never reach the screen.
      rec[m+"Conf"] = (typeof r.confidence === "number") ? r.confidence : null;
      const [cls, txt] = VERDICT(r.verdict);
      const cell = document.getElementById(`v-${m}-${scid}`);
      const u = uncertainMark(m, r.confidence);
      const bad = mismatchCls(state.goldLabels[scid], r.verdict);
      if(cell){ cell.className = "verdict "+cls+u.cls+bad;
                cell.title = (bad ? "Disagrees with the human label. " : "") + u.title;
                if(m === "jev" && typeof r.confidence === "number") cell.dataset.conf = r.confidence.toFixed(2);
                else cell.removeAttribute("data-conf");
                cell.textContent = r.error ? "err" : txt; }
    });
    recomputeTotals(); renderScoreboard(); refreshStrips();
    // per-question cost strip, derived from state so it survives a re-render
    const q = QUESTIONS.find(x => x.id === qid); if(!q) return;
    const sT={jev:0,claude:0,gemini:0}, cT={jev:0,claude:0,gemini:0};
    q.subclaims.forEach(sc => { const r = state.judgeResults[sc.id]; if(!r) return;
      ["jev","claude","gemini"].forEach(m => { sT[m]+=r[m+"Ms"]||0; cT[m]+=r[m+"Cost"]||0; }); });
    const el = document.getElementById(`fccost-${qid}`);
    if(el) el.innerHTML =
      `<span style="color:var(--jev)">Jev ${(sT.jev/1000).toFixed(1)}s · $${cT.jev.toFixed(4)}</span>
       <span style="color:var(--claude)">Claude ${(sT.claude/1000).toFixed(1)}s · $${cT.claude.toFixed(4)}</span>
       <span style="color:var(--gemini)">Gemini ${(sT.gemini/1000).toFixed(1)}s · $${cT.gemini.toFixed(4)}</span>`;
  };

  const markJudged = qid => {
    state.judged[qid] = true;
    delete state.fcSelected[qid];
    const card = document.getElementById(`fccard-${qid}`); if(card) card.dataset.judged = "true";
    const chk = document.getElementById(`chk-${qid}`); if(chk){ chk.checked = true; chk.disabled = true; }
  };

  for(const qid of selectedIds){ state.fcOpen[qid] = true;
    const el = document.getElementById(`subclaims-${qid}`); if(el) el.dataset.open = "true"; }

  for(const qid of selectedIds){
    const q = QUESTIONS.find(x => x.id === qid); if(!q) continue;
    for(const sc of q.subclaims){
      const rec = (DATA.run.factcheck || {})[sc.id];
      if(!rec) continue;
      onSubclaim(qid, sc.id, rec);
      await replayPace(Math.max(...["jev","claude","gemini"].map(m => (rec[m]||{}).ms || 0)));
    }
    markJudged(qid);
  }
  state.summaryHTML = null;
  updateFcCount();
  render();
}

// ===========================================================================
// STEP 5 — Summary
// ===========================================================================
function renderStep5(){
  const doneCount = Object.keys(state.judged).length;
  if(doneCount===0){
    return `<div class="empty"><div class="big">📊</div>Judge at least one question in Step 4, then compute the summary.</div>`;
  }
  // Scoring is delegated to GET /api/test2/summary, which is explicit about whether a
  // hand-authored results/test2/gold_labels.json exists. Until it does, that endpoint
  // reports inter-judge AGREEMENT rather than accuracy and says so (has_gold_labels:
  // false) — computeSummary() surfaces that distinction rather than hiding it, because
  // presenting agreement as accuracy is the one genuinely misleading thing this page
  // could do.
  return `
  <div class="panel-head">
    <div><h2>Summary</h2><p>${doneCount}/${QUESTIONS.length} questions judged so far.
      Scored by the backend against <code>gold_labels.json</code> when present; inter-judge agreement otherwise.</p></div>
    <button class="btn" onclick="computeSummary()">📊 Compute summary</button>
  </div>
  <div id="summaryBody">${state.summaryHTML || '<div class="empty">Click "Compute summary" to score all judged sub-claims.</div>'}</div>`;
}
function computeSummary(){
  const body = document.getElementById("summaryBody");
  const sum = DATA.summary;

  const models = ["jev","claude","gemini"];
  const names = {jev:"Jev", claude:"Claude Haiku 4.5", gemini:"Gemini 3.8 Flash"};
  const colors = {jev:"var(--jev)", claude:"var(--claude)", gemini:"var(--gemini)"};
  const fc = sum.factcheck || {}, rt = sum.routing || {};
  const pct = v => (v === null || v === undefined) ? "–" : v.toFixed(0)+"%";

  // Awards are only meaningful among models that actually produced results.
  const ranked = models.filter(m => (fc[m]||{}).subclaims_judged > 0);
  const pick = cmp => ranked.length ? ranked.reduce(cmp) : null;
  const bestAcc  = sum.has_gold_labels
      ? pick((a,b) => ((fc[b].accuracy_macro??-1) > (fc[a].accuracy_macro??-1) ? b : a)) : null;
  const bestSpeed = pick((a,b) => (fc[b].total_ms   < fc[a].total_ms   ? b : a));
  const bestCost  = pick((a,b) => (fc[b].total_cost < fc[a].total_cost ? b : a));
  const award = m => m ? `<span style="color:${colors[m]}">${names[m]}</span>`
                       : `<span style="color:var(--text-faint)">–</span>`;

  const cards = models.map(m => {
    const f = fc[m] || {}, r = rt[m] || {};
    return `<div class="score-card">
      <div class="model" style="color:${colors[m]}"><span class="dot" style="background:${colors[m]}"></span>${names[m]}</div>
      <div class="metric-row"><span>Routing accuracy</span><span class="v">${pct(r.accuracy)} <span class="micro">(${r.correct||0}/${r.total||0})</span></span></div>
      <div class="metric-row"><span>Fact-check accuracy (macro / micro)</span><span><span class="v macro">${pct(f.accuracy_macro)}</span> <span class="v micro">/ ${pct(f.accuracy_micro)}</span></span></div>
      <div class="metric-row"><span>Recall on errors</span><span class="v">${pct(f.recall_on_errors)} <span class="micro">(${f.errors_caught??0}/${f.errors_total??0})</span></span></div>
      <div class="metric-row"><span>False-flag rate</span><span class="v">${pct(f.false_flag_rate)} <span class="micro">(${f.false_flags??0}/${f.gold_correct_total??0})</span></span></div>
      <div class="metric-row"><span>Sub-claims judged</span><span class="v">${f.subclaims_judged||0}</span></div>
      <div class="metric-row"><span>Scored against gold</span><span class="v">${f.subclaims_scored_against_gold||0}</span></div>
      <div class="metric-row"><span>Total cost</span><span class="v">$${(f.total_cost||0).toFixed(4)}</span></div>
      <div class="metric-row"><span>Total time</span><span class="v">${((f.total_ms||0)/1000).toFixed(1)}s</span></div>
    </div>`;
  }).join("");

  // A near-constant gold distribution makes accuracy almost uninformative, and the number
  // still looks authoritative. Computed from the response rather than hard-coded, so it
  // disappears on its own once the labels are balanced (e.g. after the error-injection probe).
  const anyF = fc[ranked[0]] || {};
  const nGold = (anyF.gold_correct_total ?? 0) + (anyF.errors_total ?? 0);
  const trivial = nGold ? Math.max(anyF.gold_correct_total ?? 0, anyF.errors_total ?? 0) / nGold * 100 : null;
  const baselineNote = (sum.has_gold_labels && trivial !== null && trivial >= 90)
    ? `<div class="callout"><b>Read these with the baseline.</b> The gold labels are
       ${anyF.gold_correct_total}:${anyF.errors_total} across ${nGold} sub-claims, so a judge that
       answers the majority class every time already scores <b>${trivial.toFixed(1)}%</b>.
       Accuracy at or below that is not evidence of judging skill, and "recall on errors" is a
       percentage over ${anyF.errors_total} sub-claim${anyF.errors_total === 1 ? "" : "s"}.</div>`
    : "";

  // Be explicit when there is no human gold yet — otherwise a reader takes the
  // agreement percentages for accuracy, which they are not.
  const goldNote = sum.has_gold_labels ? baselineNote :
    `<div class="callout"><b>No gold labels yet.</b> ${escapeHtml(sum.gold_labels_hint||"")}
     ${sum.inter_judge_agreement ? "Pairwise agreement: " + Object.entries(sum.inter_judge_agreement)
        .map(([k,v]) => `${k.replace(/_/g," ")} <b>${v===null?"–":v+"%"}</b>`).join(" · ") : ""}</div>`;

  state.summaryHTML = `
    <div class="award-row">
      <div class="award"><div class="medal">🎯</div><div class="label">Most accurate</div><div class="who">${award(bestAcc)}</div></div>
      <div class="award"><div class="medal">⚡</div><div class="label">Fastest</div><div class="who">${award(bestSpeed)}</div></div>
      <div class="award"><div class="medal">💰</div><div class="label">Cheapest</div><div class="who">${award(bestCost)}</div></div>
    </div>
    <div class="score-grid">${cards}</div>
    ${goldNote}
    <div class="callout"><b>Macro vs. micro diverge on purpose.</b> ${escapeHtml(sum.note||"")}</div>`;
  if(body) body.innerHTML = state.summaryHTML;
}

// ===========================================================================
// Boot
// ===========================================================================
function render(){
  recomputeTotals(); // cheap and defensive: guarantees the scoreboard can never drift from state
  document.getElementById("steps").innerHTML = [1,2,3,4,5].map(n=>{
    const fn = {1:renderStep1,2:renderStep2,3:renderStep3,4:renderStep4,5:renderStep5}[n];
    return `<div class="step" data-step="${n}" data-visible="${state.step===n}">${fn()}</div>`;
  }).join("");
  renderAll();
}
// No listener on #speedSelect on purpose: speed() reads its value at each sleep() call, so a
// change takes effect on the very next animation step with nothing to re-render or re-bind.

// ---------- boot: hydrate from the embedded DATA before first paint ----------
// Map the persisted run file onto the in-browser state shapes. The wire format is
// snake_case and nests each judge's full result object; the renderers expect camelCase
// and a flattened {model: verdict, modelMs, modelCost, modelTokens} record per sub-claim.
function hydrateFromRun(run){
  if(!run) return;
  Object.entries(run.routing || {}).forEach(([qid, perModel]) => {
    state.routing[qid] = {};
    Object.entries(perModel).forEach(([m, r]) => { state.routing[qid][m] = adopt(r); });
  });
  Object.entries(run.answers || {}).forEach(([qid, a]) => { state.answers[qid] = adopt(a); });
  Object.entries(run.factcheck || {}).forEach(([scid, perModel]) => {
    const rec = state.judgeResults[scid] = state.judgeResults[scid] || {};
    Object.entries(perModel).forEach(([m, r]) => {
      rec[m] = r.verdict;
      rec[m+"Ms"] = r.ms || 0;
      rec[m+"Cost"] = r.cost || 0;
      rec[m+"Tokens"] = (r.tokens_in || 0) + (r.tokens_out || 0);
      rec[m+"Conf"] = (typeof r.confidence === "number") ? r.confidence : null;
    });
  });
  (run.judged_question_ids || []).forEach(qid => { state.judged[qid] = true; });

  // Step-complete flags drive the tab ticks and the "Run again" button labels. Derive them
  // from coverage rather than trusting a flag, so a partial run doesn't claim to be done.
  const ids = QUESTIONS.map(q => q.id);
  state.routingDone = ids.length > 0 && ids.every(qid =>
    ["jev","claude","gemini"].every(m => state.routing[qid]?.[m]));
  state.answersDone = ids.length > 0 && ids.every(qid => state.answers[qid]?.text);
}

function setModeTag(text, color){
  const el = document.getElementById("modeTag");
  if(el){ el.textContent = text; if(color) el.style.color = color; }
}

function boot(){
  adoptQuestions(DATA.questions);

  // Rehydrate whatever the saved run has. Without this the page starts blank and shows
  // every step as "pending" even though a complete run is embedded right here.
  hydrateFromRun(DATA.run);
  state.goldLabels = DATA.goldLabels || {};

  const bits = [`replay · ${QUESTIONS.length} questions`];
  const loaded = [];
  if(Object.keys(state.routing).length) loaded.push("routing");
  if(Object.keys(state.answers).length) loaded.push("answers");
  if(Object.keys(state.judged).length)  loaded.push("fact-check");
  if(loaded.length) bits.push("loaded: " + loaded.join(" + "));
  if(!DATA.meta.has_gold_labels) bits.push("no gold labels — showing agreement");
  setModeTag(bits.join(" · "));

  render();
}
boot();
</script>
