okens_out":33,"cost":0.000996},"gemini":{"tier":"medium","ms":3185.4781000874937,"tokens_in":154,"tokens_out":11,"cost":0.0003135}},"m6":{"jev":{"tier":"medium","confidence":0.94,"ms":180.91779993847013,"tokens_in":457,"tokens_out":38,"cost":1.828e-05,"mocked":false},"claude":{"tier":"hard","ms":611.5275002084672,"tokens_in":837,"tokens_out":33,"cost":0.001002},"gemini":{"tier":"medium","ms":1850.4616001155227,"tokens_in":160,"tokens_out":11,"cost":0.0003225}},"h1":{"jev":{"tier":"medium","confidence":0.32,"ms":311.189099913463,"tokens_in":442,"tokens_out":38,"cost":1.768e-05,"mocked":false},"claude":{"tier":"easy","ms":612.8930000122637,"tokens_in":820,"tokens_out":33,"cost":0.000985},"gemini":{"tier":"hard","ms":2503.1561001669616,"tokens_in":145,"tokens_out":11,"cost":0.00030000000000000003}},"h2":{"jev":{"tier":"hard","confidence":0.5,"ms":172.71110019646585,"tokens_in":453,"tokens_out":38,"cost":1.812e-05,"mocked":false},"claude":{"tier":"hard","ms":503.3302998635918,"tokens_in":831,"tokens_out":33,"cost":0.000996},"gemini":{"tier":"hard","ms":3262.540699914098,"tokens_in":156,"tokens_out":11,"cost":0.0003165}},"h3":{"jev":{"tier":"medium","confidence":0.41,"ms":184.8301999270916,"tokens_in":458,"tokens_out":38,"cost":1.832e-05,"mocked":false},"claude":{"tier":"hard","ms":490.5020999722183,"tokens_in":836,"tokens_out":33,"cost":0.001001},"gemini":{"tier":"medium","ms":3371.118500130251,"tokens_in":162,"tokens_out":11,"cost":0.0003255}},"h4":{"jev":{"tier":"hard","confidence":0.38,"ms":186.7855000309646,"tokens_in":489,"tokens_out":38,"cost":1.956e-05,"mocked":false},"claude":{"tier":"hard","ms":506.4987998921424,"tokens_in":869,"tokens_out":33,"cost":0.001034},"gemini":{"tier":"hard","ms":2268.389099976048,"tokens_in":191,"tokens_out":11,"cost":0.000369}},"h5":{"jev":{"tier":"medium","confidence":0.76,"ms":238.7978001497686,"tokens_in":503,"tokens_out":38,"cost":2.012e-05,"mocked":false},"claude":{"tier":"hard","ms":650.6170001812279,"tokens_in":880,"tokens_out":33,"cost":0.001045},"gemini":{"tier":"hard","ms":6971.239699982107,"tokens_in":205,"tokens_out":11,"cost":0.00039}},"h6":{"jev":{"tier":"medium","confidence":0.74,"ms":186.87119986861944,"tokens_in":482,"tokens_out":38,"cost":1.9280000000000002e-05,"mocked":false},"claude":{"tier":"hard","ms":519.455999834463,"tokens_in":862,"tokens_out":33,"cost":0.001027},"gemini":{"tier":"hard","ms":3626.977300038561,"tokens_in":187,"tokens_out":5,"cost":0.000318}}},"answers":{"e1":{"text":"# Replacement Cost Coverage for Your House\n\nYour replacement cost coverage is **$521,000**, as shown in the Declarations under \"Coverage A — Residence (Replacement Cost Value).\"\n\n## How Replacement Cost Works\n\nThe Replacement Cost Provision (in the Perils Section, Form ML-2T) applies only to covered buildings, including your residence with its additions and built-in components/fixtures. The policy will pay replacement cost rather than actual cash value, but only if your Coverage A limit meets a specific threshold.\n\n**Key requirement:** Your limit of liability ($521,000) must be **at least 80% of the replacement cost of your residence at the time of loss**. The policy does not state your home's full replacement cost value, so you should verify whether $521,000 represents at least 80% of the current replacement cost.\n\n## Payment If the Requirement Is Met\n\nIf $521,000 is at least 80% of replacement cost at the time of loss, the policy will pay **the smallest of:**\n- The applicable limit of liability ($521,000)\n- The cost to repair/replace using materials of equivalent kind and quality\n- The amount actually and necessarily spent\n\nThis is paid **without deduction for depreciation**.\n\n## Payment If the Requirement Is NOT Met\n\nIf $521,000 is **less than 80%** of replacement cost at the time of loss, you will receive the **larger of:**\n- Actual cash value of the damaged part, or\n- A proportional amount based on what your limit bears to 80% of the full current replacement cost\n\n## Additional Limitations\n\n- **Deductible:** $1,000 applies to Coverage A losses (per the Declarations)\n- **Additional limit:** Until actual repair/replacement is completed, if the repair/replacement cost exceeds the lesser of $1,000 or 5% of your limit ($26,050), you receive only actual cash value until repairs are done\n- **Claim deadline:** You must make any claim for additional replacement cost (beyond actual cash value) within **180 days after the loss**\n\n## Exclusions from Replacement Cost\n\nReplacement cost does **not** apply to domestic appliances, carpeting, curtains, drapes, detachable building items (screens, awnings, storm doors/windows, window air conditioners), or outdoor structures that are not permanent components of a building (pools, fences, paved areas, etc.).","model":"claude-haiku-4-5-20251001","ms":6975.50980001688,"tokens_in":13446,"tokens_out":537,"cost":0.016131,"stop_reason":"end_turn"},"e2":{"text":"Your personal liability coverage is **$500,000 each occurrence**.\n\nThis limit is shown on the **Declarations page** under \"PERSONAL LIABILITY COVERAGES,\" listed as:\n\n**L. Personal Liability (Each Occurrence)                $500,000**\n\nThis coverage is provided under **Coverage L — Personal Liability** in the Liability Coverage Section (Form ML-9, Ed. 1/87), which states:\n\n> \"Pays, up to the limit of liability, all sums an insured is legally liable for because of bodily injury or property damage caused by an occurrence to which this coverage applies.\"\n\nThe policy clarifies under \"How Much We Pay for Loss or Claim\" that the Declarations limits are \"the maximum paid per single occurrence regardless of number of insureds, injured parties, or claims/suits.\"","model":"claude-haiku-4-5-20251001","ms":2937.2128997929394,"tokens_in":13445,"tokens_out":181,"cost":0.014349999999999998,"stop_reason":"end_turn"},"e3":{"text":"# Personal Property Coverage Premium Inclusion\n\nYes, your premium includes personal property coverage.\n\nAccording to the **PROPERTY COVERAGES** section of your Declarations page, **Coverage C — Personal Property** has a limit of liability of **$260,500** with the notation **\"INCL\"** (included) next to the premium column. This means the cost of this coverage is included in your overall premium and no additional charge applies.\n\n## What Coverage C Covers\n\n**Coverage C — Personal Property** provides broad protection for:\n\n1. **While on the Insured Premises**: personal property owned by or in the care of an insured, plus (at your option) guests' and domestic employees' property while on the exclusively-occupied portion of the premises. This also includes detachable building items (awnings, screens, storm doors/windows, window air conditioners), carpeting, curtains, drapes, and outdoor equipment not permanently installed.\n\n2. **While Away from the Insured Premises**: the Coverage C limit may be applied worldwide to property owned/used by an insured (does not increase the limit).\n\n3. **While Away at Another Insured's Residence**: coverage is limited to 10% of the Coverage C limit or $2,500, whichever is greater.\n\n## Important Limitations\n\nCoverage C includes **special limits** on certain property categories that are separate from your $260,500 limit. These caps include:\n- **$100** for money, coins, bullion, and precious metals\n- **$500** for jewelry, watches, and precious/semi-precious stones (theft only)\n- **$1,000** for guns and gun accessories (theft only)\n- **$500** for watercraft and accessories\n- **$1,000** for silverware and goldware (theft only)\n\n## Deductible\n\nA **$1,000 deductible** applies to Coverage C, as stated in the Declarations under \"Property Coverages Deductible.\"\n\n## Payment Basis\n\nCoverage C is typically settled on **actual cash value** (with depreciation), unless your Coverage A (Residence) limit is at least 80% of its replacement cost, in which case you may elect replacement cost coverage instead.","model":"claude-haiku-4-5-20251001","ms":6796.556900022551,"tokens_in":13444,"tokens_out":493,"cost":0.015909,"stop_reason":"end_turn"},"e4":{"text":"# Yes, Your Policy Covers Fire Damage\n\n**Coverage A (Residence) and Coverage B (Related Private Structures)** provide coverage for fire damage to your home and related structures on the premises. The policy explicitly lists **\"Fire or Lightning\"** as the first covered peril under the Perils Section (Peril 1).\n\n## What Is Covered\n\nUnder **Coverage A — Residence**, the policy covers \"the residence on the insured premises, including additions, built-in components/fixtures, and building materials/supplies on or next to the premises intended for construction/alteration/repair of the residence.\"\n\nYour Coverage A limit is **$521,000** with a **$1,000 deductible** per occurrence.\n\nUnder **Coverage B — Related Private Structures on the Premises**, fire damage to structures like garages, sheds, and fences is also covered. Your Coverage B limit is **$52,100**.\n\n**Coverage C (Personal Property)** also covers your personal belongings damaged by fire while on the insured premises, up to **$260,500** (actual cash value).\n\n## How Much You'll Receive\n\nThe amount paid depends on your coverage limits:\n\n**For your home (Coverage A):** Since your limit ($521,000) is at least 80% of replacement cost, you may elect either:\n- **Actual cash value** (depreciated value), OR\n- **Replacement Cost** (full cost to repair/replace without depreciation)\n\nThe policy will pay the lesser of: (a) your limit of liability; (b) the cost to repair/replace with equivalent materials; (c) the actual cash value; or (d) the amount after applying the **$1,000 deductible**.\n\n**For personal property (Coverage C):** Coverage is on an actual cash value basis (with depreciation).\n\n## Important Exclusions\n\nThe policy does NOT cover fire loss resulting from:\n- **Neglect** — your failure to use reasonable means to save/preserve property when endangered\n- **Intentional Acts** — fire caused intentionally by an insured\n- **Excluded perils** — e.g., fire resulting from earth movement (though direct fire from earth movement is paid)\n\n## Additional Coverage\n\n**Debris Removal** is included at no extra cost and covers removing debris of covered property after a fire loss.\n\n## Filing a Claim\n\nYou must **promptly notify** the insurance company and provide an acceptable proof of loss within **60 days** of the fire. Payment is due **45 days after** acceptable proof of loss and the established amount are submitted.\n\n**In summary: Yes, fire damage is covered under your homeowners policy up to your Coverage A limit of $521,000 (minus the $1,000 deductible), with replacement cost available if you meet the 80% threshold requirement.**","model":"claude-haiku-4-5-20251001","ms":8102.598699973896,"tokens_in":13445,"tokens_out":628,"cost":0.016585,"stop_reason":"end_turn"},"e5":{"text":"# Glass Breakage Coverage\n\n**Yes, you are covered for glass breakage under Peril 9 of the Perils Section.**\n\n## Coverage Details\n\n**Coverage Peril 9 — Glass Breakage** covers \"breakage of glass or other glazing material that is part of a building or mobile home, including storm doors and windows.\"\n\nThis peril applies to your covered property under:\n- **Coverage A** (Residence) — the dwelling structure itself\n- **Coverage B** (Related Private Structures) — detached structures on your premises\n\n## Important Limitations\n\nYour glass breakage coverage **does not apply** if:\n\n1. **Vacancy Condition**: \"the insured premises are vacant for more than 30 consecutive days immediately before the loss.\" However, \"a residence under construction is not considered vacant.\"\n\n2. **Deductible**: The standard **$1,000 deductible** (as stated in the Declarations) applies to this claim. The policy will pay only the amount of loss exceeding this deductible, up to your applicable limit of liability.\n\n## Payment Terms\n\nThe claim will be settled under the same terms as other property losses:\n- If your Coverage A limit is **at least 80% of the replacement cost** of your residence at the time of loss, you may elect to receive **replacement cost** (without depreciation) rather than actual cash value.\n- If your limit is **less than 80%** of replacement cost, you will receive the larger of: (a) actual cash value of the damaged glass, or (b) a proportional amount based on your coverage limit.\n\n## Summary\n\nGlass breakage is a covered peril, but claims are subject to the $1,000 deductible and are excluded if your premises have been vacant for more than 30 consecutive days before the loss.","model":"claude-haiku-4-5-20251001","ms":5112.921700114384,"tokens_in":13444,"tokens_out":406,"cost":0.015474,"stop_reason":"end_turn"},"e6":{"text":"# Payment Timeline for Covered Losses\n\nUnder the **PAYMENT OF LOSS OR CLAIM** section, the timing depends on your coverage type:\n\n## Property Coverages (Coverage A, B, C, D)\n\n**General Timeline:**\nLosses are \"payable 45 days after acceptable proof of loss and established amount (by written agreement or filed appraisal award).\"\n\n**Additional Living Expenses:**\nIf your premises become unfit for occupancy for more than one month, these expenses are \"paid monthly on submission of reasonable proof of expenses.\"\n\n**Damage to Others' Property:**\nThe insurer \"at our option\" may adjust and pay you for the owner's account, or adjust and pay directly to the owner.\n\n## Important Conditions Affecting Payment\n\n**Proof of Loss Requirement:**\nYou must \"submit an acceptable proof of loss within 60 days\" at the insurer's request. This proof must include:\n- Time/place/circumstances of the loss\n- Your interests and others' interests (including mortgages/liens)\n- Other applicable insurance\n- Title/occupancy changes\n- Available plans/specifications\n- Detailed repair estimates\n- Detailed damaged-property inventory with supporting bills/receipts\n\n**Replacement Cost Claims:**\nIf you have Replacement Cost coverage (which applies only if your Coverage A limit is at least 80% of replacement cost), there is an additional deadline: \"A claim for any additional amount under this provision must be made within 180 days after the loss.\"\n\nHowever, note that \"when the cost to repair/replace exceeds the lesser of $1,000 or 5% of the applicable limit of liability, we are not liable for more than actual cash value until actual repair/replacement is completed.\"\n\n## Summary\n\n- **Standard payment:** 45 days after acceptable proof of loss and established amount\n- **Monthly payments:** For additional living expenses if displacement exceeds one month\n- **Proof deadline:** Submit within 60 days (at insurer's request)\n- **Replacement cost claim deadline:** Within 180 days after the loss\n\nThe actual payment date depends on how quickly you submit required documentation and proof of loss. The insurer may also take damaged property \"at agreed/appraised value\" if an appraisal is needed.","model":"claude-haiku-4-5-20251001","ms":6735.575600061566,"tokens_in":13455,"tokens_out":503,"cost":0.01597,"stop_reason":"end_turn"},"m1":{"text":"Here's what's excluded under the **Vehicles** and **Windstorm or Hail** perils (Perils Section, Form ML-2T):\n\n**Peril 6 — Vehicles**\nCoverage does not apply to loss to **fences, driveways, and walks** caused by a vehicle owned or operated by an occupant of the insured premises.\n\n**Peril 2 — Windstorm or Hail**\nThis peril does **not** cover:\n- a. Loss caused directly or indirectly by **frost, cold weather, ice (other than hail), snow, or sleet** — whether wind-driven or not;\n- b. Damage to a **building's interior or contents** caused by **dust, rain, sand, sleet, snow, or water** entering through openings in the building, **unless** those openings were made by the direct force of wind or hail;\n- c. Loss to **watercraft** (except rowboats and canoes located on the insured premises), their **trailers, accessories, equipment, and outboard motors**, unless they are inside a fully enclosed building at the time of loss.\n\n**Related General Exclusion — Weather Conditions**\nUnder the Exclusions That Apply to Property Coverages, \"Weather Conditions\" is excluded, but **only** when weather contributes **in combination with another excluded cause or event** (e.g., Earth Movement, Water Damage) to produce the loss — it doesn't exclude ordinary wind/hail damage covered under Peril 2 itself.\n\n**Also relevant — Replacement Cost Provision**\nEven if a vehicle or windstorm/hail loss is covered, note that detachable building items (screens, awnings, storm doors/windows, window air conditioners) and outdoor structures that aren't permanent building components (pools, fences, paved areas, sump pumps) are **excluded from the Replacement Cost Provision** — such losses are settled on an actual cash value basis, not full replacement cost.\n\n**Deductible**\nAny covered vehicle or windstorm/hail loss is still subject to the policy's **$1,000 deductible** (per the Declarations, as modified by Endorsement OTS-77), which is deducted from the applicable Limit of Liability or the adjusted claim, whichever is less — only one deductible applies per occurrence.","model":"claude-sonnet-5","ms":8730.925399810076,"tokens_in":19319,"tokens_out":1034,"cost":0.048978,"stop_reason":"end_turn"},"m2":{"text":"## Workers' Compensation Coverage (Applies because Form ML-2T is attached)\n\n**What's Covered:**\n\n**Coverage I – Workers' Compensation:** Pays all benefits required of an insured under the **NY Workers' Compensation Law** when due.\n\n**Coverage II – Employers' Liability:** Pays on behalf of an insured all damages for which the insured is legally liable arising from a covered residence employee's **bodily injury** (by accident or disease, arising out of and in the course of employment) while the employee is in the **US/its territories/Canada**, or temporarily elsewhere **if** the employee is a US/Canadian citizen or resident. Coverage II **excludes** suits/judgments from courts **outside** the US/its territories/Canada.\n\n**Definition of \"Bodily Injury\"** (per Policy Definitions, ML-20): bodily harm, sickness or disease, including required care, loss of services, and resulting death.\n\n**Who Is Covered:**\nA **residence employee** who is:\n(a) in regular employment under 40 hours/week, or in casual employment; AND\n(b) defined as an \"employee\" under NY Workers' Compensation Law for whom benefits must be provided.\n\n**Timing/Application:** Applies only to bodily injury occurring **during the policy period** (for disease, it must be caused/aggravated by employment conditions during the period, with last exposure occurring during the period). Under Coverage I, notice/knowledge of an insured is deemed our notice/knowledge, and the insured's jurisdiction is deemed our jurisdiction for compensation-liability law purposes.\n\n**Limits:** Under Coverage II, we may **not** limit our liability to pay damages for a covered residence employee's bodily injury arising from employment that is subject to and compensable under NY Workers' Compensation Law.\n\n**Key Exclusions (Workers' Comp section):**\n- Does not apply to liability from an insured's **business pursuits**.\n- Under Coverage II only, does **not** apply to:\n  - liability assumed under any contract/agreement;\n  - any workers' comp/employment/disability-benefits-law obligation;\n  - punitive/exemplary damages for an employee employed in violation of law;\n  - bodily injury to such an employee **with an insured's knowledge of the violation**;\n  - bodily injury **intentionally caused or aggravated** by an insured;\n  - damages from unlawful discharge, coercion, or discrimination against a covered residence employee.\n\n**Other Insurance:** If a covered loss is also covered by other insurance, we pay only our share (equal shares of all applicable insurance) — **except** this insurance is **primary** over insurance written for a sole-proprietor insured's business employees.\n\n**Conformity to Statute:** Conflicting terms are amended to conform to the **NY Workers' Compensation Law**.\n\n**Related Provisions That Apply:** Definitions (Bodily Injury, Business, Insured); \"What You Must Do in Case of Loss\" (liability provisions); Policy Conditions on Assignment, Cancellation, Change/Modification/Waiver, Subrogation, Suit Against Us, and Bankruptcy of an Insured (Liability); plus our agreement to defend under Coverage L and Claims/Defense Expense Coverage item (b) (our incurred claim expenses).\n\n**Note:** This coverage does **not** apply if Form ML-4 or ML-4T is attached — neither is attached to your policy, so this coverage is active.","model":"claude-sonnet-5","ms":9097.321799956262,"tokens_in":19332,"tokens_out":1183,"cost":0.050494,"stop_reason":"end_turn"},"m3":{"text":"Based on the Perils Section (Form ML-2T), there are two separate perils covering plumbing-related water damage, each with its own exclusions:\n\n**Peril 15 — Accidental Discharge or Overflow of Liquids or Steam**\n(from a plumbing, heating or air-conditioning system or domestic appliance; note gutters/downspouts are NOT considered part of a plumbing system)\n\nThis does **not** cover loss:\n- a. Caused by continuous or repeated seepage or leakage;\n- b. If the residence has been vacant for more than 30 consecutive days immediately before the loss;\n- c. To the system or appliance itself from which the liquid/steam escapes (only removal/replacement of parts necessary to repair the system/appliance is paid — not the discharge/overflow damage to the unit itself);\n- d. Caused by freezing (this is handled separately under Peril 16, below);\n- e. On the insured premises caused by discharge or overflow that originated **off** the insured premises.\n\n**Peril 16 — Freezing**\n(of a plumbing, heating or air-conditioning system or domestic appliance)\n\nThis does **not** cover loss while the residence is:\n- Vacant,\n- Unoccupied (including temporary absence), or\n- Under construction and unoccupied —\n\n**UNLESS** the insured used reasonable care to either:\n(a) maintain heat in the building, **or**\n(b) shut off the water supply and completely drain/empty the system or appliance of liquid.\n\n**Additional related exclusions (General Policy Provisions — Exclusions That Apply to Property Coverages):**\n- **Water Damage exclusion** — flood, surface water, water that backs up through sewers or drains, or below-ground water that seeps/leaks/presses against a building, sidewalk, driveway, foundation or pool is excluded entirely (though direct fire, explosion, or covered theft loss resulting from such water damage is still paid).\n- **Wear and Tear exclusion** — rust, rot, corrosion, or deterioration of plumbing is not covered unless caused by an insured peril.\n\n**Bottom line:** You're covered for sudden plumbing discharge/overflow or freeze damage, but not for slow/repeated leaks, damage to the pipe/appliance itself (only its removal/replacement to make the repair), losses from vacant premises (30+ days), freeze losses if you didn't maintain heat or drain the system during vacancy/unoccupancy, or any flood/sewer-backup/below-ground seepage situations.","model":"claude-sonnet-5","ms":7959.042800124735,"tokens_in":19321,"tokens_out":830,"cost":0.046942,"stop_reason":"end_turn"},"m4":{"text":"## Personal Property Coverage (Coverage C) — Limit: $260,500 (Actual Cash Value), Deductible: $1,000\n\n**What IS Covered:**\n- Personal property owned by or in the care of an insured, while **on the insured premises** (Coverage C.1)\n- At your option: guests' and domestic employees' property while on the exclusively-occupied portion of the premises\n- Detachable building items (awnings, screens, storm doors/windows, window A/C units)\n- Carpeting, curtains, and drapes\n- Outdoor equipment not permanently installed\n- Property **away from the premises**, applied worldwide (does not increase the limit) — Coverage C.2\n- Property at **another insured's residence**: limited to 10% of Coverage C or $2,500, whichever is greater\n- Property moved to a **newly acquired principal residence**: the 10%/$2,500 cap above is waived for 30 days after you begin moving property there\n\n**Special Dollar Limits (per occurrence, do NOT increase the overall Coverage C limit):**\n- $100 — money, bank notes, bullion, gold/silver (other than gold/silverware), platinum, coins, medals\n- $500 — securities, stamps, tickets, deeds, manuscripts, and other valuable papers\n- $500 — **theft** of jewelry, watches, precious/semi-precious stones, gems, and furs\n- $1,000 — **theft** of guns and gun accessories\n- $500 — watercraft, trailers, equipment, accessories, outboard motors\n- $1,000 — **theft** of silverware, goldware, pewterware, gold/silver-plated items\n- $5,000 — motorized vehicles used exclusively to service the premises (not licensed for public roads)\n- $1,000 — grave markers\n- $500 — business property (covered only while on the insured premises)\n- $500 — dismounted camper bodies/trailers not used with watercraft (on premises only)\n\n**What is NOT Covered (Coverage C exclusions):**\n- Property under scheduled insurance\n- Animals, insects, birds, fish\n- Motorized vehicles/parts (except servicing vehicles noted above, or vehicles designed to assist the handicapped)\n- Aircraft and parts\n- Business property **away from** the premises\n- Property of roomers/boarders/tenants (except those related to an insured)\n- Outdoor antennas (including satellite dishes)\n- Trees, plants, shrubs, and lawns (though separately covered up to 10% of Coverage C under Incidental Coverages, for specific perils, max $500/item)\n- Electronic devices/accessories operable from a motorized vehicle's, farm equipment's, or watercraft's electrical system\n- Loss resulting from **credit cards**\n- Property in an apartment regularly rented/held for rental by an insured\n- Property rented/held for rental **off** the residence premises\n- Books of account, drawings, paper records, or electronic data-processing media containing **business data** (blank/unexposed media IS covered)\n\n**Important:** Theft of personal property occurring **away from the insured premises is not covered** under Peril 10 (Theft).\n\n**Note:** All special limits and exclusions apply regardless of the overall $260,500 Coverage C limit, and the $1,000 Property Coverages deductible applies to any covered loss.","model":"claude-sonnet-5","ms":9223.85219996795,"tokens_in":19312,"tokens_out":1132,"cost":0.049944,"stop_reason":"end_turn"},"m5":{"text":"**Dollar Amount (Coverage D):**\n$104,200 — per the Declarations, \"Additional Living Expense and Loss of Rent.\"\n\n**What Is Covered (General Policy Provisions, Coverage D):**\n\n1. **Additional Living Expense** — Pays necessary and reasonable increased living expenses incurred so your household can maintain its normal standard of living, if the insured premises are made unfit for occupancy by a loss insured under the policy. Payable for the time reasonably required to repair/replace the premises or for your household to resettle, whichever is less (coverage is not limited by the policy's expiration date).\n\n2. **Loss of Rent** — Pays the actual loss of rents sustained if a rented portion of the insured premises is made unfit for occupancy by an insured loss, for the time reasonably required to restore it to tenantable condition or for the household to resettle, whichever is less.\n\n3. **Civil Authority Prohibition** — If a loss insured against damages *adjoining* premises and civil authority prohibits use of your insured premises as a result, this coverage pays Additional Living Expense and/or Loss of Rent for up to two weeks.\n\n**What Is NOT Covered:**\n- Expenses resulting from the **cancellation of a lease or agreement** are not covered.\n\n**Other Applicable Terms:**\n- The **$1,000 Property Coverages Deductible** applies to Coverage D, per \"How Much We Pay for Loss or Claim,\" item 1.c.\n- **Payment timing:** If the premises remain unfit for occupancy for more than one month, Additional Living Expense payments are made monthly upon your submission of reasonable proof of expenses incurred (per \"Payment of Loss or Claim\").\n- Coverage D applies only when the unfitness for occupancy results from a loss caused by a peril insured against under the Perils Section (Form ML-2T).","model":"claude-sonnet-5","ms":6415.196199901402,"tokens_in":19330,"tokens_out":618,"cost":0.04484,"stop_reason":"end_turn"},"m6":{"text":"Based on the policy's General Policy Provisions, Policy Conditions:\n\n**Assignment**\nNo. Per \"Assignment\" (Condition 1, applicable to all coverages): *\"Assignment — not valid without our written consent.\"* You cannot transfer/assign this policy to someone else unless Otsego Mutual agrees in writing.\n\n**Abandonment of Property**\nNo, you cannot abandon damaged property to the insurer for a payout. Per Condition 12, \"Abandonment of Property\" (applicable to Property Coverages only): *\"...the insured may not abandon covered property to us unless we specifically agree.\"*\n\nHowever, the same provision gives the **insurer** an option, not the insured: *\"we may take property at agreed/appraised value.\"* This right belongs to Otsego Mutual under \"Payment of Loss or Claim\" (Property Coverages, item 1.d, \"Our Options\"), where the company may elect to *\"take damaged property at agreed/appraised value; such property becomes ours.\"* This is the insurer's choice — you cannot force this outcome by unilaterally abandoning the property.\n\n**Summary:** Both actions require the company's consent — you cannot assign the policy or abandon damaged property without Otsego Mutual's written agreement.","model":"claude-sonnet-5","ms":4245.193100068718,"tokens_in":19332,"tokens_out":407,"cost":0.042733999999999994,"stop_reason":"end_turn"},"h1":{"text":"## Short answer: Earthquake damage itself is not covered.\n\n**1. Earthquake is not a listed peril.**\nYour Perils Section is form **ML-2T (6/90)**, a named-perils form. It insures \"direct physical loss to covered property caused by the following perils\" — the 17 listed perils (Fire or Lightning; Windstorm or Hail; Explosion; Riot; Aircraft; Vehicles; Smoke; Vandalism; Glass Breakage; Theft; Falling Objects; Weight of Ice, Snow or Sleet; Collapse; Tearing Apart of a heating/AC system; Accidental Discharge; Freezing; Electrical Currents). **Earthquake is not among them**, so Coverages A ($521,000), B ($52,100) and C ($260,500) do not respond.\n\n**2. It is also affirmatively excluded.**\nUnder **Exclusions That Apply to Property Coverages**, item 6 \"Earth Movement of Any Kind,\" as **deleted and replaced by endorsement ML-73 (5/10)**, the exclusion includes \"**a. earthquake, including tremors or land shock waves before/during/after a volcanic eruption**,\" as well as landslide/mudslide/mudflow, subsidence, sinkhole, erosion, and any other earth sinking, rising or shifting from any human, animal or natural act. The exclusions are stated to apply \"**regardless of contributing causes/events before, during or after the loss**,\" so an earthquake-related loss is excluded even if another cause contributes.\n\n**3. The narrow exceptions — fire, explosion, and theft.**\nML-73 preserves this carve-back: \"**We pay for direct loss by fire, explosion, and (if covered) theft resulting from earth movement.**\" So:\n- If the quake causes a **fire** that destroys the house, that fire loss is covered (Peril 1).\n- If it causes an **explosion** (e.g., ruptured gas line), that explosion loss is covered (Peril 3) — but \"explosion does not include volcanic eruption/effusion.\"\n- **Theft/looting** loss after the quake is covered subject to Peril 10 and the Coverage C special limits (e.g., $100 money, $500 theft of jewelry/watches/furs, $1,000 theft of guns, $1,000 theft of silverware).\nDamage from the shaking itself — including resulting collapse — is not paid. Peril 13 (Collapse) expressly states \"**No payment for collapse resulting from an excluded cause or event.**\" Likewise, water damage from quake-broken pipes is not covered, as the earth movement exclusion applies regardless of contributing causes.\n\n**4. If a covered fire/explosion loss does occur:**\n- The **$1,000 Property Coverages deductible** applies, deducted per endorsement **OTS-77 (7/81)** from the applicable Limit of Liability or the adjusted claim, whichever is less; only one deductible per occurrence.\n- The **Replacement Cost Provision** applies to Coverage A/B buildings if your limit is at least 80% of replacement cost at time of loss; otherwise you receive the larger of actual cash value or the 80% proportional amount. Any additional replacement-cost claim must be made **within 180 days after the loss**.\n- **Coverage D ($104,200)** pays necessary increased living expenses only if the premises are made unfit by an **insured** loss.\n- The **Ordinance or Law** exclusion (item 1) bars increased cost from current building-code compliance when rebuilding.\n\n**5. Earthquake coverage is not available under any attached endorsement.** No earthquake endorsement is listed on your Declarations; separate coverage would have to be purchased. (Note also **FMD-1**: flood and mudslide — including tsunami-type inundation — are not covered.)","model":"claude-opus-5","ms":22844.724000198767,"tokens_in":19312,"tokens_out":1758,"cost":0.14051000000000002,"stop_reason":"end_turn"},"h2":{"text":"**Two different parts of your policy are in play — and they work in opposite directions.**\n\n**1. Liability coverage (Coverages L and M): no coverage.**\nExclusion \"o.\" under *Exclusions Applying to Both Personal Liability and Medical Payments to Others*, as amended by the **New York Amendatory Endorsement (ML-84, 10/87)**, states the policy \"does not apply to liability arising directly or indirectly out of instances, occurrences or allegations of criminal activity by the insured or by employees of the insured named in this policy.\" That exclusion applies \"whether claims are made directly or indirectly/derivatively (e.g., as negligence or breach-of-contract claims)\" — so framing it as negligent hiring or supervision does not restore coverage.\n\nIn any case, Coverage L would not pay for damage to your own property: Exclusion 2.c. (Applying Only to Personal Liability) bars liability \"for damage to property owned by any insured.\" The *Damage to Property of Others* incidental coverage ($500 per occurrence) also excludes property owned by an insured and property covered under Property Coverages.\n\n**2. Property coverage (Coverages A, B, C): potentially covered.**\nDamage to your own property is handled under the Perils Section (ML-2T 6/90), not the liability section, and the ML-84 criminal-activity exclusion is a *liability* exclusion only. Relevant perils:\n\n- **Peril 8 — Vandalism and Malicious Mischief:** covered, unless the insured premises were vacant more than 30 consecutive days immediately before the loss.\n- **Peril 10 — Theft** (including attempted theft): the only \"insider\" bar is theft committed by **an insured**. A domestic employee is an \"insured\" *only* \"Under Personal Liability/Medical Payments to Others\" (Definition 6.b), so an employee's theft is not excluded under the property perils. Other theft limits still apply (vacancy over 30 days, residence under construction, loss of a stone from its setting, credit/debit card theft).\n- **Peril 9 — Glass Breakage** may apply to broken glass/glazing.\n- **Property Exclusion 12 — Intentional Acts** bars only loss \"committed by or at the direction of an insured intending to cause loss\" — so it bites only if you directed the act.\n\n**Limits and settlement.** Coverage A $521,000 and Coverage B $52,100 are settled on Replacement Cost (if the limit is at least 80% of replacement cost); Coverage C $260,500 is Actual Cash Value. Coverage C special theft limits per occurrence: **$100** money/coins/bullion; **$500** securities and valuable papers; **$500** jewelry, watches, precious/semi-precious stones, gems, furs; **$1,000** guns and accessories; **$1,000** silverware/goldware/pewterware. Credit card misuse is covered up to **$1,000** under Incidental Property Coverage 4 (which excludes loss from an insured's dishonesty and business-related loss). Coverage D ($104,200) applies if the home is made unfit for occupancy.\n\n**Your duties.** $1,000 deductible per occurrence (OTS-77 7/81). You must promptly notify us and **notify the police** (loss involving a law violation), submit a statement/proof of loss within 60 days with a detailed inventory and receipts, submit to examination under oath, and assist in enforcing recovery rights (Subrogation, Condition 9) against the employee. Suit against us must be brought within 2 years of the loss.","model":"claude-opus-5","ms":23434.206300182268,"tokens_in":19325,"tokens_out":2129,"cost":0.14985,"stop_reason":"end_turn"},"h3":{"text":"**Yes — several deadlines apply to a property damage claim.**\n\n**1. Prompt notice (no fixed number of days).**\nUnder *What You Must Do In Case of Loss*, item 1 (Notice), the insured must **promptly** notify us or our agent (in writing if we request it), notify the police if the loss involves a violation of law, and notify the credit card company if a credit card loss is involved. The notice must state your name, the kind and number of the policy, the time, place and circumstances of the loss, and names/addresses of potential claimants and witnesses.\n\n**2. Statement of loss — 60 days.**\nUnder *Additional Duties — Property Coverages* (item 4), you must submit a **statement of loss (under oath if requested) within 60 days**. At our request you must also submit an **acceptable proof of loss within 60 days**, including time/place/circumstances, all interests (mortgages/liens), other applicable insurance, title/occupancy changes, plans and specifications, detailed repair estimates, and a detailed inventory of damaged property with supporting bills and receipts. You must also protect the property from further damage, submit to examination under oath, exhibit damaged property, and produce records.\n\n**3. Replacement cost claims — 180 days.**\nUnder the Replacement Cost Provision (Perils Section ML-2T), item 5: you may claim **actual cash value** before repairs are made, but a claim for **any additional amount under the Replacement Cost Provision must be made within 180 days after the loss**. Item 4 also states that where the repair/replacement cost exceeds the lesser of $1,000 or 5% of the applicable limit, we are not liable for more than actual cash value **until actual repair or replacement is completed**. So missing the 180-day window means you are limited to actual cash value (depreciated), not full replacement cost — a significant reduction on your Coverage A ($521,000) or Coverage B ($52,100) building loss.\n\n**4. Suit against us — 2 years.**\nPolicy Conditions, item 10(a): for Property Coverages, **no suit may be brought unless the policy terms have been fully complied with and the suit is commenced within 2 years after the loss.** Note the two parts: failing to comply with the duties above (notice, proof of loss, examination under oath, records) can itself bar a suit, independent of the 2-year clock.\n\n**5. Related timing.**\nPayment is made **45 days after acceptable proof of loss** and the amount is established (Payment of Loss or Claim, 1.a). If we elect to rebuild/repair/replace instead of paying money, we must notify you **within 30 days** of an acceptable proof of loss. Under the Mortgage Clause / Secured Party Coverage, a named mortgagee or secured party preserves its own rights by submitting a **timely sworn proof of loss**, even if your claim is denied.\n\n**Caution:** The NY Statutory Endorsement (NY STAT-1) provision that late notice doesn't invalidate a claim absent prejudice applies to **liability-policy notice**, not property claims. Also, under Policy Condition 5, fraud, false swearing, or willful misrepresentation of a material fact before or after a loss voids the **entire policy**.","model":"claude-opus-5","ms":16134.120100177824,"tokens_in":19329,"tokens_out":1355,"cost":0.13052000000000002,"stop_reason":"end_turn"},"h4":{"text":"**1. The fire itself is a covered peril.** Peril 1, \"Fire or Lightning\" (Form ML‑2T), is insured, so direct physical loss to covered property is payable, subject to the $1,000 Property Coverages Deductible.\n\n**2. Cash — capped at $100 total.** Coverage C, Limitations on Certain Property, item 5.a: **$100** for \"money, bank notes, bullion, gold (other than goldware), silver (other than silverware), platinum, coins, medals, numismatic property.\" That special limit is \"the total limit per occurrence for all property in that category\" — it is **not** per person. So your cash and all four friends' cash together are limited to $100. Note that under the Deductible Endorsement OTS‑77, the deductible \"is deducted from the applicable Limit of Liability or the adjusted claim, whichever is less\" — a $100 money loss would be entirely absorbed by the $1,000 deductible, so in practice nothing is paid for the cash.\n\n**3. Jewelry and watches — the $500 limit does NOT apply here.** Item 5.c reads \"$500 — **theft** of jewelry, watches, precious/semi‑precious stones, gems and furs.\" Because this is a fire loss, not theft, the special limit is not triggered. Jewelry and watches are therefore covered as ordinary Coverage C personal property up to the **$260,500** Coverage C limit, settled at **actual cash value** (the Declarations show Coverage C as Actual Cash Value; the Replacement Cost Provision applies only to Coverage A and B buildings).\n\n**4. Your friends' property.** Coverage C.1 states that, **at your option**, the policy covers \"guests' and domestic employees' property while on the exclusively‑occupied portion of the premises.\" Under Payment of Loss 1.c, damage to personal property of others may, at our option, be adjusted and paid to you for the owner's account or paid directly to the owner. Their property shares your limits — it does not add coverage.\n\n**5. The two cars — not covered under property coverage.** Coverage C, \"Personal Property Not Covered,\" excludes \"motorized vehicles/parts,\" with only two exceptions: vehicles used exclusively to service the insured premises and not licensed for public roads (special limit **$5,000**, item 5.g), and vehicles designed for assisting the handicapped. Licensed automobiles fall outside both exceptions, so neither your car nor a guest's car is paid under Coverages A, B, or C. Auto physical damage would have to come from an auto policy.\n\nTwo liability items may be relevant for a **guest's** car (never your own):\n- **Damage to Property of Others** (Incidental Liability Coverage 1): up to **$500 per occurrence** regardless of legal liability, but it excludes property owned by an insured or another household resident.\n- **Coverage L — Personal Liability**, $500,000 per occurrence, if an insured is legally liable; Exclusion 2.c bars damage to property owned by any insured. Per NY endorsement ML‑84, this liability coverage is **excess** over other valid and collectible insurance.\n\n**6. Other points.** One deductible applies per occurrence. Coverage D (**$104,200**) pays increased living expenses if the premises are unfit. You must give prompt notice, notify police if a law violation is involved, submit a statement/proof of loss with a detailed inventory and bills within 60 days if requested, and any suit must begin within 2 years of the loss.","model":"claude-opus-5","ms":26426.123399985954,"tokens_in":19378,"tokens_out":2296,"cost":0.15429,"stop_reason":"end_turn"},"h5":{"text":"**Short answer: Yes, the break‑in is a covered loss — but the recoverable amounts are very small because of special limits and your $1,000 deductible.**\n\n**The covered peril.** Peril 10 — Theft (Perils Section ML‑2T) covers theft, including attempted theft, on the insured premises. None of the theft exclusions appear to apply here (no theft by an insured, no residence under construction, no premises vacant more than 30 consecutive days).\n\n**1. Jewelry — special limit $500.**\nCoverage C, Limitations on Certain Property, item 5.c.: \"$500 — theft of jewelry, watches, precious/semi‑precious stones, gems and furs.\" This is the total limit per occurrence for everything in that category and does not increase your $260,500 Coverage C limit. Note also exclusion 10.c. under the Theft peril: loss of a precious or semi‑precious stone from its setting is not covered.\n\n**2. Cash — special limit $100.**\nCoverage C, item 5.a.: \"$100 — money, bank notes, bullion, gold (other than goldware), silver (other than silverware), platinum, coins, medals, numismatic property.\" That is the maximum per occurrence regardless of how much cash was taken.\n\n**Effect of the $1,000 deductible on items 1 and 2.** The Declarations show a $1,000 Property Coverages Deductible, which applies to Coverage C. Endorsement OTS‑77 (7/81) states the deductible \"is deducted from the applicable Limit of Liability or the adjusted claim, whichever is less,\" and only one deductible applies per occurrence. Because the applicable special limits ($500 jewelry + $100 money = $600) are less than the $1,000 deductible, no payment would be due for the jewelry and cash unless other covered stolen personal property in the same occurrence brings the adjusted claim above $1,000.\n\n**3. Credit card use and forged checks — $1,000 maximum, combined.**\nStolen cards/checks are not paid as personal property: Coverage C, Personal Property Not Covered, excludes \"loss resulting from credit cards,\" and Theft exclusions f. and g. exclude theft of a credit card or debit card \"except as provided under Incidental Property Coverages.\"\n\nThe applicable coverage is Incidental Property Coverage 4 — Credit Card, Forgery and Counterfeit Money: \"pays up to $1,000 for (a) unauthorized use of credit cards issued/registered in the insured's name; (b) forgery/alteration of checks, drafts, CDs, notes; or (c) good‑faith acceptance of counterfeit US/Canadian paper currency.\" So the $10,000 of card charges and the two $5,000 forged checks are subject to a single $1,000 maximum, not $1,000 each. Exclusions: loss from an insured's dishonesty, business activities, non‑compliance with the card issuance terms, or loss while a non‑insured holds the card with an insured's permission. This coverage is not listed among the coverages the deductible applies to under \"How Much We Pay.\"\n\n**Your duties.** Under \"What You Must Do In Case of Loss\": promptly notify us, notify the police (law violation), notify the credit card company, submit a statement/proof of loss within 60 days with a detailed inventory and supporting bills/receipts, and submit evidence/affidavit for the Credit Card, Forgery and Counterfeit Money claim.","model":"claude-opus-5","ms":21397.23809994757,"tokens_in":19393,"tokens_out":1906,"cost":0.14461500000000002,"stop_reason":"end_turn"},"h6":{"text":"**Short answer: the tenant's injury may be covered under Coverage L (Personal Liability), the AC itself is almost certainly not covered, and no deductible applies to the liability side.**\n\n**1. The tenant's hospital costs**\n\n*Coverage M — Medical Payments to Others ($1,000 each person):* This normally pays medical expenses for \"a person on the insured premises with an insured's permission.\" However, **Exclusion 3.a. (Exclusions Applying Only to Medical Payments to Others)** bars bodily injury \"to an insured or other regular resident of the premises (except a domestic employee).\" A tenant living in the house is a regular resident, so Coverage M would not respond. Exclusion 3.b. (person on the premises because a business is conducted there) may also apply, since \"Business\" in Policy Definition 3 includes rental of property to others.\n\n*Coverage L — Personal Liability ($500,000 each occurrence):* Pays all sums you are **legally liable** for because of bodily injury caused by an occurrence, and we defend any suit seeking such damages. The business exclusion (Exclusion 1.f.) is overcome by **Incidental Business Coverage (Incidental Liability Coverages, item 7)**, which covers \"rental of another portion for residential purposes (max 2 roomers/boarders per family unit).\" Exclusion 2.a. (injury to you, resident relatives, or persons under 21 in your care) does not bar a tenant's claim. So if you are found legally liable for negligently installing the unit, the tenant's medical damages are payable up to $500,000 per occurrence, plus **Claims and Defense Expense Coverage** and **First Aid Expense Coverage** (first-aid expenses paid regardless of legal liability, for persons other than insureds).\n\n**2. The air conditioner itself**\n\nA window air conditioner is a \"detachable building item\" insured under **Coverage C — Personal Property ($260,500, Actual Cash Value)** — but only for loss caused by one of the 17 named perils in the ML-2T Perils Section. Simply dropping it is not a listed peril. **Peril 11 (Falling Objects) expressly does not cover loss \"d. to the object which falls,\"** and does not cover a building's interior/contents unless the object first damaged the outside walls or roof by impact. So the AC's own damage is not covered.\n\nTwo further points:\n- If the AC belongs to the tenant, Coverage C excludes \"property of roomers/boarders/tenants (except roomers/boarders related to an insured).\"\n- **Damage to Property of Others** (Incidental Liability Coverage 1, $500 per occurrence) excludes property \"owned/rented/leased by an insured, another household resident, or a tenant of an insured,\" so it does not help here either.\n- The **Replacement Cost Provision** expressly does not apply to detachable building items such as window air conditioners.\n\n**3. Deductible**\n\nThe **$1,000 Property Coverages Deductible** applies only to Coverages A, B, C and certain Incidental Property Coverages. Per **endorsement OTS-77 (7/81)**, it is deducted from the applicable limit or the adjusted claim, whichever is less, with only one deductible per occurrence. **No deductible applies to Coverage L or Coverage M.** Since the AC damage isn't a covered peril, the deductible is moot there.","model":"claude-opus-5","ms":23778.54819991626,"tokens_in":19371,"tokens_out":2233,"cost":0.15268,"stop_reason":"end_turn"}},"factcheck":{"e1_amount":{"jev":{"verdict":"stated_correct","confidence":1.0,"ms":197.42810004390776,"tokens_in":990,"tokens_out":47,"cost":3.96e-05,"mocked":false},"claude":{"verdict":"stated_correct","ms":559.0326997917145,"tokens_in":1372,"tokens_out":35,"cost":0.001547},"gemini":{"verdict":"stated_correct","ms":1391.8779001105577,"tokens_in":716,"tokens_out":14,"cost":0.001172}},"e2_amount":{"jev":{"verdict":"stated_correct","confidence":1.0,"ms":391.8427999597043,"tokens_in":620,"tokens_out":47,"cost":2.48e-05,"mocked":false},"claude":{"verdict":"stated_correct","ms":622.378199826926,"tokens_in":1013,"tokens_out":35,"cost":0.001188},"gemini":{"verdict":"stated_correct","ms":1049.232300138101,"tokens_in":349,"tokens_out":14,"cost":0.0006215}},"e3_included":{"jev":{"verdict":"stated_correct","confidence":1.0,"ms":226.15210013464093,"tokens_in":954,"tokens_out":47,"cost":3.816e-05,"mocked":false},"claude":{"verdict":"stated_correct","ms":533.8812000118196,"tokens_in":1351,"tokens_out":35,"cost":0.001526},"gemini":{"verdict":"stated_correct","ms":1515.7308001071215,"tokens_in":672,"tokens_out":14,"cost":0.001106}},"e4_covered":{"jev":{"verdict":"stated_correct","confidence":0.44,"ms":196.61529990844429,"tokens_in":1052,"tokens_out":47,"cost":4.2080000000000004e-05,"mocked":false},"claude":{"verdict":"stated_wrong","ms":717.9646000731736,"to // ---------- Question bank: embedded in DATA.questions, same shape GET
// /api/test2/questions used to return ----------
let QUESTIONS = [];

function adoptQuestions(payload){
  // Map backend field names onto the shapes the renderers already use.
  QUESTIONS = (payload.questions || []).map(q => ({
    id: q.id, tier: q.tier, text: q.text,
    gold: q.canonical_answer,
    subclaims: (q.subclaims || []).map(sc => ({ id: sc.id, fact: sc.required_fact })),
  }));
}

// PLACEHOLDER ONLY — what the tier mapping SAYS should answer, shown before a card has a
// result. It duplicates scripts/config.py's CLAUDE_ANSWER_MODEL_BY_TIER, so a version bump
// there would leave this confidently wrong with nothing to catch it. Once a result exists,
// renderStep3() and onAnswer() both report res.model via PRETTY_MODEL() instead — the model
// that ACTUALLY answered, which is also what the cost strip is keyed by.
const ANSWER_MODEL = { easy:"Claude Haiku 4.5", medium:"Claude Sonnet 5", hard:"Claude Opus 5" };
const TIER_COLOR = { easy:"var(--tier-easy)", medium:"var(--tier-medium)", hard:"var(--tier-hard)" };
const TIER_DIM   = { easy:"var(--tier-easy-dim)", medium:"var(--tier-medium-dim)", hard:"var(--tier-hard-dim)" };

// Below this, a Jev judge verdict is marked uncertain. Only Jev reports a judging
// confidence at all; Claude and Gemini are never asked for one. Set at 0.95 because the
// judging distribution is bimodal rather than graded -- a probe over 21 real sub-claims
// returned 1.00 / 0.99 / 0.96 for the confident calls and 0.54 / 0.46 for the hesitant
// ones, with nothing in between -- so this separates the two modes rather than slicing a
// continuum. Contrast ROUTING confidence, which spans 0.06-0.96 continuously and is
// therefore drawn as a bar.
const JEV_JUDGE_UNCERTAIN = 0.95;


function sleep(ms){ return new Promise(r=>setTimeout(r, ms/ speed())); }
function speed(){ return Number(document.getElementById("speedSelect").value); }

// ---------- global state ----------
const state = {
  step: 1,
  totals: { jev:{calls:0,cost:0,ms:0,tokens:0}, claude:{calls:0,cost:0,ms:0,tokens:0}, gemini:{calls:0,cost:0,ms:0,tokens:0} },
  routing: {},        // qid -> {jev:{tier,ms,cost}, claude:{...}, gemini:{...}}
  routingRunning:false, routingDone:false,
  answers: {},        // qid -> {text, ms, cost, tokensIn, tokensOut}
  answersRunning:false, answersDone:false,
  judged: {},         // qid -> true
  judgeResults: {},   // subclaimId -> {jev, claude, gemini} + per-model Ms/Cost/Tokens/Conf
  goldLabels: {},     // subclaimId -> human verdict, from GET /api/test2/gold-labels
  // Fact-check checkbox selection and per-card expand state live in `state`, NOT in the DOM.
  // render() rebuilds all five steps' markup on every tab switch, so anything held only as a
  // DOM property (checkbox.checked, dataset.open) is silently thrown away — selecting a batch
  // of questions, flipping to Step 2 to point something out, and coming back would drop the
  // whole selection and reset the count to "0 selected" mid-demo.
  fcSelected: {},     // qid -> true
  fcOpen: {},         // qid -> true (sub-claim panel expanded)
  summaryHTML: null,  // cached Step 5 output; invalidated whenever new judgments land
};

// Totals are DERIVED from state, never accumulated independently — recompute from scratch every
// time something changes. This is what makes Reset (or any future per-step reset) correct for free:
// clearing a step's data and recomputing can never "forget" to also roll back its contribution.
const MODELS3 = ["jev","claude","gemini"];
const blankTotals = () => Object.fromEntries(MODELS3.map(m => [m, {calls:0,cost:0,ms:0,tokens:0}]));
const addTo = (bag, key, cost, ms, tokens) => {
  const t = bag[key] = bag[key] || {calls:0,cost:0,ms:0,tokens:0};
  t.calls++; t.cost += cost||0; t.ms += ms||0; t.tokens += tokens||0;
};

function recomputeTotals(){
  const routing = blankTotals(), factcheck = blankTotals(), answers = {};

  Object.values(state.routing).forEach(perModel => {
    MODELS3.forEach(m => { const r = perModel[m];
      if(r) addTo(routing, m, r.cost, r.ms, (r.tokensIn||0)+(r.tokensOut||0)); });
  });
  Object.values(state.judgeResults).forEach(r => {
    MODELS3.forEach(m => { if(r[m] !== undefined)
      addTo(factcheck, m, r[m+"Cost"], r[m+"Ms"], r[m+"Tokens"]); });
  });
  // Answers are keyed by the ACTUAL model id (Haiku / Sonnet / Opus), not by vendor —
  // "which tier model cost what" is the interesting breakdown for this step, and it is
  // the comparison that answers "do the hard questions really need Opus?".
  Object.values(state.answers).forEach(a =>
    addTo(answers, a.model || "claude", a.cost, a.ms, (a.tokensIn||0)+(a.tokensOut||0)));

  state.stepTotals = { routing, answers, factcheck };

  // The headline three-way comparison sums ONLY the steps all three models actually run.
  // Answer generation is single-vendor by design, so folding it in would compare Claude's
  // total workload against Jev's and Gemini's share of a different, smaller job. Measured
  // on the first full run that inflated Claude-vs-Jev from a true 55x to a meaningless
  // 3844x, because one Opus answer costs more than every routing call combined.
  const totals = blankTotals();
  MODELS3.forEach(m => {
    ["calls","cost","ms","tokens"].forEach(k => {
      totals[m][k] = (routing[m]?.[k] || 0) + (factcheck[m]?.[k] || 0);
    });
  });
  state.totals = totals;
}

// Shared renderer for the per-step cost/speed strips. `bag` is {label: {calls,cost,ms,tokens}}.
function totalsStrip(bag, colorFor, note, labelFor = k => k){
  const keys = Object.keys(bag).filter(k => bag[k].calls > 0);
  if(!keys.length) return "";
  const cells = keys.map(k => `<span class="score-chip">
      <span class="dot" style="background:${colorFor(k)}"></span>${labelFor(k)}
      <span class="val mono">${bag[k].calls}</span> calls ·
      <span class="val mono">${bag[k].tokens.toLocaleString()}</span> tok ·
      <span class="val mono">$${bag[k].cost.toFixed(4)}</span> ·
      <span class="val mono">${(bag[k].ms/1000).toFixed(1)}s</span>
    </span>`).join("");
  return `<div class="step-totals">${cells}${note ? `<span class="strip-note">${note}</span>` : ""}</div>`;
}

const MODEL_COLOR = {jev:"var(--jev)", claude:"var(--claude)", gemini:"var(--gemini)"};

const STRIP_NOTE = {
  routing:   "this step only · all 3 models compete",
  answers:   "this step only · single-vendor by design, excluded from the top-bar comparison",
  factcheck: "this step only · all 3 models judge every sub-claim",
};

function stripFor(step){
  const bag = (state.stepTotals || {})[step] || {};
  // Only the answers bag is keyed by raw model id; routing/factcheck are keyed by vendor
  // ("jev"/"claude"/"gemini"), which is already the display name.
  const colorFor = step === "answers" ? ANSWER_MODEL_COLOR : (k => MODEL_COLOR[k]);
  const labelFor = step === "answers" ? PRETTY_MODEL : (k => k);
  return totalsStrip(bag, colorFor, STRIP_NOTE[step], labelFor);
}

// Called wherever renderScoreboard() is, so the subtotal and the headline total move together.
function refreshStrips(){
  ["routing","answers","factcheck"].forEach(step => {
    const el = document.getElementById(`strip-${step}`);
    if(el) el.innerHTML = stripFor(step);
  });
}
const ANSWER_MODEL_COLOR = id =>
  /haiku/i.test(id) ? "var(--tier-easy)" : /sonnet/i.test(id) ? "var(--tier-medium)" : "var(--tier-hard)";

// Display name for a REAL model id coming back from the backend ("claude-haiku-4-5-20251001"
// -> "Claude Haiku 4.5"). Matched on family rather than exact id so a version bump in
// config.py's CLAUDE_ANSWER_MODEL_BY_TIER still renders, and falls back to the raw id rather
// than inventing a name for a model it does not recognise.
const PRETTY_MODEL = id =>
  /haiku/i.test(id) ? "Claude Haiku 4.5"
  : /sonnet/i.test(id) ? "Claude Sonnet 5"
  : /opus/i.test(id) ? "Claude Opus 5"
  : id;

// Every number shown in the UI comes from a real model call made when the saved run
// was recorded; this page only re-animates it. Backend field names are snake_case on
// the wire; the renderers use camelCase.
function adopt(r){
  return { ...r, tokensIn: r.tokens_in ?? 0, tokensOut: r.tokens_out ?? 0,
           ms: r.ms ?? 0, cost: r.cost ?? 0 };
}

// ---------- auto-follow: keep whatever is currently generating in view ----------
// Results arrive one after another down a page taller than the viewport, so without this
// you have to chase them by hand — tolerable when clicking through, useless when screen
// recording. Standard follow semantics: on by default, switches OFF the moment the viewer
// scrolls up to read something, back ON when they return near the bottom.
let followLatest = true, autoScrolling = false, autoScrollTimer = null;

// Tween the scroll ourselves instead of using scrollTo({behavior:"smooth"}). Native smooth
// scrolling is a no-op in some embedded/preview contexts and is suppressed entirely for
// viewers with prefers-reduced-motion, either of which would leave the page stuck while
// results scrolled past off-screen. The legacy two-argument scrollTo always works, so
// driving it from requestAnimationFrame gives motion that is both reliable and consistent
// on video rather than dependent on the browser's own easing.
const SCROLL_MS = 420;
// One tween per scroll target. The page and each inner frame animate independently, so a
// single shared rAF handle would have them cancelling each other mid-run.
const scrollJobs = new Map();

function tweenScroll(box, y){
  const isWin = (box === window);
  const get = () => isWin ? window.scrollY : box.scrollTop;
  const set = v => { if(isWin) window.scrollTo(0, v); else box.scrollTop = v; };

  const prev = scrollJobs.get(box);
  if(prev){ cancelAnimationFrame(prev.raf); clearTimeout(prev.timer); }

  const start = get(), delta = y - start, t0 = performance.now();
  if(Math.abs(delta) < 4) return;
  const ease = t => (t < 0.5) ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;   // easeInOutQuad
  const job = {};
  const step = now => {
    const t = Math.min(1, (now - t0) / SCROLL_MS);
    set(start + delta * ease(t));
    if(t < 1) job.raf = requestAnimationFrame(step);
  };
  job.raf = requestAnimationFrame(step);
  // requestAnimationFrame is throttled to ZERO frames in a hidden/background tab, and some
  // embedded contexts never paint at all — in either case the tween above silently does
  // nothing and results scroll past off-screen. Guarantee the destination regardless.
  job.timer = setTimeout(() => { if(Math.abs(get() - y) > 8) set(y); }, SCROLL_MS + 120);
  scrollJobs.set(box, job);
}

function smoothScrollTo(y){ tweenScroll(window, y); }

// Scrollable ancestors, innermost first. The routing columns (.race-rows, 400px) and the
// sub-claim lists (.subclaims-scroll, 340px) CLIP their contents, so scrolling the window
// alone leaves later rows hidden inside the frame — which is exactly what happened for
// rows 9-18 of each routing column and for m4's 16 sub-claims.
function scrollParents(el){
  const out = [];
  for(let p = el.parentElement; p; p = p.parentElement){
    const oy = getComputedStyle(p).overflowY;
    if((oy === "auto" || oy === "scroll") && p.scrollHeight > p.clientHeight + 2) out.push(p);
  }
  return out;
}

// Centre `el` inside every frame that clips it. Returns the outermost such frame (or the
// element itself) so the caller can decide whether the PAGE also needs to move.
function followInner(el){
  if(!followLatest || !el) return null;
  const boxes = scrollParents(el);
  boxes.forEach(box => {
    const rel = el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop;
    tweenScroll(box, Math.max(0, rel - box.clientHeight/2 + el.offsetHeight/2));
  });
  return boxes.length ? boxes[boxes.length - 1] : el;
}

function viewportH(){
  // Some embedded/preview contexts report window.innerHeight as 0, which silently breaks
  // the centring maths. documentElement.clientHeight is the usual fallback, but in those
  // same contexts it can equal the FULL document height (the whole page is laid out at
  // once), which would centre every card at scroll position 0. Treat an implausible value
  // as "unknown" and let followEl() fall back to top-align, which is always sane.
  const h = window.innerHeight || 0;
  if(h) return h;
  const c = document.documentElement.clientHeight || 0;
  return (c && c < document.body.offsetHeight * 0.9) ? c : 0;
}

window.addEventListener("scroll", () => {
  // Ignore the scroll events our own smooth-scroll generates, otherwise the first
  // followEl() would land the card mid-viewport, read that as "user scrolled up",
  // and disable itself after exactly one answer.
  if(autoScrolling) return;
  const vh = viewportH();
  if(!vh) return;                       // viewport unmeasurable — leave follow state alone
  followLatest = (vh + window.scrollY) >= (document.body.offsetHeight - 150);
}, {passive:true});

function followEl(el){
  if(!followLatest || !el) return;
  autoScrolling = true;
  clearTimeout(autoScrollTimer);
  // Inner frames first, then move the PAGE so the outermost frame is itself on screen.
  // Anchoring the page scroll to the frame rather than the row matters: once a routing
  // column or sub-claim list has scrolled internally, the row's own page position barely
  // changes, so following the row would leave the page parked while rows scroll past.
  const anchor = followInner(el) || el;
  // Compute the target position rather than using scrollIntoView, which is a no-op when
  // the viewport height reads 0. Centre the element when the height is known; otherwise
  // just bring its top into view with a small margin.
  const vh = viewportH();
  const top = anchor.getBoundingClientRect().top + window.scrollY;
  const y = vh ? Math.max(0, top - vh/2 + anchor.offsetHeight/2) : Math.max(0, top - 80);
  smoothScrollTo(y);
  autoScrollTimer = setTimeout(() => { autoScrolling = false; }, SCROLL_MS + 280);
}

// ---------- replay: re-emit persisted results as if they were arriving now ----------
// Replay never calls a model. It reads the run the backend already saved and re-animates
// it at whatever Demo Speed is selected, so a recorded take costs nothing.
function replayRoutingEvents(run){
  // Reconstruct true arrival order: each model works through the questions sequentially,
  // so its cumulative latency is when each result actually landed. Sorting all
  // (question, model) pairs by that cumulative time reproduces the real race — including
  // a fast column finishing well before a slow one.
  const ev = [], clock = {jev:0, claude:0, gemini:0};
  QUESTIONS.forEach(q => ["jev","claude","gemini"].forEach(m => {
    const r = (run.routing || {})[q.id]?.[m];
    if(!r) return;
    clock[m] += r.ms || 0;
    ev.push({at: clock[m], question_id: q.id, model: m, res: r});
  }));
  return ev.sort((a,b) => a.at - b.at);
}

async function replayPace(ms){ await sleep(Math.min(Math.max(ms, 60), 900)); }

function renderScoreboard(){
  const el = document.getElementById("scoreboard");
  const rows = [
    ["jev","Jev","var(--jev)"], ["claude","Claude","var(--claude)"], ["gemini","Gemini","var(--gemini)"]
  ];
  el.innerHTML = rows.map(([k,label,color])=>{
    const t = state.totals[k];
    return `<div class="score-chip">
      <span class="dot" style="background:${color}"></span>
      ${label}
      <span class="val mono">${t.calls}</span> calls ·
      <span class="val mono">${t.tokens.toLocaleString()}</span> tok ·
      <span class="val mono">$${t.cost.toFixed(4)}</span> ·
      <span class="val mono">${(t.ms/1000).toFixed(1)}s</span>
    </div>`;
  }).join("") + `<span class="scope-note" title="Answer generation is Claude-only, so including it would compare Claude's whole workload against the other two models' share of a different job.">routing + fact-check only</span>`;
}

const STEP_NAMES = ["Document & Questions","Routing","Answers","Fact-Check","Summary"];
function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = STEP_NAMES.map((name,i)=>{
    const n = i+1;
    const done = (n===2&&state.routingDone) || (n===3&&state.answersDone) || (n===4&&Object.keys(state.judged).length===QUESTIONS.length) || (n===1);
    return `<div class="tab" data-active="${state.step===n}" data-done="${done}" onclick="goStep(${n})">
      <span class="num">${n}</span>${name}<span class="status"></span>
    </div>`;
  }).join("");
}
function goStep(n){ state.step=n; render(); }

function renderAll(){
  renderTabs(); renderScoreboard();
  document.querySelectorAll(".step").forEach(s=> s.dataset.visible = (Number(s.dataset.step)===state.step));
}

11. Errors, Omissions and Defects — acts/errors/omissions (negligent or not) relating to land use/planning/
    zoning/surveying/siting; design/specification/workmanship/construction/renovation/remodeling/grading/
    compaction; materials used therein; or property maintenance on or off the premises. (An ensuing loss IS
    paid unless separately excluded.)
12. Intentional Acts — loss from an act committed by or at the direction of an insured intending to cause loss.
13. Acts or Decisions — of any person/group/organization/government body, including failure to act/decide.
14. Weather Conditions — applies only when weather conditions contribute with another excluded cause/event
    to produce the loss.

--- HOW MUCH WE PAY FOR LOSS OR CLAIM ---
1. Under Property Coverages:
   a. Settled on actual cash value (with depreciation) unless the insured's Coverage A limit is at least 80% of
      replacement value, in which case the insured may elect actual cash value OR the Replacement Cost
      Provision (Perils Section).
   b. Our Limit of Liability — we pay the LESSER of: the applicable limit; an amount not exceeding your
      interest in the property; the cost to repair/replace with equivalent materials; the amount after applying
      the deductible; the actual cash value at time of loss (except under Replacement Cost, if applicable); or
      (mobile homes only, at your option) the difference between actual cash value before and after the loss.
   c. Deductible: applies to Coverage A, B, C, and to Debris Removal / Trees-Plants-Shrubs-Lawns / Tenant's
      Improvements / Condo Unit-Owner Additions / Outdoor Antenna Coverage, per the Declarations or
      endorsement. We pay only the part of the loss over the deductible; only one deductible per occurrence;
      where special limits also apply, liability is computed separately under both and the lesser amount is paid.
      [Deductible calculation modified by endorsement OTS-77 below.]
   d. Loss to a Pair or Set: liability is limited to a reasonable proportion of the value of the entire pair/set; not
      treated as a total loss of the set.
2. Under Personal Liability and Medical Payments to Others: Declarations limits are the maximum paid per
   single occurrence regardless of number of insureds, injured parties, or claims/suits. A Medical Payments
   claim payment is not an admission of Personal Liability.
3. Insurance Under More Than One Coverage: no more than the actual claim/loss/damage sustained is paid,
   even if multiple coverages apply.
4. Insurance Under More Than One Policy: [as amended by NY endorsement ML-84 below.]
5. Restoration of Limit of Liability: any loss paid does not reduce policy limits going forward.

--- PAYMENT OF LOSS OR CLAIM ---
1. Property Coverages:
   a. Your Property — losses adjusted with you; payable 45 days after acceptable proof of loss and
      established amount (by written agreement or filed appraisal award); paid to you unless another loss
      payee is named.
   b. Additional Living Expenses — if premises unfit for occupancy more than one month, paid monthly on
      submission of reasonable proof of expenses.
   c. Damage to Personal Property of Others — at our option, adjusted/paid to you for the owner's account, or
      adjusted/paid directly to the owner (discharging our obligation to the insured).
   d. Our Options — we may (a) pay in money, or (b) rebuild/repair/replace with equivalent property within a
      reasonable time (must notify insured of this intent within 30 days of an acceptable proof of loss). We
      may take damaged property at agreed/appraised value; such property becomes ours.
2. Liability Coverages — a person with a secured judgment against an insured, or established liability by
   written agreement among claimant/insured/us, may recover under this policy to the extent of coverage.
3. Liens for Unpaid Taxes (not applicable to fire loss on a 1-2 family residential structure) — we are required
   by Insurance Law to deduct any tax district's claim from what we pay you for a fire loss; payment to the
   tax district within 30 days of a lien certificate is considered valid/proper payment, discharging that amount.

--- WHAT YOU MUST DO IN CASE OF LOSS ---
1. Notice — the insured must promptly notify us/our agent (in writing if requested); notify police if the loss
   involves a law violation; notify the credit card company if a credit card loss is involved. Notice to us must
   state the insured's name, policy kind/number, time/place/circumstances of loss, and names/addresses of
   potential claimants and witnesses.
2. Cooperation — the insured must cooperate in performing all required acts.
3. Volunteer Payments — the insured must not voluntarily make payments, assume obligations, offer rewards,
   or incur other expenses except as specifically permitted.
4. Additional Duties — Property Coverages: take reasonable steps to protect covered property from further
   damage (we pay reasonable/necessary protective repairs if the insured keeps accurate records — doesn't
   increase the applicable limit); submit a statement of loss (under oath if requested) within 60 days. At our
   request, also: submit an acceptable proof of loss within 60 days (time/place/circumstances; the insured's
   and others' interests including mortgages/liens; other applicable insurance; title/occupancy changes;
   available plans/specifications; detailed repair estimates; and a detailed damaged-property inventory with
   supporting bills/receipts); submit to examination under oath as reasonably requested; exhibit damaged
   property as requested; produce records (including tax returns and cancelled-check microfilm) relating to
   value/loss/expenses; assist in enforcing recovery rights against any party causing the loss; produce records
   supporting rent loss/additional living expenses; and submit evidence/affidavit for a Credit Card, Forgery,
   and Counterfeit Money claim.
5. Additional Duties — Personal Liability Coverage: promptly forward all notices/demands/legal papers
   related to the occurrence; at our request, assist in making settlements, conducting suits (incl. attending
   trials/hearings), enforcing contribution/indemnification rights, securing/giving evidence, and obtaining
   witness attendance.
6. Additional Duties — Medical Payments to Others: the injured person (or representative) must give written
   proof of claim (under oath if requested) as soon as practical and authorize us to obtain medical
   reports/records; must submit to physical examinations by our selected physicians as reasonably required.

--- POLICY CONDITIONS ---

CONDITIONS APPLICABLE TO ALL COVERAGES
1. Assignment — not valid without our written consent.
2. Cancellation — "Required Policy Period" = 3 years from first issuance or voluntary renewal.
   a. By You — cancel any time by written notice or returning the policy, stating the effective cancellation date.
   b. By Us — by written notice delivered/mailed to your Declarations address; proof of mailing suffices.
   c. When We May Cancel or Nonrenew:
      1) Non-Payment of Premium — at least 15 days' notice before cancellation.
      2) New Policy (in effect < 60 days, not a renewal) — a statement of specific reasons plus at least 30
         days' notice. (A renewal is not a "new policy.")
      3) Policy with Term over One Year — for any reason, at least 45 (but not more than 60) days' notice

      4) Non-Renewal — at least 45 (but not more than 60) days' written notice before the required policy

3. Change, Modification, or Waiver of Policy Terms — must be in writing from us to be valid. Our request for

   forms/endorsements on any anniversary; coverage/limit-reducing changes require Non-Renewal-style notice.
4. Conformity with Statute — conflicting terms are amended to conform to the state statute where the

5. Misrepresentation, Concealment or Fraud — the entire policy is void if an insured willfully concealed/

6. Inspection — we may (not obligated to) inspect your property/operations; inspection/advice does not
   warrant safety, healthfulness, or legal/regulatory compliance.
7. Policy Premium — a no-expiration-date policy continues on payment of the required premium each
