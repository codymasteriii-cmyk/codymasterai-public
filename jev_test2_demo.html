<title>Policy QA Console — Test 2 Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ------------------------------------------------------------------
     Deliberate single dark theme: this is a broadcast/screen-recording
     control room, meant to read the same regardless of the viewer's OS
     theme (video demos are almost always shot dark for camera contrast).
     Background and every color below are set explicitly rather than
     inherited, so this is a choice, not an omission of light mode.
  ------------------------------------------------------------------- */
  :root{
    --bg:#0b0e14; --surface:#12161f; --surface-2:#191f2a; --surface-3:#212936;
    --border:#252d3b; --border-soft:#1a212c;
    --text:#eef1f6; --text-dim:#97a2b5; --text-faint:#5c6779;
    --jev:#a78bfa; --jev-dim:#241f3a; --jev-line:#4a3e73;
    --claude:#e8823c; --claude-dim:#33230f; --claude-line:#7a4d21;
    --gemini:#4c8dff; --gemini-dim:#101c33; --gemini-line:#2c4c85;
    --tier-easy:#34d399; --tier-easy-dim:#0f2a22;
    --tier-medium:#fbbf24; --tier-medium-dim:#2e2711;
    --tier-hard:#fb7185; --tier-hard-dim:#301820;
    --good:#34d399; --bad:#f87171; --muted-chip:#2a3140;
    --radius:12px; --radius-sm:8px;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Manrope",system-ui,sans-serif;
    padding-inline:20px; padding-block:0 28px;
    max-width:1220px; margin-inline:auto;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:"Sora",system-ui,sans-serif; text-wrap:balance;}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  ::selection{background:var(--jev-line); color:#fff;}
  a{color:var(--gemini);}
  button{font-family:inherit;}

  /* ---------------- Top bar ---------------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    background:linear-gradient(180deg,var(--bg) 80%,transparent);
    padding-block:18px 10px; margin-bottom:6px;
  }
  .topbar-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .brandmark{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
  .brandmark .name{font-size:19px; font-weight:800; letter-spacing:.2px;}
  .brandmark .tag{
    font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--tier-medium); background:var(--tier-medium-dim);
    border:1px solid #4a3d15; padding:3px 8px; border-radius:999px;
  }
  .speedctl{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim);}
  .speedctl select{
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:5px 8px; font-family:inherit; font-size:12px;
  }
  .scoreboard{display:flex; gap:8px; flex-wrap:wrap;}
  .score-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:7px 12px; font-size:12px; color:var(--text-dim);
  }
  .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .score-chip .val{color:var(--text); font-weight:700;}
  .score-chip .mono{font-size:11.5px;}

  /* ---------------- Tabs ---------------- */
  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:22px;}
  .tab{
    display:flex; align-items:center; gap:8px; white-space:nowrap;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    padding:9px 14px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tab .num{
    width:19px; height:19px; border-radius:50%; display:grid; place-items:center;
    background:var(--surface-3); font-size:11px; font-weight:700; flex:none;
  }
  .tab[data-active="true"]{background:var(--surface-3); color:var(--text); border-color:#3a4356;}
  .tab[data-active="true"] .num{background:var(--jev); color:#1a1030;}
  .tab .status{width:6px; height:6px; border-radius:50%; background:var(--text-faint); flex:none;}
  .tab[data-done="true"] .status{background:var(--good);}

  .step{display:none;}
  .step[data-visible="true"]{display:block;}

  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .panel-head h2{font-size:19px; margin:0;}
  .panel-head p{margin:2px 0 0; color:var(--text-dim); font-size:13px;}

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--jev); color:#160f28; border:none;
    font-weight:700; font-size:13.5px; padding:10px 16px; border-radius:10px;
    cursor:pointer; transition:filter .15s, transform .05s;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{background:var(--surface-3); color:var(--text-faint); cursor:not-allowed;}
  .btn.ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border);}
  .btn.ghost:hover{color:var(--text); border-color:#3a4356; filter:none;}
  .btn.sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}

  /* ---------------- Step 1: Document + Questions ---------------- */
  .doc-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); gap:18px;}
  @media (max-width:820px){.doc-grid{grid-template-columns:1fr;}}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
  .card h3{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:0 0 12px;}
  .doc-view{
    width:100%; height:640px; resize:none; overflow-y:auto; font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:12px; line-height:1.65; color:#c7cede; white-space:pre-wrap;
    background:var(--surface-2); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
    padding:14px; caret-color:transparent;
  }
  .doc-view:focus{outline:2px solid var(--jev-line); outline-offset:1px;}

  .tier-group{margin-bottom:16px;}
  .tier-group:last-child{margin-bottom:0;}
  .tier-label{
    display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;
  }
  .tier-swatch{width:9px; height:9px; border-radius:2px;}
  .q-list{display:flex; flex-direction:column; gap:6px;}
  .q-row{
    background:var(--surface-2); border:1px solid var(--border-soft); border-left:3px solid var(--border);
    border-radius:8px; padding:10px 12px; cursor:pointer;
  }
  .q-row-top{display:flex; align-items:center; gap:10px;}
  .q-idx{color:var(--text-faint); font-size:11.5px; flex:none;}
  .q-text{font-size:13px; flex:1;}
  .gold-badge{
    flex:none; font-size:10.5px; font-weight:700; color:var(--good);
    background:#0f2a22; border:1px solid #1c4a3a; padding:2px 7px; border-radius:999px;
  }
  .sc-count{flex:none; font-size:10.5px; color:var(--text-faint);}
  .q-detail{display:none; margin-top:9px; padding-top:9px; border-top:1px dashed var(--border); font-size:12.5px; color:var(--text-dim);}
  .q-row[data-open="true"] .q-detail{display:block;}
  .q-detail .label{color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px;}

  /* ---------------- Step 2: Routing race ---------------- */
  .race-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:900px){.race-grid{grid-template-columns:1fr;}}
  .race-col{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .race-head{padding:14px 16px; border-bottom:1px solid var(--border);}
  .race-head .model{display:flex; align-items:center; gap:9px; font-family:"Sora"; font-weight:700; font-size:15px;}
  .race-head .sub{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .race-stats{display:flex; gap:14px; padding:10px 16px; background:var(--surface-2); font-size:12px; border-bottom:1px solid var(--border-soft);}
  .race-stats .stat b{display:block; font-size:15px; margin-top:1px;}
  .race-stats .stat span{color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;}
  .race-rows{max-height:400px; overflow-y:auto; padding:8px;}
  .race-row{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; font-size:11.5px;
  }
  .race-row .q{color:var(--text-faint); width:26px; flex:none;}
  .race-row .pending{color:var(--text-faint);}
  .race-row .chip{
    padding:2px 8px; border-radius:999px; font-weight:700; font-size:10.5px; text-transform:uppercase;
  }
  /* Jev's per-decision confidence. Rendered only where a confidence actually exists, so the
     Claude/Gemini columns need no special-casing -- they are never asked for one (see confBar()).
     Sits BEFORE .mark, which keeps margin-left:auto and stays right-aligned. */
  .conf{display:inline-flex; align-items:center; gap:6px; margin-left:4px;}
  .conf-track{width:44px; height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; flex:none;}
  .conf-fill{display:block; height:100%; border-radius:3px;}
  .conf-num{font-size:10.5px; color:var(--text-dim); width:25px; flex:none;}
  .race-row .mark{margin-left:auto; font-weight:700;}
  .race-row .mark.ok{color:var(--good);}
  .race-row .mark.no{color:var(--bad);}
  .spinner{
    width:11px; height:11px; border-radius:50%; border:2px solid var(--border);
    border-top-color:var(--text-dim); animation:spin .7s linear infinite; flex:none;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .footer-score{padding:10px 16px; border-top:1px solid var(--border); font-size:12px; color:var(--text-dim); background:var(--surface-2);}
  .footer-score b{color:var(--text);}

  .barchart{margin-top:16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
  .bar-row{display:grid; grid-template-columns:120px 1fr 46px; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-track{height:16px; background:var(--surface-3); border-radius:999px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:999px; transition:width .5s ease;}

  /* ---------------- Step 3: Answers ---------------- */
  .a-list{display:flex; flex-direction:column; gap:10px;}
  .a-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
  .a-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .a-q{font-size:13.5px; font-weight:600; flex:1; min-width:200px;}
  .model-badge{
    flex:none; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em;
  }
  .a-body{margin-top:10px; font-size:13px; line-height:1.6; color:#cfd6e2; white-space:pre-wrap;}
  .a-meta{margin-top:10px; display:flex; gap:14px; font-size:11px; color:var(--text-faint);}
  .cursor-blink{display:inline-block; width:7px; height:14px; background:var(--claude); vertical-align:-2px; animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ---------------- Step 4: Fact-check ---------------- */
  .fc-toolbar{
    position:sticky; top:calc(58px + env(safe-area-inset-top,0px)); z-index:30;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 14px; margin-bottom:14px;
  }
  .fc-toolbar .count{font-size:12.5px; color:var(--text-dim); margin-right:auto;}
  .fc-card{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;}
  .fc-card[data-judged="true"]{border-left-color:var(--good);}
  .fc-row1{display:flex; align-items:flex-start; gap:12px;}
  .fc-checkbox{margin-top:3px; width:16px; height:16px; accent-color:var(--jev); flex:none;}
  .fc-main{flex:1; min-width:0;}
  .fc-qtext{font-size:13.5px; font-weight:600;}
  .fc-answer{font-size:12.5px; color:var(--text-dim); margin-top:4px; max-height:38px; overflow:hidden;}
  .fc-answer[data-expanded="true"]{max-height:none;}
  .judged-pill{
    flex:none; font-size:10.5px; font-weight:700; color:var(--good); background:#0f2a22;
    border:1px solid #1c4a3a; padding:3px 9px; border-radius:999px; display:none; align-items:center; gap:5px;
  }
  .fc-card[data-judged="true"] .judged-pill{display:inline-flex;}
  .fc-expand-btn{flex:none; background:none; border:1px solid var(--border); color:var(--text-dim); width:26px; height:26px; border-radius:7px; cursor:pointer;}
  .subclaims{display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}
  .subclaims[data-open="true"]{display:block;}
  .subclaims-scroll{max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding-right:4px;}
  .sub-row{
    display:grid; grid-template-columns:1fr repeat(4,74px); gap:8px; align-items:center;
    background:var(--surface-2); border:1px solid var(--border-soft); border-radius:8px;
    padding:8px 10px 18px;   /* extra bottom padding leaves room for the confidence line */
    opacity:0; transform:translateY(3px); animation:popin .28s ease forwards;
  }
  @keyframes popin{to{opacity:1; transform:none;}}
  .sub-fact{font-size:11.5px; color:var(--text-dim);}
  .verdict{
    font-size:10px; font-weight:700; text-align:center; padding:4px 0; border-radius:6px; text-transform:uppercase;
  }
  .verdict.correct{background:#0f2a22; color:var(--good); border:1px solid #1c4a3a;}
  .verdict.wrong{background:#301820; color:var(--bad); border:1px solid #4a2530;}
  .verdict.notstated{background:var(--muted-chip); color:var(--text-faint); border:1px solid #384258;}
  .verdict.pending{background:var(--surface-3); color:var(--text-faint); border:1px solid var(--border);}
  /* The human label is the answer key, not a fourth opinion — brighter and separated by a rule
     so the eye reads "human said X, the three models said..." rather than scanning four peers. */
  .verdict.human{box-shadow:inset 2px 0 0 var(--text-dim); font-weight:800;}
  /* A model verdict that disagrees with the human label. This is the whole point of the column:
     at 98.5% accuracy the disagreements are rare enough that without a marker you cannot find
     them by eye, which is exactly when a summary percentage becomes unverifiable. */
  .verdict.mismatch{outline:2px solid var(--bad); outline-offset:1px;}
  /* Jev flagged this judgement as uncertain. Deliberately a sparse MARKER and not a bar
     like the routing column: judge confidence saturates (71% land on exactly 1.00, 81%
     at >=0.99, 5 distinct values in 21 probe calls), so a bar would render nearly full
     everywhere and imply a uniform certainty that is really just saturation. Showing
     only the rare hesitation points a human reviewer at the judgements worth checking. */
  .verdict{position:relative;}
  /* The confidence VALUE under the chip, fed by data-conf so the live SSE path (which writes
     the chip with textContent and cannot inject markup) can still update it. Only Jev carries
     the attribute, so only the Jev column grows a second line. */
  .verdict[data-conf]::before{
    content:attr(data-conf); position:absolute; left:0; right:0; top:calc(100% + 2px);
    font-size:9px; font-weight:700; letter-spacing:0; text-transform:none;
    color:var(--text-faint); text-align:center;
  }
  .verdict.uncertain[data-conf]::before{color:var(--tier-medium);}
  .verdict.uncertain::after{content:"?"; position:absolute; top:-5px; right:-4px;
    font-size:10px; font-weight:800; color:var(--tier-medium); line-height:1;}
  .fc-cost{margin-top:10px; font-size:11px; color:var(--text-faint); display:none; gap:14px;}
  .fc-card[data-judged="true"] .fc-cost{display:flex;}
  .judge-col-heads{display:grid; grid-template-columns:1fr repeat(4,74px); gap:8px; margin-bottom:6px; padding:0 10px;}
  .judge-col-heads span{font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); text-align:center;}
  .judge-col-heads span:first-child{text-align:left;}

  /* ---------------- Step 5: Summary ---------------- */
  .award-row{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px;}
  @media (max-width:800px){.award-row{grid-template-columns:1fr;}}
  .award{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; text-align:center;}
  .award .medal{font-size:22px;}
  .award .label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:4px;}
  .award .who{font-family:"Sora"; font-weight:700; font-size:16px; margin-top:4px;}

  .score-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:900px){.score-grid{grid-template-columns:1fr;}}
  .score-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;}
  .score-card .model{display:flex; align-items:center; gap:9px; font-family:"Sora"; font-weight:700; font-size:15px; margin-bottom:12px;}
  .metric-row{display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--border-soft); font-size:12.5px;}
  .metric-row:last-child{border-bottom:none;}
  .metric-row .v{font-weight:700; font-family:"JetBrains Mono";}
  .metric-row .v.macro{color:var(--jev);}
  .metric-row .v.micro{color:var(--text-faint); font-weight:500; font-size:11px;}

  .callout{
    margin-top:16px; background:var(--tier-medium-dim); border:1px solid #4a3d15; border-radius:var(--radius);
    padding:14px 16px; font-size:12.5px; color:#e8d9a8; line-height:1.6;
  }
  .callout b{color:var(--tier-medium);}

  .step-totals{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    margin:10px 0 14px; padding:9px 12px;
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
    font-size:11.5px; color:var(--text-dim);
  }
  .step-totals .score-chip{background:transparent; border:none; padding:0 10px 0 0;}
  .strip-note{margin-left:auto; color:var(--text-faint); font-size:10.5px; font-style:italic;}
  .scope-note{
    margin-left:8px; align-self:center; color:var(--text-faint);
    font-size:10px; text-transform:uppercase; letter-spacing:.05em; cursor:help;
  }

  .empty{padding:40px 20px; text-align:center; color:var(--text-faint); font-size:13px;}
  .empty .big{font-size:30px; margin-bottom:8px;}
</style>

<div class="topbar">
  <div class="topbar-row">
    <div class="brandmark">
      <span class="name">Policy QA Console</span>
      <span class="tag" id="modeTag">replay</span>
    </div>
    <div class="speedctl">
      Demo speed
      <select id="speedSelect">
        <option value="1">Narration (1x)</option>
        <option value="3" selected>Normal (3x)</option>
        <option value="20">Fast-forward</option>
      </select>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div id="steps"></div>

<script>
/* ===========================================================================
   POLICY QA CONSOLE — Test 2 demo console, REPLAY ONLY.

   Every number here comes from a real run: 18 questions routed and answered, 66
   sub-claims fact-checked, by Jev, Claude, and Gemini. Nothing on this page calls a
   model. The data is embedded (DATA below) rather than fetched, so the file opens
   from disk with no server — see webapp/prototype.html for the Live+Replay version
   this was adapted from, and scripts/build_test2_demo.py for how DATA gets embedded.
   The backend named fields snake_case on the wire (ms / cost / tokens_in /
   tokens_out); adopt() maps them to the camelCase the renderers use.
=========================================================================== */
const DATA = {"questions":{"questions":[{"id":"e1","tier":"easy","text":"What is the replacement cost coverage for my house?","canonical_answer":"$521,000.","subclaims":[{"id":"e1_amount","required_fact":"the replacement cost coverage for the residence is $521,000.","excerpt":"\"A. Residence (Replacement Cost Value) $521,000\" (Declarations)","judge_instruction":"Does the candidate answer state the replacement cost coverage amount for the residence, and if so, does the excerpt confirm the amount it states?","criteria":{"stated_correct":"the candidate gives the amount and the excerpt confirms it ($521,000)","stated_wrong":"the candidate gives an amount the excerpt shows to be different","not_stated":"the candidate doesn't give a replacement cost amount for the residence"}}]},{"id":"e2","tier":"easy","text":"What is my personal liability coverage each occurrence?","canonical_answer":"$500,000.","subclaims":[{"id":"e2_amount","required_fact":"personal liability coverage is $500,000 each occurrence.","excerpt":"\"L. Personal Liability (Each Occurrence) $500,000\" (Declarations)","judge_instruction":"Does the candidate answer state the personal liability limit each occurrence, and if so, does the excerpt confirm the amount it states?","criteria":{"stated_correct":"the candidate gives the limit and the excerpt confirms it ($500,000)","stated_wrong":"the candidate gives an amount the excerpt shows to be different","not_stated":"the candidate doesn't give a personal liability per-occurrence limit"}}]},{"id":"e3","tier":"easy","text":"Does my premium include personal property coverage?","canonical_answer":"Yes. Coverage C — Personal Property (Actual Cash Value, $260,500) is marked \"INCL\" in the Declarations premium column, meaning it is bundled into the overall premium rather than charged as a separate line item.","subclaims":[{"id":"e3_included","required_fact":"Coverage C's premium is marked INCL — included/bundled rather than billed separately.","excerpt":"\"C. Personal Property (Actual Cash Value) $260,500 INCL\" (Declarations)","judge_instruction":"Does the candidate answer state whether the personal property coverage premium is included/bundled rather than billed separately, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says the premium is included/bundled and the excerpt confirms the INCL marking","stated_wrong":"the candidate says the premium is billed separately, or otherwise not included","not_stated":"the candidate doesn't address how the premium is treated"}}]},{"id":"e4","tier":"easy","text":"Does my policy cover me for fire damage?","canonical_answer":"Yes. Peril 1 in the Perils Section is \"Fire or Lightning,\" with no sub-exclusions attached to this peril.","subclaims":[{"id":"e4_covered","required_fact":"fire is a covered peril, listed without attached exclusions.","excerpt":"\"1. Fire or Lightning.\" (Perils Section, Peril 1)","judge_instruction":"Does the candidate answer state whether fire damage is covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says fire is covered and the excerpt confirms it is a named peril with no exclusions attached","stated_wrong":"the candidate says fire is excluded, or attaches conditions the excerpt doesn't show","not_stated":"the candidate doesn't address whether fire is covered"}}]},{"id":"e5","tier":"easy","text":"Am I covered for glass breakage?","canonical_answer":"Yes. The policy covers breakage of glass or other glazing material that is part of a building or mobile home, including storm doors and windows. This does not cover loss if the insured premises are vacant for more than 30 consecutive days immediately before the loss — a residence under construction is not considered vacant.","subclaims":[{"id":"e5_glass","required_fact":"glass breakage is covered, subject to the 30-day vacancy exclusion (with the under-construction carve-out).","excerpt":"\"9. Glass Breakage — covers breakage of glass or other glazing material that is part of a building or mobile home, including storm doors and windows. Does not cover loss if the insured premises are vacant for more than 30 consecutive days immediately before the loss. A residence under construction is not considered vacant.\" (Perils Section, Peril 9)","judge_instruction":"Does the candidate answer state that glass breakage is covered subject to a 30-day vacancy exclusion, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says glass breakage is covered and identifies the 30-day vacancy exclusion, matching the excerpt","stated_wrong":"the candidate states different coverage terms or a different exclusion (e.g. a different vacancy period, or says glass breakage isn't covered)","not_stated":"the candidate doesn't address glass breakage coverage or its vacancy condition"}}]},{"id":"e6","tier":"easy","text":"If I have a covered loss to my home or personal property, when will I be paid?","canonical_answer":"45 days after we receive an acceptable proof of loss and the amount of the loss has been established, either by written agreement with you or by the filing of an appraisal award with us. Payment is made to you unless another loss payee is named in the policy.","subclaims":[{"id":"e6_deadline","required_fact":"payment is due 45 days after acceptable proof of loss and the amount is established.","excerpt":"\"a. Your Property — losses adjusted with you; payable 45 days after acceptable proof of loss and established amount (by written agreement or filed appraisal award); paid to you unless another loss payee is named.\" (Payment of Loss or Claim, 1.a)","judge_instruction":"Does the candidate answer state when payment for a covered property loss is due, and if so, does the excerpt confirm the timeline it states?","criteria":{"stated_correct":"the candidate gives 45 days after acceptable proof of loss and established amount","stated_wrong":"the candidate gives a different timeline or a different trigger","not_stated":"the candidate doesn't address payment timing ===================================================================="}}]},{"id":"m1","tier":"medium","text":"What type of conditions am I not covered for vehicle, windstorm or hail related losses?","canonical_answer":"Windstorm or Hail does not cover: (a) loss caused directly or indirectly by frost, cold weather, ice (other than hail), snow or sleet, whether wind driven or not; (b) loss to a building's interior or contents caused by dust, rain, sand, sleet, snow or water entering through openings not made by the direct force of wind or hail; or (c) loss to watercraft (except rowboats and canoes on the insured premises), including their trailers, accessories, equipment and outboard motors, unless inside a fully enclosed building. Vehicles does not cover loss to fences, driveways and walks caused by a vehicle owned or operated by an occupant of the insured premises.","subclaims":[{"id":"m1_wind_frost","required_fact":"Windstorm or Hail does not cover loss caused directly or indirectly by frost, cold weather, ice (other than hail), snow or sleet, whether wind driven or not.","excerpt":"\"2. Windstorm or Hail. Does not cover loss: a. caused directly or indirectly by frost, cold weather, ice (other than hail), snow or sleet, wind driven or not;\" (Peril 2)","judge_instruction":"Does the candidate answer state that the Windstorm or Hail peril excludes loss caused by frost, cold weather, ice, snow or sleet, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies this frost/cold-weather/ice/snow/sleet exclusion and the excerpt confirms it","stated_wrong":"the candidate states this exclusion inaccurately (e.g. says hail is excluded, or says wind-driven snow is covered)","not_stated":"the candidate doesn't mention this exclusion (naming other windstorm exclusions instead does not count)"}},{"id":"m1_wind_openings","required_fact":"Windstorm or Hail does not cover loss to a building's interior or contents caused by dust, rain, sand, sleet, snow or water entering through openings not made by the direct force of wind or hail.","excerpt":"\"2. Windstorm or Hail. Does not cover loss: ... b. to a building's interior or contents caused by dust, rain, sand, sleet, snow or water entering through openings not made by the direct force of wind or hail;\" (Peril 2)","judge_instruction":"Does the candidate answer state that the Windstorm or Hail peril excludes interior or contents damage from material entering through openings not made by the direct force of wind or hail, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies this openings exclusion and the excerpt confirms it","stated_wrong":"the candidate states it inaccurately (e.g. says interior damage is excluded even when wind made the opening)","not_stated":"the candidate doesn't mention this exclusion"}},{"id":"m1_wind_watercraft","required_fact":"Windstorm or Hail does not cover loss to watercraft (except rowboats and canoes on the insured premises), their trailers, accessories, equipment and outboard motors, unless inside a fully enclosed building.","excerpt":"\"2. Windstorm or Hail. Does not cover loss: ... c. to watercraft (except rowboats and canoes on the insured premises), their trailers, accessories, equipment and outboard motors, unless inside a fully enclosed building.\" (Peril 2)","judge_instruction":"Does the candidate answer state that the Windstorm or Hail peril excludes watercraft and related equipment unless inside a fully enclosed building, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies this watercraft exclusion and the excerpt confirms it","stated_wrong":"the candidate states it inaccurately (e.g. omits or reverses the fully-enclosed-building condition, or excludes rowboats/canoes on the premises)","not_stated":"the candidate doesn't mention this exclusion"}},{"id":"m1_vehicle","required_fact":"the Vehicles peril does not cover loss to fences, driveways and walks caused by a vehicle owned or operated by an occupant of the insured premises.","excerpt":"\"6. Vehicles — does not cover loss to fences, driveways and walks caused by a vehicle owned or operated by an occupant of the insured premises.\" (Peril 6)","judge_instruction":"Does the candidate answer state the Vehicles peril's exclusion, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies the fences/driveways/walks exclusion for an occupant's vehicle and the excerpt confirms it","stated_wrong":"the candidate states a different exclusion, or drops the \"occupant\" qualifier in a way the excerpt refutes","not_stated":"the candidate doesn't address the Vehicles peril's exclusion"}}]},{"id":"m2","tier":"medium","text":"For worker's compensation coverage, what am I covered for — including what \"bodily injury\" means for this purpose — and who will be covered?","canonical_answer":"What's covered — Under Coverage I (Workers' Compensation), the policy pays all benefits required of an insured under the New York Workers' Compensation Law when due. Under Coverage II (Employers' Liability), the policy pays on the insured's behalf all damages for which the insured is legally liable because of bodily injury sustained by a covered residence employee, where the injury is caused by accident or disease and arises out of and in the course of employment, while in the US/its territories/possessions or Canada (or temporarily elsewhere if the employee is a US/Canadian citizen or resident). \"Bodily injury\" here means bodily harm, sickness or disease to a person, including required care, loss of services and death resulting therefrom. Who's covered — A \"covered residence employee\": someone who is (a) in regular employment of less than 40 hours per week, or in casual employment, and (b) defined as an employee under the NY Workers' Compensation Law for whom benefits must be provided.","subclaims":[{"id":"m2_coverage_i","required_fact":"Coverage I (Workers' Compensation) pays all benefits required of an insured under the New York Workers' Compensation Law when due.","excerpt":"\"Coverage I (Workers' Compensation) — pay all benefits required of an insured under the NY Workers' Compensation Law when due.\" (What We Agree To Do)","judge_instruction":"Does the candidate answer state what Coverage I (Workers' Compensation) pays, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says Coverage I pays the benefits required under NY Workers' Compensation Law and the excerpt confirms it","stated_wrong":"the candidate describes Coverage I as paying something else","not_stated":"the candidate doesn't address what Coverage I pays"}},{"id":"m2_coverage_ii","required_fact":"Coverage II (Employers' Liability) pays on the insured's behalf all damages the insured is legally liable for from a covered residence employee's bodily injury by accident or disease arising out of and in the course of employment, in the US/its territories/Canada, or temporarily elsewhere if the employee is a US/Canadian citizen or resident.","excerpt":"\"Coverage II (Employers' Liability) — pay on behalf of an insured all damages for which the insured is legally liable from a covered residence employee's bodily injury (by accident or disease, arising out of and in the course of employment) while in the US/its territories/Canada, or temporarily elsewhere if the employee is a US/Canadian citizen or resident.\" (What We Agree To Do)","judge_instruction":"Does the candidate answer state what Coverage II (Employers' Liability) pays, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says Coverage II pays damages the insured is legally liable for from a residence employee's work-related bodily injury, consistent with the excerpt","stated_wrong":"the candidate describes Coverage II as paying regardless of legal liability, or covering injuries outside the course of employment","not_stated":"the candidate doesn't address what Coverage II pays"}},{"id":"m2_bodily_injury","required_fact":"\"bodily injury\" means bodily harm, sickness or disease including required care, loss of services and resulting death.","excerpt":"\"2. Bodily Injury = bodily harm, sickness or disease including required care, loss of services and resulting death.\" (Policy Definitions item 2)","judge_instruction":"Does the candidate answer state what 'bodily injury' means for this coverage, and if so, does the excerpt confirm the definition it states?","criteria":{"stated_correct":"the candidate gives the definition and the excerpt confirms it","stated_wrong":"the candidate gives a different definition (e.g. omits sickness/disease, or limits it to physical harm only)","not_stated":"the candidate doesn't define bodily injury"}},{"id":"m2_who_covered","required_fact":"a covered residence employee is someone (a) in regular employment under 40 hrs/week or in casual employment, and (b) defined as an employee under NY workers' comp law for whom benefits must be provided.","excerpt":"\"Who Is Covered: a residence employee who is (a) in regular employment under 40 hrs/week or casual employment, and (b) defined as an employee under NY workers' comp law for whom benefits must be provided.\" (Workers' Compensation — Certain Residence Employees endorsement, \"Who Is Covered\")","judge_instruction":"Does the candidate answer state who qualifies as a covered residence employee, and if so, does the excerpt confirm the criteria it states?","criteria":{"stated_correct":"the candidate gives the qualifying criteria and the excerpt confirms them","stated_wrong":"the candidate gives different criteria (e.g. a different hours threshold, or omits the statutory-definition requirement in a way the excerpt refutes)","not_stated":"the candidate doesn't address who qualifies"}}]},{"id":"m3","tier":"medium","text":"If I have an overflow or freeze in my plumbing, what type of situations would I not be covered?","canonical_answer":"Accidental Discharge or Overflow of Liquids or Steam does not cover loss: (a) caused by continuous or repeated seepage or leakage; (b) if the residence has been vacant for more than 30 consecutive days immediately before the loss (a residence under construction is not considered vacant); (c) to the system or domestic appliance from which the liquid or steam escapes itself (only removal/replacement of parts necessary to repair the system/appliance is paid); (d) caused by freezing; or (e) on the insured premises caused by discharge or overflow that originates off the insured premises. Freezing of a Plumbing, Heating or Air-Conditioning System or Domestic Appliance does not cover loss while the residence is vacant, unoccupied (including temporary absence), or under construction and unoccupied — UNLESS the insured used reasonable care to (a) maintain heat in the building, or (b) shut off the liquid supply and completely empty the system/appliance.","subclaims":[{"id":"m3_overflow_seepage","required_fact":"the Accidental Discharge/Overflow peril does not cover loss caused by continuous or repeated seepage or leakage.","excerpt":"\"15. Accidental Discharge or Overflow of Liquids or Steam from a plumbing, heating or air-conditioning system or domestic appliance. Does not cover loss: a. caused by continuous or repeated seepage or leakage;\" (Peril 15)","judge_instruction":"Does the candidate answer state that continuous or repeated seepage or leakage is excluded, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies the continuous/repeated seepage or leakage exclusion","stated_wrong":"the candidate states it inaccurately (e.g. says gradual leakage is covered)","not_stated":"the candidate doesn't mention this exclusion (naming other overflow exclusions instead does not count)"}},{"id":"m3_overflow_vacancy","required_fact":"the Accidental Discharge/Overflow peril does not cover loss if the residence has been vacant more than 30 consecutive days before the loss.","excerpt":"\"15. Accidental Discharge or Overflow of Liquids or Steam ... Does not cover loss: ... b. if the residence has been vacant more than 30 consecutive days before the loss;\" (Peril 15)","judge_instruction":"Does the candidate answer state that a vacancy of more than 30 consecutive days excludes this loss, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies the 30-day vacancy exclusion","stated_wrong":"the candidate gives a different vacancy period or says vacancy doesn't matter","not_stated":"the candidate doesn't mention a vacancy exclusion for this peril"}},{"id":"m3_overflow_system","required_fact":"the Accidental Discharge/Overflow peril does not cover the system or appliance from which the liquid or steam escaped — only removal/replacement of parts necessary to repair it is paid.","excerpt":"\"15. Accidental Discharge or Overflow of Liquids or Steam ... Does not cover loss: ... c. to the system/appliance from which the liquid or steam escapes (only removal/replacement of parts necessary to repair the system/appliance is paid);\" (Peril 15)","judge_instruction":"Does the candidate answer state that the system or appliance the liquid escaped from is itself excluded, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies that the escaping system/appliance itself is not covered (optionally noting the parts-to-repair carve-out), consistent with the excerpt","stated_wrong":"the candidate says the failed system/appliance is itself covered","not_stated":"the candidate doesn't address the escaping system/appliance itself"}},{"id":"m3_overflow_freezing","required_fact":"the Accidental Discharge/Overflow peril does not cover loss caused by freezing — that scenario is governed by Peril 16 instead.","excerpt":"\"15. Accidental Discharge or Overflow of Liquids or Steam ... Does not cover loss: ... d. caused by freezing;\" (Peril 15)","judge_instruction":"Does the candidate answer state that overflow caused by freezing is excluded from this peril, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies that freezing-caused overflow falls outside Peril 15","stated_wrong":"the candidate says Peril 15 covers freezing-caused overflow","not_stated":"the candidate doesn't address how freezing interacts with the overflow peril"},"note":"this is the hand-off the question is really testing. Keep it as its own sub-claim so a candidate that handles both perils but never connects them can be distinguished from one that does."},{"id":"m3_overflow_offpremises","required_fact":"the Accidental Discharge/Overflow peril does not cover loss on the insured premises caused by discharge or overflow originating off the insured premises.","excerpt":"\"15. Accidental Discharge or Overflow of Liquids or Steam ... Does not cover loss: ... e. on the insured premises caused by discharge/overflow originating off the insured premises.\" (Peril 15)","judge_instruction":"Does the candidate answer state that discharge or overflow originating off the insured premises is excluded, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies the off-premises-origin exclusion","stated_wrong":"the candidate states it inaccurately (e.g. says off-premises origin is covered)","not_stated":"the candidate doesn't mention this exclusion"}},{"id":"m3_freezing","required_fact":"the Freezing peril does not cover loss while the residence is vacant, unoccupied (including temporary absence) or under construction and unoccupied — UNLESS the insured used reasonable care to maintain heat, or to shut off the liquid supply and completely empty the system/appliance.","excerpt":"\"16. Freezing of a plumbing, heating or air-conditioning system or domestic appliance. Does not cover loss while the residence is vacant, unoccupied (including temporary absence) or under construction and unoccupied — UNLESS the insured used reasonable care to (a) maintain heat in the building, or (b) shut off the liquid supply and completely empty the system/appliance.\" (Peril 16)","judge_instruction":"Does the candidate answer state the Freezing peril's vacancy exclusion together with its reasonable-care exception, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate gives the vacancy/unoccupancy exclusion AND the reasonable-care exception, consistent with the excerpt","stated_wrong":"the candidate gives the exclusion with no exception, gives the exception inaccurately, or states different terms","not_stated":"the candidate doesn't address the Freezing peril's exclusion"},"note":"deliberately NOT split. The exclusion and its exception form one conditional rule; a verdict on the exclusion alone would be misleading."}]},{"id":"m4","tier":"medium","text":"What type of personal properties are covered by my policy, and what type are not?","canonical_answer":"Covered — personal property owned by or in the care of an insured; at the insured's option, personal property of guests and domestic employees while on the portion of the premises occupied exclusively by an insured. This also includes all detachable building items (awnings, screens, storm doors and windows, window air conditioners); carpeting, curtains and drapes (whether or not permanently installed); and outdoor equipment not permanently installed. Not covered — property covered by any scheduled insurance; animals, insects, birds and fish; motorized vehicles and their parts/equipment (except those used exclusively to service the insured premises, subject to the Limitations on Certain Property, or vehicles designed for assisting the handicapped); aircraft and parts; business property while away from the insured premises; property of roomers, boarders and other tenants (except property of roomers/boarders related to an insured); outdoor antennas (including satellite dishes) and their wiring/accessories/masts/towers; trees, plants, shrubs and lawns; electronic devices/accessories/antennas operable from a motorized vehicle's, farm equipment's, or watercraft's electrical system (including related media); loss resulting from credit cards; property in an apartment regularly rented or held for rental to others by an insured; property rented or held for rental to others off the residence premises; and books of account, drawings, or other paper records, or electronic data-processing media containing business data (blank/unexposed media IS covered).","subclaims":[{"id":"m4_cov_insured","required_fact":"Coverage C covers personal property owned by or in the care of an insured.","excerpt":"\"1. While on the Insured Premises: covers personal property owned by or in the care of an insured;\" (Coverage C item 1)","judge_instruction":"Does the candidate answer state that personal property owned by or in the care of an insured is covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate states this and the excerpt confirms it","stated_wrong":"the candidate states it inaccurately (e.g. limits it to owned property only, excluding property in the insured's care)","not_stated":"the candidate doesn't address this category"}},{"id":"m4_cov_guests","required_fact":"at the insured's option, Coverage C covers guests' and domestic employees' property while on the exclusively-occupied portion of the premises.","excerpt":"\"1. While on the Insured Premises: ... at your option, covers guests' and domestic employees' property while on the exclusively-occupied portion of the premises.\" (Coverage C item 1)","judge_instruction":"Does the candidate answer state that guests' and domestic employees' property is covered at the insured's option, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate states this coverage and preserves the \"at your option\" qualifier","stated_wrong":"the candidate says guest/employee property is automatically covered, or not covered at all","not_stated":"the candidate doesn't address guests' or domestic employees' property"}},{"id":"m4_cov_detachable","required_fact":"Coverage C also includes detachable building items (awnings, screens, storm doors/windows, window A/C), carpeting/curtains/drapes, and outdoor equipment not permanently installed.","excerpt":"\"1. While on the Insured Premises: ... Also includes detachable building items (awnings, screens, storm doors/windows, window A/C), carpeting/curtains/drapes, and outdoor equipment not permanently installed.\" (Coverage C item 1)","judge_instruction":"Does the candidate answer state that detachable building items, carpeting/curtains/ drapes, and non-permanently-installed outdoor equipment are covered as personal property, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate states this category and the excerpt confirms it","stated_wrong":"the candidate says these items fall under building coverage rather than personal property, or otherwise states it in a way the excerpt refutes","not_stated":"the candidate doesn't address detachable/outdoor items"}},{"id":"m4_not_scheduled","required_fact":"property covered by any scheduled insurance is not covered under Coverage C.","excerpt":"\"6. Personal Property Not Covered: property under scheduled insurance; ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that separately scheduled property is not covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies scheduled property as excluded","stated_wrong":"the candidate says scheduled property is covered under Coverage C","not_stated":"the candidate doesn't mention scheduled property (naming other exclusions does not count)"}},{"id":"m4_not_animals","required_fact":"animals, insects, birds and fish are not covered.","excerpt":"\"6. Personal Property Not Covered: ... animals, insects, birds, fish; ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that animals, insects, birds and fish are not covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies living creatures as excluded","stated_wrong":"the candidate says pets or other animals are covered personal property","not_stated":"the candidate doesn't mention animals"}},{"id":"m4_not_vehicles","required_fact":"motorized vehicles and their parts are not covered, except those servicing the premises (per the Limitations) or vehicles designed for assisting the handicapped.","excerpt":"\"6. Personal Property Not Covered: ... motorized vehicles/parts (except those servicing the premises per the Limitations above, or vehicles designed for assisting the handicapped); ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that motorized vehicles and their parts are not covered, and if so, does the excerpt confirm what it states — including the exceptions?","criteria":{"stated_correct":"the candidate identifies motorized vehicles as excluded, consistent with the excerpt (naming the exceptions is confirming, not required)","stated_wrong":"the candidate says motorized vehicles are covered, or states exceptions the excerpt refutes","not_stated":"the candidate doesn't mention motorized vehicles"}},{"id":"m4_not_aircraft","required_fact":"aircraft and their parts are not covered.","excerpt":"\"6. Personal Property Not Covered: ... aircraft and parts; ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that aircraft and parts are not covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies aircraft as excluded","stated_wrong":"the candidate says aircraft are covered","not_stated":"the candidate doesn't mention aircraft"}},{"id":"m4_not_business_away","required_fact":"business property while away from the insured premises is not covered.","excerpt":"\"6. Personal Property Not Covered: ... business property away from the premises; ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that business property away from the insured premises is not covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies off-premises business property as excluded","stated_wrong":"the candidate states it inaccurately (e.g. says all business property is excluded regardless of location, or that off-premises business property is covered)","not_stated":"the candidate doesn't mention off-premises business property"}},{"id":"m4_not_tenant_property","required_fact":"property of roomers, boarders and other tenants is not covered, except property of roomers/boarders related to an insured.","excerpt":"\"6. Personal Property Not Covered: ... property of roomers/boarders/tenants (except roomers/boarders related to an insured); ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that tenants'/roomers'/boarders' property is not covered, and if so, does the excerpt confirm what it states — including the related-persons exception?","criteria":{"stated_correct":"the candidate identifies tenant/roomer/boarder property as excluded, consistent with the excerpt (naming the exception is confirming, not required)","stated_wrong":"the candidate says tenants' property is covered, or states the exception in a way the excerpt refutes","not_stated":"the candidate doesn't mention roomers', boarders' or tenants' property"}},{"id":"m4_not_antennas","required_fact":"outdoor antennas are not covered.","excerpt":"\"6. Personal Property Not Covered: ... outdoor antennas; ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that outdoor antennas are not covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies outdoor antennas as excluded","stated_wrong":"the candidate says outdoor antennas are covered","not_stated":"the candidate doesn't mention outdoor antennas"}},{"id":"m4_not_trees","required_fact":"trees, plants, shrubs and lawns are not covered under Coverage C.","excerpt":"\"6. Personal Property Not Covered: ... trees/plants/shrubs/lawns; ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that trees, plants, shrubs and lawns are not covered as personal property, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies trees/plants/shrubs/lawns as excluded from Coverage C","stated_wrong":"the candidate says they are covered personal property","not_stated":"the candidate doesn't mention trees, plants, shrubs or lawns"}},{"id":"m4_not_vehicle_electronics","required_fact":"electronic devices, accessories and antennas operable from a motorized vehicle's, farm equipment's or watercraft's electrical system — including related media — are not covered.","excerpt":"\"6. Personal Property Not Covered: ... electronic devices/accessories/antennas operable from a motorized vehicle/farm equipment/watercraft's electrical system (including related media); ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that electronics operable from a vehicle's, farm equipment's or watercraft's electrical system are not covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies this electronics exclusion","stated_wrong":"the candidate says such electronics are covered","not_stated":"the candidate doesn't mention vehicle-powered electronics"}},{"id":"m4_not_credit_cards","required_fact":"loss resulting from credit cards is not covered under Coverage C.","excerpt":"\"6. Personal Property Not Covered: ... loss resulting from credit cards; ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that loss resulting from credit cards is not covered under personal property, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies credit card losses as excluded from Coverage C","stated_wrong":"the candidate says credit card losses are covered under Coverage C","not_stated":"the candidate doesn't mention credit card losses"}},{"id":"m4_not_rented_apartment","required_fact":"property in an apartment regularly rented or held for rental to others by an insured is not covered.","excerpt":"\"6. Personal Property Not Covered: ... property in an apartment regularly rented/held for rental by an insured; ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that property in an apartment regularly rented or held for rental by an insured is not covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies this rental-apartment exclusion","stated_wrong":"the candidate says such property is covered","not_stated":"the candidate doesn't mention property in a rented apartment"}},{"id":"m4_not_rented_offpremises","required_fact":"property rented or held for rental to others off the residence premises is not covered.","excerpt":"\"6. Personal Property Not Covered: ... property rented/held for rental off the residence premises; ...\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that property rented or held for rental off the residence premises is not covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies this off-premises rental exclusion","stated_wrong":"the candidate says such property is covered","not_stated":"the candidate doesn't mention property rented off the residence premises"}},{"id":"m4_not_business_records","required_fact":"books of account, drawings, paper records, and electronic data-processing media containing business data are not covered — but blank/unexposed media IS covered.","excerpt":"\"6. Personal Property Not Covered: ... books of account, drawings, paper records, or electronic data-processing media containing business data (blank/unexposed media IS covered).\" (Coverage C item 6)","judge_instruction":"Does the candidate answer state that business records and data-processing media containing business data are not covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies business records/data media as excluded, consistent with the excerpt (naming the blank-media carve-out is confirming, not required)","stated_wrong":"the candidate says business records are covered, or says blank/unexposed media is also excluded","not_stated":"the candidate doesn't mention business records or data media"}}]},{"id":"m5","tier":"medium","text":"What is the dollar amount of my Additional Living Expense and Loss of Rent Coverage, and what are actually covered?","canonical_answer":"Dollar amount — $104,200. What's covered — the policy pays any necessary and reasonable increase in living expenses incurred to maintain the household's normal standard of living if the insured premises (or a portion of it) is made unfit for occupancy by an insured loss, for the time reasonably required to restore fitness or resettle the household, whichever is less (not limited by the policy period). It also pays for any loss of rents actually sustained if a rented portion of the premises is made unfit for occupancy by an insured loss, similarly time-limited. It also pays additional living expenses and loss of rents for up to two weeks if premises immediately adjoining the insured premises are damaged by an insured peril and civil authority prohibits use of the insured premises. It does NOT pay expenses due to cancellation of any lease or written/oral agreement.","subclaims":[{"id":"m5_amount","required_fact":"the Additional Living Expense and Loss of Rent limit is $104,200.","excerpt":"\"D. Additional Living Expense and Loss of Rent $104,200 INCL\" (Declarations)","judge_instruction":"Does the candidate answer state the ALE/Loss of Rent coverage limit, and if so, does the excerpt confirm the amount it states?","criteria":{"stated_correct":"the candidate gives the limit and the excerpt confirms it ($104,200)","stated_wrong":"the candidate gives a different amount","not_stated":"the candidate doesn't give an ALE/Loss of Rent limit"}},{"id":"m5_ale","required_fact":"Coverage D pays necessary/reasonable increased living expenses to maintain the household's normal standard of living when the premises are made unfit for occupancy by an insured loss, for the time reasonably needed to restore fitness or to resettle, whichever is less (not limited by the policy period).","excerpt":"\"Coverage D — Additional Living Expense and Loss of Rent Coverage Pays necessary/reasonable increased living expenses to maintain your household's normal standard of living if the insured premises are made unfit for occupancy by an insured loss — for the time reasonably needed to restore fitness or resettle, whichever is less (not limited by the policy period).\" (General Policy Provisions ML-20, Coverage D)","judge_instruction":"Does the candidate answer state what the additional living expense portion of Coverage D pays for and for how long, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate describes increased living expenses when the premises are unfit, with the restore-or-resettle-whichever-is-less time limit, consistent with the excerpt","stated_wrong":"the candidate describes different terms (e.g. total living expenses rather than increased expenses, or a fixed time limit the excerpt refutes)","not_stated":"the candidate doesn't address the additional living expense coverage"}},{"id":"m5_loss_of_rent","required_fact":"Coverage D pays actual loss of rents sustained if a rented portion is made unfit for occupancy, subject to the same time limit.","excerpt":"\"Coverage D ... Pays actual loss of rents sustained if a rented portion is made unfit for occupancy, similarly time-limited.\" (General Policy Provisions ML-20, Coverage D)","judge_instruction":"Does the candidate answer state that Coverage D pays actual loss of rents for a rented portion made unfit for occupancy, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies the loss-of-rents coverage, consistent with the excerpt","stated_wrong":"the candidate states it inaccurately (e.g. says expected or market rent rather than actual loss sustained, or says rent loss isn't covered)","not_stated":"the candidate doesn't address loss of rents"}},{"id":"m5_civil_authority","required_fact":"Coverage D pays additional living expenses/loss of rents for up to two weeks if adjoining premises are damaged by an insured peril and civil authority prohibits use of the insured premises.","excerpt":"\"Coverage D ... Pays additional living expenses/loss of rents for up to two weeks if adjoining premises are damaged by an insured peril and civil authority prohibits use of the insured premises.\" (General Policy Provisions ML-20, Coverage D)","judge_instruction":"Does the candidate answer state the civil-authority provision and its two-week limit, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies the civil-authority coverage with the two-week limit","stated_wrong":"the candidate gives a different duration or different trigger conditions","not_stated":"the candidate doesn't mention the civil-authority provision"}},{"id":"m5_lease_exclusion","required_fact":"Coverage D does not pay expenses arising from cancellation of any lease or agreement.","excerpt":"\"Coverage D ... Does not pay expenses from cancellation of any lease/agreement.\" (General Policy Provisions ML-20, Coverage D)","judge_instruction":"Does the candidate answer state that expenses from cancellation of a lease or agreement are excluded, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate identifies the lease-cancellation exclusion","stated_wrong":"the candidate says lease-cancellation expenses are covered","not_stated":"the candidate doesn't mention the lease-cancellation exclusion"}}]},{"id":"m6","tier":"medium","text":"Can I assign my policy to someone else, and after a covered loss, can I abandon my damaged property to the insurer for a payout?","canonical_answer":"Assignment — assignment of this policy is not valid without our written consent. Abandonment of Property — we may take the property (or any part of it) at the agreed or appraised value, but the insured may NOT abandon covered property to us for a payout unless we specifically agree to accept it.","subclaims":[{"id":"m6_assignment","required_fact":"assignment of the policy is not valid without the insurer's written consent.","excerpt":"\"1. Assignment — not valid without our written consent.\" (Policy Conditions item 1)","judge_instruction":"Does the candidate answer state whether the policy can be assigned, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says assignment requires the insurer's written consent","stated_wrong":"the candidate says the policy is freely assignable, or cannot be assigned at all","not_stated":"the candidate doesn't address assignment"}},{"id":"m6_abandonment","required_fact":"the insured may not abandon covered property to the insurer unless the insurer specifically agrees.","excerpt":"\"12. Abandonment of Property — we may take property at agreed/appraised value; the insured may not abandon covered property to us unless we specifically agree.\" (Policy Conditions item 12)","judge_instruction":"Does the candidate answer state whether covered property can be abandoned to the insurer, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says the insured may not abandon covered property without the insurer's specific agreement","stated_wrong":"the candidate says the insured may abandon property to the insurer at will","not_stated":"the candidate doesn't address abandonment ===================================================================="}}]},{"id":"h1","tier":"hard","text":"How does my coverage work if my house is destroyed by earthquake?","canonical_answer":"Earthquake falls under \"Earth Movement of Any Kind.\" The base policy's Earth Movement exclusion (General Provisions, Exclusions That Apply to Property Coverages, item 6) has been DELETED AND REPLACED by the ML-73 endorsement (Earth Movement Exclusion Clarification), which explicitly lists \"earthquake, including tremors or land shock waves that occur before, during or after a volcanic eruption\" as part of the excluded Earth Movement peril. So: direct physical damage to the house from earthquake shaking/ground movement itself is NOT covered. Exception (carried through unchanged by the endorsement): the policy DOES pay for direct loss by fire, explosion, and (if theft is covered under the policy) theft, that RESULTS FROM the earth movement. So if the earthquake triggers a fire that then destroys the house, that fire damage would be covered (subject to the policy's other applicable terms, e.g. the Replacement Cost Provision and deductible), even though the earthquake's direct structural damage itself would not be.","subclaims":[{"id":"h1_excluded","required_fact":"earthquake falls under the excluded \"Earth Movement of Any Kind\" peril.","excerpt":"\"6. Earth Movement of Any Kind — earthquake, landslide, mudflow, earth sinking/rising/shifting, subsidence, sinkhole, erosion, expansion/contraction, volcanic eruption/effusion. (Direct fire, explosion, and — if covered — theft loss resulting from earth movement IS paid; explosion excludes volcanic eruption/effusion.) [Clarified/replaced by endorsement ML-73 below.]\" (Exclusions That Apply to Property Coverages, item 6)","judge_instruction":"Does the candidate answer state whether earthquake falls under an excluded peril, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says earthquake is excluded under Earth Movement and the excerpt confirms it","stated_wrong":"the candidate says earthquake is not excluded","not_stated":"the candidate doesn't address whether earthquake is excluded"}},{"id":"h1_endorsement","required_fact":"endorsement ML-73 deletes and replaces the base Earth Movement exclusion, rather than merely supplementing it.","excerpt":"\"Deletes and replaces the 'Earth Movement of Any Kind' exclusion with: Earth Movement of Any Kind — includes, but is not limited to: a. earthquake, including tremors or land shock waves before/during/after a volcanic eruption; b. landslide, mudslide or mudflow; c. subsidence, sinkhole, erosion, expanding/contracting, volcanic eruption/effusion (including lava/ash outpour) — except when sinkhole collapse and volcanic action are separately addressed by this policy; d. any other earth movement (earth sinking/rising/shifting) arising from any human/animal act or act of nature.\" (ML-73 Endorsement)","judge_instruction":"Does the candidate answer state whether ML-73 deletes and replaces the base Earth Movement exclusion or merely supplements it, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says ML-73 deletes and replaces the base exclusion's definition","stated_wrong":"the candidate says ML-73 only adds to the base exclusion without replacing it, or that the base definition still governs","not_stated":"the candidate doesn't address the relationship between ML-73 and the base exclusion"}},{"id":"h1_carveback","required_fact":"direct loss by fire, explosion, and (if covered) theft resulting from earth movement is still paid; explosion does not include volcanic eruption/effusion.","excerpt":"\"We pay for direct loss by fire, explosion, and (if covered) theft resulting from earth movement. Explosion does not include volcanic eruption/effusion. All other terms unchanged.\" (ML-73 Endorsement)","judge_instruction":"Does the candidate answer state the fire/explosion/theft carve-back for loss resulting from earth movement, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says fire/explosion/theft resulting from earth movement is still paid","stated_wrong":"the candidate says no carve-back exists, or states a carve-back the excerpt refutes","not_stated":"the candidate doesn't address the carve-back"}}]},{"id":"h2","tier":"hard","text":"If I employed someone who committed criminal activity and caused damage to my property, how does my policy work in that situation?","canonical_answer":"For damage to your OWN property, the criminal-activity/intentional-act exclusions in this policy only reach an \"insured\" — and a domestic employee is explicitly NOT an \"insured\" for Property coverage purposes. The general Insured definition (Policy Definitions item 6a: you, resident relatives, and minors in your or their care) does not include employees at all. A domestic employee only becomes an \"insured\" under item 6b, and that expansion applies ONLY to Personal Liability and Medical Payments to Others coverage — not to Property coverage. So the Theft exclusion for \"theft committed by an insured\" (Peril 10, exclusion a.1) and the general \"Intentional Acts\" exclusion (Property Exclusions item 12: an act committed by or at the direction of an insured with intent to cause a loss) do NOT apply to an employee's criminal act. Practically: damage, theft, or vandalism caused by your employee to your own home could still be covered under the applicable peril (e.g., Theft or Vandalism and Malicious Mischief), subject to that peril's own ordinary terms (e.g., Vandalism's 30-day vacancy exclusion) — a materially different outcome than if you, the homeowner, had committed the same act, which WOULD be excluded. By contrast, if the same criminal activity caused injury or property damage to a THIRD PARTY rather than your own property, that falls under Personal Liability instead, where the NY Amendatory Endorsement (ML-84) explicitly excludes liability \"arising directly or indirectly out of instances, occurrences or allegations of criminal activity by the insured or by employees of the insured named in this policy.\" So the same underlying act is treated oppositely depending on who was harmed: likely still covered if it damaged your own property, but excluded if it harmed someone else.","subclaims":[{"id":"h2_not_insured","required_fact":"a domestic employee is an \"insured\" only for Personal Liability / Medical Payments to Others, not for Property coverage.","excerpt":"\"6. Insured: a. You, and residents of your household who are your relatives, and any person under 21 in your care or your resident relatives' care. b. Under Personal Liability/Medical Payments to Others only: also includes any person/organization legally responsible for a watercraft or animal owned by an insured (excluding business use or use without owner's permission), and any person performing duties as a domestic employee of an insured.\" (Policy Definitions item 6)","judge_instruction":"Does the candidate answer state whether a domestic employee counts as an 'insured' for Property coverage, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says a domestic employee is an insured only for Liability/Medical Payments, not Property coverage","stated_wrong":"the candidate says a domestic employee is a Property-coverage insured","not_stated":"the candidate doesn't address the employee's status as an insured"}},{"id":"h2_property_covered","required_fact":"because the Theft and Intentional Acts exclusions are written for acts by \"an insured,\" and a domestic employee is not a Property-coverage insured, those exclusions do not bar coverage for the employee's act.","excerpt":"\"6. Insured: a. You, and residents of your household who are your relatives, and any person under 21 in your care or your resident relatives' care. b. Under Personal Liability/Medical Payments to Others only: also includes any person/organization legally responsible for a watercraft or animal owned by an insured (excluding business use or use without owner's permission), and any person performing duties as a domestic employee of an insured.\" (Policy Definitions item 6) \"10. Theft ... Does not cover: a. theft committed by an insured; ...\" (Peril 10) \"12. Intentional Acts — loss from an act committed by or at the direction of an insured intending to cause loss.\" (Exclusions That Apply to Property Coverages, item 12)","judge_instruction":"Does the candidate answer state whether property damage caused by the employee's criminal act could still be covered under the applicable peril, and if so, does the excerpt confirm the reasoning it gives?","criteria":{"stated_correct":"the candidate reaches coverage on the basis that these exclusions are written for acts by \"an insured\" and the employee is not a Property-coverage insured, consistent with the excerpt","stated_wrong":"the candidate says these exclusions reach the employee's act and bar Property coverage","not_stated":"the candidate doesn't address whether the exclusions apply to a non-insured's act"}},{"id":"h2_liability_contrast","required_fact":"ML-84 excludes liability arising out of criminal activity by the insured's employees, so Liability coverage would not respond if the same act harmed a third party.","excerpt":"\"Amends Liability Coverage Exclusion 'o.' ... to read: This policy does not apply to liability arising directly or indirectly out of instances, occurrences or allegations of criminal activity by the insured or by employees of the insured named in this policy.\" (ML-84 Endorsement)","judge_instruction":"Does the candidate answer state whether Liability coverage would exclude the same criminal act if it harmed a third party instead, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says Liability excludes criminal activity by employees","stated_wrong":"the candidate says Liability would still cover it","not_stated":"the candidate doesn't draw the contrast with Liability coverage"}}]},{"id":"h3","tier":"hard","text":"If there's damage to my property, is there a deadline to submit a claim, and if I miss it, what happens to my coverage?","canonical_answer":"There are concrete deadlines. General notice of a loss must be given promptly (no fixed day count). Beyond that, the insured must submit a statement of loss within 60 days after the loss, and — if the insurer requests a formal proof of loss — that must be submitted within 60 days of the request. Missing these deadlines does NOT void or nullify the policy. This policy reserves \"the entire policy is void\" language specifically for the Misrepresentation, Concealment or Fraud condition (willful concealment, misrepresentation, or fraud/false swearing) — missing a claim deadline is not that. It is not consequence-free, though. Under \"Suit Against Us,\" Property Coverages specifically require that \"the terms of this policy have been fully complied with\" before any suit to recover may be brought. Since the 60-day statement-of-loss and proof-of-loss requirements are policy terms, missing them could bar you from being able to sue to enforce that specific claim — a real consequence, just narrower than losing the whole policy or future coverage. One trap to watch for: this policy does contain a provision that reads as good news for a late filer — the NY Statutory Endorsement (NY STAT-1) states that failure to give required notice within the prescribed time does not invalidate a claim unless the delay prejudiced the insurer. But that protection is explicitly scoped to \"this liability policy\" — it applies to Liability coverage notices (harm to third parties), not to Property coverage claims like damage to your own home. So the forgiving \"unless prejudiced\" standard does not extend to the scenario this question describes.","subclaims":[{"id":"h3_deadlines","required_fact":"the insured must promptly notify the insurer, submit a statement of loss within 60 days, and — at the insurer's request — submit an acceptable proof of loss within 60 days.","excerpt":"\"1. Notice — the insured must promptly notify us/our agent (in writing if requested); ...\" / \"4. Additional Duties — Property Coverages: ... submit a statement of loss (under oath if requested) within 60 days. At our request, also: submit an acceptable proof of loss within 60 days ...\"","judge_instruction":"Does the candidate answer state the notice requirement and the 60-day statement-of-loss/proof-of-loss deadlines, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate gives prompt notice plus the 60-day deadline(s), consistent with the excerpt","stated_wrong":"the candidate gives different deadlines (e.g. 30 days, or no deadline at all)","not_stated":"the candidate doesn't address claim deadlines"}},{"id":"h3_not_void","required_fact":"missing the claim deadline does not void the entire policy — the \"entire policy is void\" language is reserved for willful concealment, misrepresentation or fraud.","excerpt":"\"5. Misrepresentation, Concealment or Fraud — the entire policy is void if an insured willfully concealed/misrepresented a material fact/circumstance or interest, or there was fraud/false swearing regarding the insurance, before or after a loss.\" (Policy Conditions item 5)","judge_instruction":"Does t
