he candidate answer state whether missing the claim deadline voids the entire policy, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says the policy is not voided by a missed deadline, and that voiding is reserved for fraud/misrepresentation","stated_wrong":"the candidate says missing a deadline voids the whole policy","not_stated":"the candidate doesn't address whether the policy is voided"}},{"id":"h3_suit_bar","required_fact":"full compliance with policy terms is a precondition to suing on a property claim (and suit must commence within 2 years of the loss), so a missed deadline can bar enforcement of that claim.","excerpt":"\"10. Suit Against Us — a. Property Coverages: no suit unless policy terms were fully complied with and suit commences within 2 years after the loss.\" (Policy Conditions item 10a)","judge_instruction":"Does the candidate answer state whether missing the deadline could bar suing to enforce that specific claim, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says full compliance with policy terms is a precondition to suing on a property claim","stated_wrong":"the candidate says there is no such precondition, or that the missed deadline has no consequence for that claim","not_stated":"the candidate doesn't address the consequence for the specific claim (answering only that the policy isn't voided does not count)"}},{"id":"h3_ny_scope","required_fact":"the NY STAT-1 \"unless the delay prejudiced us\" late-notice protection is scoped to liability-policy notice and does not extend to this property claim.","excerpt":"\"1. Failure to give required liability-policy notice within the prescribed time does not invalidate a claim unless the delay prejudiced us — except where it wasn't reasonably possible to give timely notice and notice was given as soon as reasonably possible after.\" (NY STAT-1 Endorsement, item 1)","judge_instruction":"Does the candidate answer state whether the 'unless prejudiced' late-notice protection extends to this property claim, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says this protection is scoped to liability-policy notices, not property claims","stated_wrong":"the candidate says this protection extends to property claims too","not_stated":"the candidate doesn't address the scope of this protection"}}]},{"id":"h4","tier":"hard","text":"If my house catches fire while I and 4 friends are partying, and each of us loses cash, jewelry, a watch, and — in total — 2 cars are destroyed, explain whether my policy covers the cash, jewelry, watch, and car losses and how the coverage would work.","canonical_answer":"Fire is a covered peril (Peril 1, Fire or Lightning, no attached exclusions), so the underlying cause of loss is covered — but what actually gets paid depends on whose property it is and what category it falls into. Your friends' property is not automatically covered. Coverage C covers property owned by or in the care of an insured, and separately states that guests' personal property is covered only \"at your option\" — an elective add-on, not automatic. Your 4 friends aren't \"insureds\" under the policy's definition (not household members or relatives), so whether their cash, jewelry, and watches are covered at all depends on whether that guest-property option was elected — not something this policy's Declarations confirms either way. Cash is capped, and the cap combines everyone's cash into one number. The \"Limitations on Certain Property\" sets $100 on money as \"the total limit per occurrence for all property in that category\" — a single combined $100 ceiling for all cash lost in this one fire, across everyone whose cash is covered, not $100 per person. Jewelry and watches are NOT subject to their usual sub-limit here, because this is a fire, not a theft. The policy's $500 sub-limit for jewelry and watches applies specifically \"for loss by theft\" — it does not apply to other perils. Since this loss is from fire, jewelry and watches fall under ordinary Coverage C instead, up to the full Coverage C limit, not capped at $500. (Contrast: the money sub-limit above has no such peril qualifier — it applies regardless of cause of loss — so cash is capped here but jewelry/watches are not, a distinction easy to miss since both are adjacent items in the same limitations list.) The cars are not covered at all, regardless of any of the above. \"Personal Property Not Covered\" excludes motorized vehicles, with narrow exceptions (vehicles used exclusively to service the insured premises, vehicles for assisting the handicapped) that don't apply to ordinary cars. The 2 cars fall outside Coverage C entirely — a homeowners policy doesn't cover them regardless of the cause of loss.","subclaims":[{"id":"h4_guest_optional","required_fact":"guests' property is covered only at the insured's option, not automatically.","excerpt":"\"1. While on the Insured Premises: covers personal property owned by or in the care of an insured; at your option, covers guests' and domestic employees' property while on the exclusively-occupied portion of the premises.\" (Coverage C item 1)","judge_instruction":"Does the candidate answer state whether the friends'/guests' property is automatically covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says guest property is covered only \"at your option,\" not automatically","stated_wrong":"the candidate says guest property is automatically covered, or not covered at all","not_stated":"the candidate doesn't address the guests' property"}},{"id":"h4_cash_cap","required_fact":"cash is subject to a $100 total limit per occurrence for all property in that category, regardless of peril.","excerpt":"\"5. Limitations on Certain Property — these special limits do not increase the Coverage C limit of liability. The special limit for each category below is the total limit per occurrence for all property in that category: a. $100 — money, bank notes, bullion, gold (other than goldware), silver (other than silverware), platinum, coins, medals, numismatic property.\"","judge_instruction":"Does the candidate answer state the dollar cap on cash lost in this fire, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate gives a $100 total-per-occurrence cap on money, covering all property in that category regardless of peril","stated_wrong":"the candidate gives a different cap, a per-person cap, or says the cap doesn't apply to fire","not_stated":"the candidate doesn't address a cap on cash"}},{"id":"h4_jewelry_not_capped","required_fact":"the $500 jewelry/watch cap is scoped to theft, so it does not apply to this fire loss.","excerpt":"\"5. Limitations on Certain Property — these special limits do not increase the Coverage C limit of liability. The special limit for each category below is the total limit per occurrence for all property in that category: ... c. $500 — theft of jewelry, watches, precious/semi-precious stones, gems and furs.\"","judge_instruction":"Does the candidate answer state whether jewelry and watches are subject to the $500 cap in this fire scenario, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says this $500 cap is scoped to \"theft of\" jewelry/watches and therefore doesn't apply to a fire loss","stated_wrong":"the candidate applies the $500 cap to this fire loss, or says it applies regardless of peril","not_stated":"the candidate doesn't address the peril scope of the jewelry cap"}},{"id":"h4_cars_excluded","required_fact":"ordinary motorized vehicles are not covered personal property at all under Coverage C.","excerpt":"\"6. Personal Property Not Covered: ... motorized vehicles/parts (except those servicing the premises per the Limitations above, or vehicles designed for assisting the handicapped); ...\"","judge_instruction":"Does the candidate answer state whether the cars are covered, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says ordinary motorized vehicles are not covered under Coverage C","stated_wrong":"the candidate says the cars are covered, or subject to a limit rather than excluded","not_stated":"the candidate doesn't address the cars"}}]},{"id":"h5","tier":"hard","text":"Someone broke into my house and stole my jewelry, cash, credit card and checkbook. The person then used my credit and swiped $10000 and wrote two checks of $5000 each. Does my policy cover the jewelry, cash, and unauthorized credit card and check use? What is the maximum amount payable for each of these?","canonical_answer":"Jewelry — covered under the Theft peril. Because this loss is BY THEFT, the \"Limitations on Certain Property\" $500 sub-limit for jewelry, watches, precious/semi-precious stones, gems and furs applies (this is the same clause that did NOT apply in the fire scenario, since it's specifically scoped to theft). Maximum payable: $500. Cash — also covered under the Theft peril. The \"Limitations on Certain Property\" $100 sub-limit on money applies regardless of the cause of loss (no theft qualifier on this item, unlike jewelry). Maximum payable: $100. Unauthorized credit card use and the forged checks — NOT handled by the Theft peril at all. Peril 10's own exclusions state theft coverage does not apply to \"loss resulting from the theft of any credit card... except as provided under Incidental Property Coverages\" — so this loss is redirected to a different part of the policy entirely: the Incidental Property Coverage \"Credit Card, Forgery and Counterfeit Money,\" which pays \"up to $1,000 for loss sustained by an insured when such insured: 1) becomes legally obligated to pay for the unauthorized use of credit cards...; or 2) suffers a loss through the forgery or alteration of checks...\" This is a SINGLE combined limit covering both triggers together, not $1,000 for the credit card and a separate $1,000 for the checks. So the maximum payable for the $10,000 in unauthorized card charges AND the $10,000 in forged checks COMBINED is $1,000 total, not $1,000 each.","subclaims":[{"id":"h5_jewelry_cap","required_fact":"jewelry stolen in a theft is subject to a $500 total limit per occurrence.","excerpt":"\"10. Theft — includes attempted theft and loss of property from a known place when it is likely theft occurred. Property is considered on the insured premises while placed for safekeeping in a bank, trust or safe deposit company, public warehouse, or an occupied residence/condo/apartment not owned, rented or occupied by an insured.\" \"5. Limitations on Certain Property — these special limits do not increase the Coverage C limit of liability. The special limit for each category below is the total limit per occurrence for all property in that category: ... c. $500 — theft of jewelry, watches, precious/semi-precious stones, gems and furs.\"","judge_instruction":"Does the candidate answer state the dollar limit for jewelry lost by theft in this scenario, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate gives $500 as the jewelry theft cap","stated_wrong":"the candidate gives a different jewelry theft cap, or says jewelry theft is uncapped","not_stated":"the candidate doesn't give a limit for the stolen jewelry"}},{"id":"h5_cash_cap","required_fact":"cash stolen is subject to a $100 total limit per occurrence.","excerpt":"\"10. Theft — includes attempted theft and loss of property from a known place when it is likely theft occurred.\" \"5. Limitations on Certain Property — these special limits do not increase the Coverage C limit of liability. The special limit for each category below is the total limit per occurrence for all property in that category: a. $100 — money, bank notes, bullion, gold (other than goldware), silver (other than silverware), platinum, coins, medals, numismatic property.\"","judge_instruction":"Does the candidate answer state the dollar limit for cash stolen in this scenario, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate gives $100 as the cash cap","stated_wrong":"the candidate gives a different cash cap, or says cash theft is uncapped","not_stated":"the candidate doesn't give a limit for the stolen cash"}},{"id":"h5_card_redirect","required_fact":"theft of a credit card is excluded from the Theft peril itself and is handled under Incidental Property Coverages instead.","excerpt":"\"10. Theft ... Does not cover: ... f. loss from theft of a credit card or similar device (except as provided under Incidental Property Coverages); g. loss from theft of a debit card or similar fund-transfer device (except as provided under Incidental Property Coverages).\"","judge_instruction":"Does the candidate answer state whether unauthorized credit card use is covered directly under the Theft peril, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says credit card theft losses are excluded from the Theft peril and handled under Incidental Property Coverages","stated_wrong":"the candidate says the Theft peril directly covers it, or that it is excluded outright with no incidental coverage at all","not_stated":"the candidate doesn't address how credit card theft losses are treated under the Theft peril"}},{"id":"h5_combined_cap","required_fact":"a single combined $1,000 limit covers the unauthorized credit card use and the forged checks together — not $1,000 for each.","excerpt":"\"4. Credit Card, Forgery and Counterfeit Money: pays up to $1,000 for (a) unauthorized use of credit cards issued/registered in the insured's name; (b) forgery/alteration of checks, drafts, CDs, notes; or (c) good-faith acceptance of counterfeit US/Canadian paper currency. Excludes: non-compliance with credit card issuance terms; loss from an insured's dishonesty; loss from business activities; loss while a non-insured possesses the card with an insured's permission.\"","judge_instruction":"Does the candidate answer state the maximum payable for the credit card fraud and the forged checks combined, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says a single combined $1,000 limit covers both the credit card fraud and the forged checks together","stated_wrong":"the candidate says $1,000 applies to each separately, or gives a different total","not_stated":"the candidate doesn't address the limit for the card/check losses"}}]},{"id":"h6","tier":"hard","text":"I have a tenant in the house. I am installing an AC in his room but the AC accidentally dropped off and hurt the tenant. Does my policy cover the tenant's hospital cost and the AC's damage, and is there any deductible I have to pay first?","canonical_answer":"The tenant's hospital cost is NOT a Medical Payments to Others claim. Coverage M excludes bodily injury \"to an insured or other regular resident of the premises (except a domestic employee)\" — a tenant living in the house is a regular resident, not a domestic employee, so Medical Payments does not apply here, even though it looks like the obvious fit for an on-premises injury. That leaves Personal Liability (Coverage L) as the relevant coverage instead — which is fault-based, not automatic. It pays only if the insured is legally liable (e.g., found negligent in how the AC was installed), unlike Medical Payments, which would have paid regardless of fault. Renting to a tenant could itself be a problem for Liability coverage. The policy's \"Business\" definition includes \"rental of property to others,\" with an exception only for \"occasional residential rental of the portion of the insured premises normally occupied exclusively by your household.\" A standing tenant arrangement plausibly falls outside that narrow exception, which would trigger the general Liability exclusion for \"an insured's business activities.\" However, that exclusion is rescued here by the Incidental Business Coverage, which explicitly restores liability coverage for \"rental of another portion of the insured premises for residential purposes,\" capped at two roomers/boarders per family unit. Since this is one tenant, the carve-back applies, so Personal Liability remains available — contingent on the insured actually being found liable for the injury. The AC's own damage is likely NOT covered by any peril at all. None of the 17 named perils match \"accidentally dropped during installation.\" Falling Objects looks like the natural candidate, but it explicitly excludes \"loss... to the object which falls\" — meaning it never covers damage to the very thing that fell, only damage that thing causes to something else. Peril 14 (Sudden and Accidental Tearing Apart, Burning or Bulging of a heating or air-conditioning system) covers an already-installed system failing suddenly, not a unit dropped during installation, so it doesn't fit either. With no matching peril, the AC's damage is simply not a covered property loss. On the deductible: the policy's deductible provision applies only to Property Coverages (A, B, C, and specific incidental items) — it never applies to Personal Liability or Medical Payments. So if the tenant's hospital cost ends up covered under Personal Liability, no deductible applies to that payout. And since the AC's damage isn't covered by any peril in the first place, the deductible question for it doesn't arise either.","subclaims":[{"id":"h6_medpay_excluded","required_fact":"Medical Payments to Others does not apply to bodily injury to a regular resident of the premises, so it does not cover the tenant.","excerpt":"\"3. Exclusions Applying Only to Medical Payments to Others — does not apply to bodily injury: a. to an insured or other regular resident of the premises (except a domestic employee); ...\"","judge_instruction":"Does the candidate answer state whether Medical Payments to Others covers the tenant's injury, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says Medical Payments excludes a regular resident of the premises, so it doesn't cover the tenant","stated_wrong":"the candidate says Medical Payments would cover the tenant","not_stated":"the candidate doesn't address Medical Payments to Others"}},{"id":"h6_liability_fallback","required_fact":"Personal Liability (Coverage L) is the relevant coverage instead, and it pays only sums the insured is legally liable for — i.e. it is fault-based, not automatic.","excerpt":"\"Coverage L — Personal Liability Pays, up to the limit of liability, all sums an insured is legally liable for because of bodily injury or property damage caused by an occurrence to which this coverage applies.\"","judge_instruction":"Does the candidate answer state that Personal Liability is the relevant, fault-based coverage for the tenant's injury, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate points to Coverage L and says it pays based on legal liability (fault), not automatically","stated_wrong":"the candidate says Coverage L pays regardless of fault, or that Liability is unavailable here for a reason the excerpt refutes","not_stated":"the candidate doesn't address Personal Liability as the fallback coverage"}},{"id":"h6_business_rescued","required_fact":"renting to a tenant could trigger the business exclusion, but Incidental Business Coverage restores liability coverage for residential rental of another portion of the premises (max 2 roomers/boarders per family unit).","excerpt":"\"3. Business = a trade, profession or other occupation (including farming, full or part time) or rental of property to others — EXCEPT occasional residential rental of the portion of the insured premises normally occupied exclusively by your household.\" (Definitions item 3) / \"f. from an insured's business activities, except as provided under Incidental Liability/Medical Payments Coverages;\" (Liability Exclusions item 1f) / \"7. Incidental Business Coverage — pays bodily injury/property damage from: occasional residential rental of the insured's normally-occupied portion; rental of another portion for residential purposes (max 2 roomers/boarders per family unit); ...\" (Incidental Liability Coverage item 7)","judge_instruction":"Does the candidate answer state whether renting to a tenant triggers the business exclusion and whether Incidental Business Coverage rescues it, and if so, does the excerpt confirm the resolution it gives?","criteria":{"stated_correct":"the candidate says the business exclusion could apply to renting a room but Incidental Business Coverage restores liability coverage for residential rental of another portion (up to 2 roomers/boarders), consistent with the excerpt","stated_wrong":"the candidate gives a different resolution (e.g. no rescue is available, or no exclusion applies at all)","not_stated":"the candidate doesn't address the business exclusion or its carve-back"}},{"id":"h6_ac_not_covered","required_fact":"no named peril covers the AC unit's own damage from being dropped during installation.","excerpt":"\"This policy insures against direct physical loss to covered property caused by the following perils: 1. Fire or Lightning. 2. Windstorm or Hail. Does not cover loss: a. caused directly or indirectly by frost, cold weather, ice (other than hail), snow or sleet, wind driven or not; b. to a building's interior or contents caused by dust, rain, sand, sleet, snow or water entering through openings not made by the direct force of wind or hail; c. to watercraft (except rowboats and canoes on the insured premises), their trailers, accessories, equipment and outboard motors, unless inside a fully enclosed building. 3. Explosion. 4. Riot or Civil Commotion — including direct loss from pillage and looting occurring during the riot or civil commotion. 5. Aircraft. 6. Vehicles — does not cover loss to fences, driveways and walks caused by a vehicle owned or operated by an occupant of the insured premises. 7. Sudden and Accidental Damage from Smoke — does not cover loss from smoke from agricultural, smudging or industrial operations. 8. Vandalism and Malicious Mischief — does not cover loss if the insured premises have been vacant for more than 30 consecutive days immediately before the loss. A residence under construction is not considered vacant. 9. Glass Breakage — covers breakage of glass or other glazing material that is part of a building or mobile home, including storm doors and windows. Does not cover loss if the insured premises are vacant for more than 30 consecutive days immediately before the loss. A residence under construction is not considered vacant. 10. Theft — includes attempted theft and loss of property from a known place when it is likely theft occurred. Property is considered on the insured premises while placed for safekeeping in a bank, trust or safe deposit company, public warehouse, or an occupied residence/condo/apartment not owned, rented or occupied by an insured. Does not cover: a. theft committed by an insured; b. theft from a residence under construction until completed and occupied; c. loss of a precious or semi-precious stone from its setting; d. theft from any part of the residence usually occupied exclusively by an insured while rented to others; e. theft from premises vacant more than 30 consecutive days before the loss; f. loss from theft of a credit card or similar device (except as provided under Incidental Property Coverages); g. loss from theft of a debit card or similar fund-transfer device (except as provided under Incidental Property Coverages). Does not cover theft of personal property occurring away from the insured premises. 11. Falling Objects — does not cover loss: a. to a building's interior or contents, unless the object first damaged the outside walls or roof by impact; b. to outdoor awnings or canopies including supports; c. to fences or outdoor equipment not permanently installed; d. to the object which falls. 12. Weight of Ice, Snow or Sleet — causing physical damage to a building or the property inside. Does not cover loss to: outdoor equipment not permanently installed; gutters and downspouts; outdoor awnings/canopies; or outdoor structures (other than buildings/carports/mobile homes) such as swimming pools, retaining walls, fences, septic tanks, piers, wharves, foundations, patios and paved areas — unless the loss is directly caused by collapse of a building from weight of ice, snow or sleet. 13. Collapse of a Building or Any Part of a Building (collapse does not include settling, cracking, shrinking, bulging or expanding). Unless damage is directly caused by collapse of a building, does not cover loss to outdoor awnings/canopies, outdoor equipment not permanently installed, or outdoor structures (pools, retaining walls, fences, septic tanks, piers, wharves, foundations, patios, paved areas). No payment for collapse resulting from an excluded cause or event. 14. Sudden and Accidental Tearing Apart, Burning or Bulging of a heating/air-conditioning system or water heater. Does not cover loss by freezing. 15. Accidental Discharge or Overflow of Liquids or Steam from a plumbing, heating or air-conditioning system or domestic appliance (gutters/downspouts are not part of a plumbing system). Does not cover loss: a. caused by continuous or repeated seepage or leakage; b. if the residence has been vacant more than 30 consecutive days before the loss; c. to the system/appliance from which the liquid or steam escapes (only removal/replacement of parts necessary to repair the system/appliance is paid); d. caused by freezing; e. on the insured premises caused by discharge/overflow originating off the insured premises. 16. Freezing of a plumbing, heating or air-conditioning system or domestic appliance. Does not cover loss while the residence is vacant, unoccupied (including temporary absence) or under construction and unoccupied — UNLESS the insured used reasonable care to (a) maintain heat in the building, or (b) shut off the liquid supply and completely empty the system/appliance. 17. Sudden and Accidental Damage from Artificially Generated Electrical Currents to electrical appliances, devices, fixtures and wiring. Tubes, transistors and similar electronic components are not covered.\" (Perils Section ML-2T, complete)","judge_instruction":"Does the candidate answer state whether the AC unit's own damage is covered by any named peril, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says the AC's own damage is not covered, and across the complete list of named perils in the excerpt none covers an AC unit dropped and damaged during installation (Falling Objects explicitly excludes the object which falls; Peril 14 covers an installed system tearing/burning/ bulging, not an installation mishap)","stated_wrong":"the candidate says the AC's damage is covered by a named peril the excerpt shows does not reach it","not_stated":"the candidate doesn't address whether the AC unit's own damage is covered"},"note":"this sub-claim asserts a universal negative (\"no named peril covers the AC's own damage\"), so the excerpt is the COMPLETE Perils Section — a judge cannot confirm \"no peril applies\" from a subset."},{"id":"h6_deductible_scope","required_fact":"the deductible applies only to Property Coverages, so no deductible applies to a Personal Liability payout.","excerpt":"\"c. Deductible: applies to Coverage A, B, C, and to Debris Removal / Trees-Plants-Shrubs-Lawns / Tenant's Improvements / Condo Unit-Owner Additions / Outdoor Antenna Coverage, per the Declarations or endorsement.\" (How Much We Pay for Loss or Claim, item 1c)","judge_instruction":"Does the candidate answer state whether a deductible applies to the Personal Liability payout for the tenant's injury, and if so, does the excerpt confirm what it states?","criteria":{"stated_correct":"the candidate says the deductible is scoped to Property Coverages, so none applies to the Liability payout","stated_wrong":"the candidate says a deductible applies to the Liability payout","not_stated":"the candidate doesn't address whether a deductible applies"}}]}]},"run":{"routing":{"e1":{"jev":{"tier":"easy","confidence":0.72,"ms":190.25940005667508,"tokens_in":439,"tokens_out":38,"cost":1.756e-05,"mocked":false},"claude":{"tier":"easy","ms":512.6123998779804,"tokens_in":817,"tokens_out":33,"cost":0.000982},"gemini":{"tier":"easy","ms":1673.6920999828726,"tokens_in":142,"tokens_out":11,"cost":0.00029549999999999997}},"e2":{"jev":{"tier":"easy","confidence":0.92,"ms":320.9595999214798,"tokens_in":438,"tokens_out":38,"cost":1.752e-05,"mocked":false},"claude":{"tier":"easy","ms":595.7545000128448,"tokens_in":816,"tokens_out":33,"cost":0.000981},"gemini":{"tier":"easy","ms":1228.1655999831855,"tokens_in":141,"tokens_out":11,"cost":0.000294}},"e3":{"jev":{"tier":"easy","confidence":0.91,"ms":211.07450011186302,"tokens_in":437,"tokens_out":38,"cost":1.7480000000000002e-05,"mocked":false},"claude":{"tier":"easy","ms":611.0196998342872,"tokens_in":815,"tokens_out":33,"cost":0.00098},"gemini":{"tier":"easy","ms":2355.9956999961287,"tokens_in":140,"tokens_out":11,"cost":0.0002925}},"e4":{"jev":{"tier":"easy","confidence":0.68,"ms":493.8693998847157,"tokens_in":438,"tokens_out":38,"cost":1.752e-05,"mocked":false},"claude":{"tier":"easy","ms":657.4560001026839,"tokens_in":816,"tokens_out":33,"cost":0.000981},"gemini":{"tier":"easy","ms":1269.220600137487,"tokens_in":141,"tokens_out":11,"cost":0.000294}},"e5":{"jev":{"tier":"medium","confidence":0.26,"ms":182.94429988600314,"tokens_in":438,"tokens_out":38,"cost":1.752e-05,"mocked":false},"claude":{"tier":"easy","ms":519.8243998456746,"tokens_in":815,"tokens_ou
