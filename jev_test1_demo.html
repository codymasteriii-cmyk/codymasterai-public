<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Risk Triage — Test 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14; --surface:#12161f; --surface-2:#191f2a; --surface-3:#212936;
    --border:#252d3b; --border-soft:#1a212c;
    --text:#eef1f6; --text-dim:#97a2b5; --text-faint:#5c6779;
    --human:#e2e8f0;
    --jev:#a78bfa; --jev-dim:#241f3a; --jev-line:#4a3e73;
    --claude:#e8823c; --claude-dim:#33230f; --claude-line:#7a4d21;
    --gemini:#4c8dff; --gemini-dim:#101c33; --gemini-line:#2c4c85;
    --good:#34d399; --bad:#f87171; --warn:#fbbf24;
    --t0:#64748b; --t1:#34d399; --t2:#fbbf24; --t3:#fb7185;
    --pos:#34d399; --neg:#f87171; --neu:#94a3b8;
    --radius:12px;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; font-size:14px;}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .wrap{max-width:1180px; margin:0 auto; padding:18px 16px 70px;}

  header{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  h1{font-family:Sora; font-size:21px; margin:0; letter-spacing:-.02em;}
  .badge{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px; background:var(--jev-dim); color:var(--jev); border:1px solid var(--jev-line);}
  .runmeta{margin-left:auto; color:var(--text-faint); font-size:11.5px;}

  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .tab{background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    padding:9px 15px; border-radius:10px; cursor:pointer; font-weight:600; font-size:13px; display:flex; gap:9px; align-items:center;}
  .tab[data-on="true"]{background:var(--surface-3); color:var(--text); border-color:#36405473;}
  .tab .n{width:19px; height:19px; border-radius:50%; display:grid; place-items:center;
    background:var(--surface-3); font-size:10.5px; font-weight:800;}
  .tab[data-on="true"] .n{background:var(--jev); color:#1a1430;}

  .panel-head{margin-bottom:14px;}
  .panel-head h2{font-family:Sora; font-size:17px; margin:0 0 4px;}
  .panel-head p{margin:0; color:var(--text-dim); font-size:12.5px; max-width:860px; line-height:1.55;}

  .btn{background:var(--jev); color:#1a1430; border:0; padding:9px 15px; border-radius:9px;
    font-weight:700; font-size:12.5px; cursor:pointer; font-family:inherit;}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn.ghost{background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
  .card.pinned{border-color:var(--jev-line); background:linear-gradient(180deg,#171329 0%,var(--surface) 70%);}
  .pin-tag{font-size:9.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    color:var(--jev); background:var(--jev-dim); border:1px solid var(--jev-line); padding:3px 8px; border-radius:999px;}

  .a-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .aid{color:var(--text-faint); font-size:12px;}
  .tier{font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:999px;}
  .tier.tier_0_noise{background:#1e2430; color:var(--t0); border:1px solid #2c3444;}
  .tier.tier_1_single{background:#0f2a22; color:var(--t1); border:1px solid #1c4a3a;}
  .tier.tier_2_dual{background:#2e2711; color:var(--t2); border:1px solid #514316;}
  .tier.tier_3_crisis{background:#301820; color:var(--t3); border:1px solid #4a2530;}
  .hl{font-weight:650; font-size:14.5px; line-height:1.4;}
  .dline{color:var(--text-faint); font-size:11.5px;}
  .atext{color:var(--text-dim); font-size:12.5px; line-height:1.65; margin-top:8px; white-space:pre-wrap;}

  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:7px; background:var(--surface-3);
    color:var(--text-dim); border:1px solid var(--border); display:inline-flex; align-items:center; gap:6px;}
  .chip.hit{background:#0f2a22; color:var(--good); border-color:#1c4a3a;}
  .chip.miss{background:#301820; color:var(--bad); border-color:#4a2530;}
  .chip .cf{font-size:9.5px; opacity:.85; font-family:"JetBrains Mono",monospace;}
  .sent{font-size:9px; font-weight:800; letter-spacing:.04em; padding:2px 5px; border-radius:4px;}
  .sent.positive{background:#0f2a22; color:var(--pos);}
  .sent.negative{background:#301820; color:var(--neg);}
  .sent.neutral{background:#1e2430; color:var(--neu);}

  /* 4-column comparison grid */
  .cmp{display:grid; grid-template-columns:86px 1fr; gap:7px 10px; align-items:start; margin-top:10px;}
  .cmp .lbl{font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding-top:5px;}
  .lbl.human{color:var(--human);} .lbl.jev{color:var(--jev);}
  .lbl.claude{color:var(--claude);} .lbl.gemini{color:var(--gemini);}
  .cmp .cell{min-height:26px;}
  .pending{color:var(--text-faint); font-size:11.5px; font-style:italic;}
  .freebie{color:var(--text-faint); font-size:11px; font-style:italic;}

  /* Noul bars */
  .nouls{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); display:none;}
  .nouls[data-open="true"]{display:block;}
  .noul-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin-bottom:9px;}
  .noul{display:grid; grid-template-columns:150px 1fr 42px; gap:9px; align-items:center; margin-bottom:5px; font-size:11.5px;}
  .noul .nm{color:var(--text-dim);}
  .ntrack{position:relative; height:9px; background:var(--surface-3); border-radius:5px; overflow:hidden;}
  .nfill{height:100%; border-radius:5px; width:0; transition:width .45s cubic-bezier(.22,.9,.3,1);}
  .nthresh{position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; background:var(--warn); opacity:.75;}
  .nval{text-align:right; color:var(--text-faint); font-family:"JetBrains Mono",monospace; font-size:10.5px;}
  .noul[data-surv="true"] .nm{color:var(--text); font-weight:700;}
  .noul[data-surv="true"] .nval{color:var(--jev);}

  /* batch pixel strips */
  /* Sticky during the batch: the page scrolls through the article rows underneath, but the
     strips are the speed story and must not scroll out of frame while that happens. */
  .strips{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:13px; margin-bottom:12px; position:sticky; top:0; z-index:5;
    box-shadow:0 10px 24px -14px #000;}
  .strip-row{display:grid; grid-template-columns:78px 1fr 118px; gap:10px; align-items:center; margin-bottom:7px;}
  .strip-name{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;}
  .strip{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:1px; height:26px;
    background:var(--surface-3); border-radius:4px; overflow:hidden; padding:1px;}
  .px{background:#1b2230; border-radius:1px;}
  .px.ok{background:var(--good);} .px.part{background:var(--warn);} .px.bad{background:var(--bad);}
  .strip-stat{font-size:11px; color:var(--text-faint); text-align:right;}
  .legend{display:flex; gap:14px; font-size:10.5px; color:var(--text-faint); margin-top:9px; flex-wrap:wrap;}
  .legend b{display:inline-block; width:9px; height:9px; border-radius:2px; vertical-align:middle; margin-right:4px;}

  table.sum{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px;}
  table.sum th,table.sum td{padding:9px 10px; text-align:right; border-bottom:1px solid var(--border-soft);}
  table.sum th:first-child,table.sum td:first-child{text-align:left;}
  table.sum th{color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
  tr.floor td{color:var(--warn); font-style:italic;}
  table.sum th .sub{display:block; font-weight:500; text-transform:none; letter-spacing:0;
    color:var(--text-faint); font-size:9.5px; margin-top:2px;}
  tr.ref td{color:var(--text-faint);}
  .note{background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--warn);
    border-radius:8px; padding:11px 13px; font-size:12px; color:var(--text-dim); line-height:1.6; margin-top:12px;}
  .note b{color:var(--text);}
  .note .eg{display:block; background:var(--surface-3); border-radius:7px; padding:10px 12px;
    margin:10px 0; font-size:11.5px; line-height:1.6; border-left:2px solid var(--jev);}
  /* Sub-points belonging to the heading above them. Without the indent they read as new
     top-level statements and the reader loses track of what they are explaining. */
  .note .sub{display:block; margin:9px 0 0 16px; padding-left:12px; border-left:1px solid var(--border);}
  .note .hd{display:block; margin-top:13px;}
  .note .hd:first-child{margin-top:0;}
  .empty{color:var(--text-faint); font-style:italic; padding:26px; text-align:center;}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; margin-bottom:14px;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px; text-align:center;}
  .stat .v{font-family:Sora; font-size:22px; font-weight:800; color:var(--jev);}
  .stat .k{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin-top:3px;}
  .stat.t0 .v{color:var(--t0);} .stat.t1 .v{color:var(--t1);}
  .stat.t2 .v{color:var(--t2);} .stat.t3 .v{color:var(--t3);}
  select{background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:7px 10px; border-radius:8px; font-family:inherit; font-size:12.5px;}
  label.fl{font-size:11.5px; color:var(--text-faint);}
  @keyframes flash{0%{box-shadow:0 0 0 2px var(--jev);}100%{box-shadow:0 0 0 0 transparent;}}
  .jumped{animation:flash 1.6s ease-out;}
  .filters{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .filters input{background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:7px 11px; border-radius:8px; font-family:inherit; font-size:12.5px; min-width:230px;}
  a.xref{color:var(--jev); text-decoration:none; font-size:11px;}
  a.xref:hover{text-decoration:underline;}
</style>
</head>

"counterparty_credit":0.0,"retail_credit":0.0,"trading_market":0.0,"irrbb":0.0,"liquidity":0.0,"operational":0.0,"cyber":0.0,"compliance_regulatory":0.0,"reputational":0.0,"strategic":0.0},"ms":1838,"cost":0.004886,"error":null},"gemini":{"r":[],"p":{"wholesale_credit":0.05,"counterparty_credit":0.01,"retail_credit":0.02,"trading_market":0.04,"irrbb":0.01,"liquidity":0.01,"operational":0.01,"cyber":0.01,"compliance_regulatory":0.05,"reputational":0.02,"strategic":0.03},"ms":3084,"cost":0.004366,"error":null}}},{"id":"art_002","headline":"US Third-Quarter GDP Expands at 2.8% Rate on Resilient Consumer Spending","dateline":"WASHINGTON (Reuters) —","text":"WASHINGTON (Reuters) — The U.S. economy expanded at a robust 2.8% annualized rate in the third quarter of 2024, propelled by resilient household consumption and federal spending, the Commerce Department's Bureau of Economic Analysis reported Wednesday in its advance estimate.\n\nThe performance followed a 3.0% annualized growth rate in the second quarter, demonstrating enduring momentum despite the Federal Reserve's restrictive monetary policy stance. Consumer spending, which accounts for more than two-thirds of domestic output, climbed at an annualized rate of 3.7%, marking its sharpest increase since the first quarter of 2023. Gains were broad-based across durable goods, pharmaceuticals, and recreational services, comfortably offsetting a 5.1% contraction in residential fixed investment linked to elevated mortgage rates.\n\nFederal government outlays surged at an annualized 9.7% pace, driven primarily by a 14.9% jump in defense expenditures. Meanwhile, the core personal consumption expenditures price index, which excludes volatile food and energy components, cooled to an annualized 2.2% pace, down from 2.8% in the second quarter and approaching the central bank’s 2% target.\n\nThe steady report suggests that the world’s largest economy remains on a stable footing, supporting corporate earnings expectations while giving Federal Reserve policymakers room to proceed with measured interest-rate adjustments.","tier":"tier_2_dual","gold":[{"c":"wholesale_credit","s":"positive","why":"Annualized GDP expansion of 2.8% and corporate investment resilience beat trend forecasts, enhancing debt-servicing capacity across commercial corporate loan portfolios."},{"c":"retail_credit","s":"positive","why":"Annualized consumer spending surge of 3.7% marks the sharpest gain since Q1 2023, reflecting robust household solvency and lowering credit default risk across retail lending books."}],"pred":{"jev":{"r":[],"p":{"wholesale_credit":0.02,"counterparty_credit":0.02,"retail_credit":0.13,"trading_market":0.02,"irrbb":0.34,"liquidity":0.01,"operational":0.01,"cyber":0.01,"compliance_regulatory":0.01,"reputational":0.03,"strategic":0.02},"ms":226,"cost":4.368e-05,"error":null},"claude":{"r":[],"p":{"wholesale_credit":0.15,"counterparty_credit":0.05,"retail_credit":0.12,"trading_market":0.08,"irrbb":0.1,"liquidity":0.05,"operational":0.02,"cyber":0.01,"compliance_regulatory":0.02,"reputational":0.01,"strategic":0.03},"ms":1988,"cost":0.004864,"error":null},"gemini":{"r":[{"c":"retail_credit","s":"positive"},{"c":"wholesale_credit","s":"positive"}],"p":{"wholesale_credit":0.72,"counterparty_credit":0.04,"retail_credit":0.88,"trading_market":0.08,"irrbb":0.22,"liquidity":0.05,"operational":0.01,"cyber":0.0,"compliance_regulatory":0.02,"reputational":0.01,"strategic":0.03},"ms":5229,"cost":0.0054375,"error":null}}},{"id":"art_003","headline":"JPMorgan Chase Foundation Pledges $35 Million to Detroit Housing and Small Business Initiatives","dateline":"DETROIT (Reuters) —","text":"DETROIT (Reuters) — JPMorgan Chase & Co. announced on Thursday a $35 million philanthropic commitment aimed at expanding affordable housing and supporting local small businesses across Detroit, marking the latest phase in the bank's long-term urban revitalization initiative in the city. The grant funding, distributed through the JPMorgan Chase Foundation, will be deployed across community development financial institutions and non-profit partners over the next three years. A significant portion of the capital will target the preservation and creation of multi-family affordable housing units in historically underserved neighborhoods, while remaining allocations will provide flexible low-cost financing and technical assistance to minority-owned enterprises. The commitment expands on the Wall Street lender's initial $100 million pledge made in 2014 following Detroit's emergence from municipal bankruptcy, which was subsequently increased to $150 million and ultimately surpassed $200 million in combined corporate philanthropic and lending capital. Bank executives noted that the initiative focuses on community investment and economic mobility through public-private partnerships rather than commercial balance-sheet exposure. Local municipal leaders commended the private-sector contribution, highlighting the role of philanthropic grants in stabilizing residential corridors and encouraging local entrepreneurship throughout southeastern Michigan.","tier":"tier_0_noise","gold":[],"pred":{"jev":{"r":[],"p":{"wholesale_credit":0.02,"counterparty_credit":0.02,"retail_credit":0.02,"trading_market":0.01,"irrbb":0.01,"liquidity":0.01,"operational":0.01,"cyber":0.01,"compliance_regulatory":0.01,"reputational":0.05,"strategic":0.03},"ms":242,"cost":4.184e-05,"error":null},"claude":{"r":[],"p":{"wholesale_credit":0.0,"counterparty_credit":0.0,"retail_credit":0.0,"trading_market":0.0,"irrbb":0.0,"liquidity":0.0,"operational":0.0,"cyber":0.0,"compliance_regulatory":0.0,"reputational":0.0,"strategic":0.0},"ms":1471,"cost":0.004804,"error":null},"gemini":{"r":[],"p":{"wholesale_credit":0.03,"counterparty_credit":0.0,"retail_credit":0.04,"trading_market":0.0,"irrbb":0.0,"liquidity":0.01,"operational":0.0,"cyber":0.0,"compliance_regulatory":0.02,"reputational":0.05,"strategic":0.04},"ms":2152,"cost":0.004198,"error" ) reported Wednesday. The structural migration, driven by the phased rollout of G20 clearing mandates under the U.S. Dodd-Frank Act and Europe's European Market Infrastructure Regulation (EMIR), has replaced opaque bilateral counterparty networks with multilateral netting at established clearinghouses such as LCH Ltd and CME Group. According to the Bank for International Settlements (BIS), cleared volumes in interest rate swaps have expanded from less than 40% a decade ago, neutralizing trillions of dollars in gross notional exposures. For Tier-1 global systemically important banks (G-SIBs), the transition significantly compresses bilateral counterparty credit risk and reduces regulatory capital requirements. Under Basel III's standardized approach for counterparty credit risk (SA-CCR), exposures to qualifying central counterparties (QCCPs) carry risk weights as low as 2%, compared to risk weights ranging from 20% to 100% for uncleared bilateral trades with corporate and financial counterparties. Furthermore, mandatory daily variation margin and initial margin posting under the uncleared margin rules (UMR) have minimized potential future exposure (PFE) and credit valuation adjustment (CVA) volatility, cementing systemic resilience across global trading desks.","tier":"tier_1_single","gold":[{"c":"counterparty_credit","s":"positive","why":"Multilateral netting and daily margining through central counterparties drastically reduce gross bilateral default exposures, potential future exposure (PFE), and SA-CCR regulatory capital charges for the bank."}],"pred":{"jev":{"r":[{"c":"counterparty_credit","s":"positive"}],"p":{"wholesale_credit":0.02,"counterparty_credit":0.93,"retail_credit":0.01,"trading_market":0.05,"irrbb":0.03,"liquidity":0.01,"operational":0.02,"cyber":0.01,"compliance_regulatory":0.04,"reputational":0.02,"strategic":0.44},"ms":389,"cost":7.732e-05,"error":null},"claude":{"r":[{"c":"counterparty_credit","s":"positive"},{"c":"operational","s":"positive"}] d 23 to sensitive customer data, including credit card applications dating from 2005 to early 2019. Exposed records contained roughly 140,000 Social Security numbers, 80,000 linked bank account numbers, along with names, addresses, credit scores, and transaction histories. The bank detected the unauthorized intrusion on July 17 after receiving an external security tip.\n\nFederal prosecutors in Seattle arrested former Amazon Web Services software engineer Paige Thompson, charging her with computer fraud and abuse. According to the FBI complaint, Thompson exploited a misconfigured open-source web application firewall protecting Capital One’s cloud storage hosted on AWS, executing commands that exfiltrated over 700 folders of data.\n\nCapital One stated that it immediately secured the vulnerability and estimated the incident would generate between $100 million and $150 million in pre-tax costs in 2019, covering customer notifications, credit monitoring, legal counsel, and technology remediation.","tier":"tier_1_single","gold":[{"c":"cyber","s":"negative","why":"The exfiltration of 106 million customer records via an exploited cloud firewall demonstrates severe perimeter defense and infrastructure configuration failures, significantly escalating enterprise cyber risk."}],"pred":{"jev":{"r":[{"c":"cyber","s":"negative"},{"c":"reputational","s":"negative"}],"p":{"wholesale_credit":0.01,"counterparty_credit":0.01,"retail_credit":0.03,"trading_market":0.01,"irrbb":0.01,"liquidity":0.01,"operational":0.03,"cyber":0.99,"compliance_regulatory":0.3,"reputational":0.95,"strategic":0.05},"ms":421,"cost":7.944e-05,"error":null},"claude":{"r":[{"c":"cyber","s":"negative"},{"c":"compliance_regulatory","s":"negative"},{"c":"reputational","s":"negative"}],"p":{"wholesale_credit":0.05,"counterparty_credit":0.02,"retail_credit":0.15,"trading_market":0.02,"irrbb":0.01,"liquidity":0.08,"operational":0.45,"cyber":0.98,"compliance_regulatory":0.85,"reputational":0.82,"strategic":0.12},"ms" nsumer credit sector remains resilient.","tier":"tier_1_single","gold":[{"c":"retail_credit","s":"neutral","why":"Aggregate consumer debt growth and delinquency transitions are tracking baseline historical averages, suggesting stable loss-provisioning expectations and credit performance across the G-SIB's retail mortgage and credit card portfolios without requiring material CECL reserve adjustments."}],"pred":{"jev":{"r":[{"c":"retail_credit","s":"neutral"}],"p":{"wholesale_credit":0.02,"counterparty_credit":0.03,"retail_credit":0.97,"trading_market":0.04,"irrbb":0.06,"liquidity":0.01,"operational":0.01,"cyber":0.01,"compliance_regulatory":0.02,"reputational":0.05,"strategic":0.02},"ms":586,"cost":7.512e-05,"error":null},"claude":{"r":[],"p":{"wholesale_credit":0.05,"counterparty_credit":0.02,"retail_credit":0.15,"trading_market":0.03,"irrbb":0.08,"liquidity":0.02,"operational":0.01,"cyber":0.0,"compliance_regulatory":0.01,"reputational":0.02,"strategic":0.02},"ms":1994,"cost":0.004882,"error":null},"gemini":{"r":[{"c":"retail_credit","s":"neutral"}],"p":{"wholesale_credit":0.04,"counterparty_credit":0.01,"retail_credit":0.94,"trading_market":0.02,"irrbb":0.03,"liquidity":0.02,"operational":0.01,"cyber":0.01,"compliance_regulatory":0.01,"reputational":0.01,"strategic":0.01},"ms":3911,"cost":0.0048895,"error":null}}},{"id":"art_057","headline":"US Mortgage Applications Hold Flat as Conforming Rates Hover Near 7%, MBA Data Shows","dateline":"WASHINGTON (Reuters) —","text":"WASHINGTON (Reuters) — U.S. mortgage application activity remained virtually flat last week as benchmark borrowing costs stabilized, signaling steady but subdued momentum across primary residential lending channels, the Mortgage Bankers Association (MBA) reported Wednesday.\n\nThe MBA’s Market Composite Index, a measure of mortgage loan application volume, edged up a nominal 0.1% on a seasonally adjusted basis for the week ending June 14. The Refinance Index slipped 0.4% from the prior week, while t vels throughout the preceding quarter, with no novel or systemic exploits detected across member networks. The consortium, which aggregates cyber intelligence across thousands of member institutions including Tier-1 global systemically important banks, clearinghouses, and major payment rails, stated in its quarterly threat assessment that automated distributed denial-of-service attempts and credential-stuffing probes persisted at anticipated historical volumes. Crucially, cross-border intelligence feeds confirmed zero successful zero-day penetrations or lateral-movement intrusions targeting core wholesale settlement gateways, core cloud environments, or critical SWIFT messaging interfaces. The findings coincide with ongoing supervisory monitoring by the Federal Reserve, the Federal Deposit Insurance Corporation (FDIC), and the Office of the Comptroller of the Currency (OCC) under interagency operational resilience guidelines. FS-ISAC noted that while state-sponsored actors and cybercriminal syndicates continue routine scanning against institutional perimeters, member defensive postures, endpoint detection systems, and synchronized threat-sharing protocols have successfully neutralized inbound probes. Sector operational readiness indicators remain fully aligned with baseline risk parameters across international wholesale and retail financial infrastructure.","tier":"tier_1_single","gold":[{"c":"cyber","s":"neutral","why":"Sector threat indicators and automated intrusions remained strictly within expected historical baselines, presenting no unhedged vulnerabilities, material network penetrations, or unexpected escalation in the G-SIB's cyber risk profile."}],"pred":{"jev":{"r":[{"c":"cyber","s":"neutral"}],"p":{"wholesale_credit":0.01,"counterparty_credit":0.02,"retail_credit":0.01,"trading_market":0.01,"irrbb":0.01,"liquidity":0.01,"operational":0.02,"cyber":0.85,"compliance_regulatory":0.04,"reputational":0.04,"strategic":0.02},"ms":376,"cost":7.124e-05,"error":null ry data reconciliation, standardizing machine-readable reporting formats, and eliminating redundant reporting line items among cross-border banking entities.\n\n\"This technical paper reflects continuous, scheduled refinement to Pillar 3 market discipline rather than a recalibration of prudential standards,\" the BCBS stated in an accompanying release. Industry analysts expect the eventual implementation timeline to extend beyond 2026, creating minimal operational friction for global systemically important banks already compliant with finalized Basel III disclosure architectures.","tier":"tier_1_single","gold":[{"c":"compliance_regulatory","s":"neutral","why":"The Basel Committee consultation represents an ordinary-course technical update to Pillar 3 reporting templates with a generous 18-month comment timeline, posing no changes to underlying capital requirements or near-term supervisory compliance burdens for the G-SIB."}],"pred":{"jev":{"r":[],"p":{"wholesale_credit":0.01,"counterparty_credit":0.03,"retail_credit":0.02,"trading_market":0.02,"irrbb":0.01,"liquidity":0.01,"operational":0.01,"cyber":0.01,"compliance_regulatory":0.04,"reputational":0.02,"strategic":0.02},"ms":186,"cost":4.316e-05,"error":null},"claude":{"r":[],"p":{"wholesale_credit":0.0,"counterparty_credit":0.0,"retail_credit":0.0,"trading_market":0.0,"irrbb":0.0,"liquidity":0.0,"operational":0.0,"cyber":0.0,"compliance_regulatory":0.0,"reputational":0.0,"strategic":0.0},"ms":1449,"cost":0.004855,"error":null},"gemini":{"r":[{"c":"compliance_regulatory","s":"neutral"}],"p":{"wholesale_credit":0.05,"counterparty_credit":0.02,"retail_credit":0.02,"trading_market":0.01,"irrbb":0.01,"liquidity":0.02,"operational":0.08,"cyber":0.01,"compliance_regulatory":0.85,"reputational":0.01,"strategic":0.04},"ms":5163,"cost":0.0047605,"error":null}}},{"id":"art_073","headline":"Annual Trust Benchmark Shows Customer Confidence in HSBC, UBS, and Global Peers Holds Steady","dateline":"NEW YORK (Reuters) —","text":"GE y up to $700 million in a landmark settlement with federal regulators and nearly all U.S. states over a catastrophic 2017 data breach that compromised the personal records of approximately 147 million consumers, authorities announced Monday.\n\nThe agreement resolves probes led by the Federal Trade Commission (FTC), the Consumer Financial Protection Bureau (CFPB), and attorneys general from 48 states, the District of Columbia, and Puerto Rico. Regulators alleged the credit reporting agency failed to patch a known software vulnerability, Apache Struts, and neglected basic cybersecurity hygiene, leaving sensitive data including Social Security numbers, dates of birth, and home addresses exposed for months.\n\nUnder the terms, Equifax will contribute up to $425 million to a consumer restitution fund, pay $100 million in civil penalties to the CFPB, and provide $175 million to the participating states. The company is also mandated to implement comprehensive cybersecurity overhauls subject to independent third-party assessments for two decades.\n\nThe enforcement action marks the largest data privacy settlement in history to date, setting an aggressive precedent for financial institutions and consumer reporting agencies. Major lenders, including Tier-1 global banks that rely heavily on credit bureau data for underwriting and retail identity verification, face intensifying regulatory scrutiny over third-party data governance, vendor cybersecurity architecture, and data privacy safeguards.","tier":"tier_2_dual","gold":[{"c":"cyber","s":"negative","why":"The massive breach of a critical financial data provider elevates third-party cyber contagion risk and exposes retail banking systems to heightened synthetic identity fraud and credential-stuffing attacks."},{"c":"compliance_regulatory","s":"negative","why":"The historic regulatory penalty establishes stricter enforcement expectations and mandatory oversight frameworks for data privacy, consumer records protection, and third-party vendor risk management across major financial institutions."}],"pred":{"jev":{"r":[{"c":"reputational","s":"negative"},{"c":"cyber","s":"negative"}],"p":{"wholesale_credit":0.02,"counterparty_credit":0.02,"retail_credit":0.04,"trading_market":0.02,"irrbb":0.01,"liquidity":0.01,"operational":0.04,"cyber":0.93,"compliance_regulatory":0.28,"reputational":0.94,"strategic":0.17},"ms":445,"cost":8.016e-05,"error":null},"claude":{"r":[{"c":"compliance_regulatory","s":"negative"},{"c":"cyber","s":"negative"},{"c":"reputational","s":"negative"}],"p":{"wholesale_credit":0.15,"counterparty_credit":0.08,"retail_credit":0.35,"trading_market":0.05,"irrbb":0.03,"liquidity":0.08,"operational":0.72,"cyber":0.92,"compliance_regulatory":0.95,"reputational":0.85,"strategic":0.25},"ms":3492,"cost":0.006097,"error":null},"gemini":{"r":[{"c":"compliance_regulatory","s":"negative"},{"c":"cyber","s":"negative"}],"p":{"wholesale_credit":0.01,"counterparty_credit":0.02,"retail_credit":0.12,"trading_market":0.01,"irrbb":0.01,"liquidity":0.02,"operational":0.2,"cyber":0.95,"compliance_regulatory":0.97,"reputational":0.45,"strategic":0.1},"ms":6360,"cost":0.005335,"error":null}}},{"id":"art_075","headline":"Credit Suisse Faces $5.5 Billion Loss After Archegos Margin Default Sparks Fire-Sales","dateline":"ZURICH (Reuters) —","text":"ZURICH (Reuters) — Credit Suisse suffered a staggering $5.5 billion loss stemming from the collapse of Archegos Capital Management, after the family office defaulted on margin calls tied to highly leveraged total return swaps, forcing the Swiss lender into disorderly equity fire-sales. The crisis erupted in late March 2021 when sharp selloffs in key portfolio holdings, including ViacomCBS and Discovery, rendered Archegos, founded by former Tiger Asia manager Bill Hwang, unable to satisfy multibillion-dollar margin obligations across its prime brokers. While Wall Street peers such as Goldman Sachs and Morgan Stanley rapidly liquidated pledged stock, Credit Suisse hesitated, leaving it holding massive, concentrated equity exposures amidst a cascading market rout. The bank subsequently dumped tens of millions of shares at deeply distressed prices, incurring devastating mark-to-market and realized trading losses that reached 5.06 billion Swiss francs (approximately $5.5 billion). The catastrophe severely depleted the bank's Common Equity Tier 1 capital, forced an overhaul of senior leadership—including the immediate exits of investment bank chief Brian Chin and chief risk officer Lara Warner—and prompted extensive global regulatory inquiries into prime brokerage leverage and synthetic derivative risk management.","tier":"tier_3_crisis","gold":[{"c":"counterparty_credit","s":"negative","why":"Archegos defaulted on margin and settlement obligations under bilateral total return swap contracts, exposing the prime brokerage operation to catastrophic uncollateralized credit losses."},{"c":"trading_market","s":"negative","why":"Forced fire-sales of massive, illiquid equity blocks in ViacomCBS and other names drove severe market price declines, causing over $5.5 billion in mark-to-market and realized trading book losses."},{"c":"compliance_regulatory","s":"negative","why":"The failure of risk governance and synthetic leverage controls prompted extensive global supervisory inquiries and regulatory probes into prime brokerage risk limits."}],"pred":{"jev":{"r":[{"c":"counterparty_credit","s":"negative"},{"c":"trading_market","s":"negative"},{"c":"reputational","s":"negative"}],"p":{"wholesale_credit":0.51,"counterparty_credit":0.98,"retail_credit":0.02,"trading_market":0.98,"irrbb":0.02,"liquidity":0.09,"operational":0.74,"cyber":0.01,"compliance_regulatory":0.86,"reputational":0.89,"strategic":0.41},"ms":680,"cost":8.340000000000001e-05,"error":null},"claude":{"r":[{"c":"counterparty_credit","s":"negative"},{"c":"trading_market","s":"negative"},{"c":"operational","s":"negative"}],"p":{"wholesale_credit":0.15,"counterparty_credit":0.9       (!f.tier || a.tier === f.tier) &&
      (!f.cat  || a.gold.some(g => g.c === f.cat)) &&
      (!f.q    || (a.headline + " " + a.id + " " + a.text).toLowerCase().includes(f.q.toLowerCase())));
  const totalLabels = DATA.articles.reduce((t,a) => t + a.gold.length, 0);
  const TIERS = ["tier_0_noise","tier_1_single","tier_2_dual","tier_3_crisis"];

  return `
  <div class="panel-head">
    <h2>Articles &amp; human ground truth</h2>
    <p>Every wire story with its human-reviewed risk categories and category-anchored sentiment.
       This is the answer key the three models are scored against. All counts below are computed
       from the data, so they cannot drift from it.</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="v">${DATA.articles.length}</div><div class="k">articles</div></div>
    <div class="stat"><div class="v">${totalLabels}</div><div class="k">gold labels</div></div>
    <div class="stat t0"><div class="v">${n(0)}</div><div class="k">noise &middot; 0 risks</div></div>
    <div class="stat t1"><div class="v">${n(1)}</div><div class="k">single &middot; 1 risk</div></div>
    <div class="stat t2"><div class="v">${n(2)}</div><div class="k">dual &middot; 2 risks</div></div>
    <div class="stat t3"><div class="v">${n(3)}</div><div class="k">crisis &middot; 3 risks</div></div>
  </div>
  <div class="filters">
    <label class="fl">Tier</label>
    <select onchange="setFilter('tier',this.value)">
      <option value="">All tiers (${DATA.articles.length})</option>
      ${TIERS.map(t => `<option value="${t}" ${f.tier===t?"selected":""}>${t.replace(/tier_\d_/,"")} (${DATA.articles.filter(a=>a.tier===t).length})</option>`).join("")}
    </select>
    <label class="fl">Category</label>
    <select onchange="setFilter('cat',this.value)">
      <option value="">All categories</option>
      ${CATS.map(c => `<option value="${c}" ${f.cat===c?"selected":""}>${c} (${DATA.articles.filter(a=>a.gold.some(g=>g.c===c)).length})</option>`).join("")}
    </select>
    <input id="q" placeholder="search headline, text or id..." value="${esc(f.q)}" oninput="setFilter('q',this.value)">
    <span class="dline">showing ${list.length} of ${DATA.articles.length}</span>
    ${(f.tier||f.cat||f.q) ? `<button class="btn ghost" onclick="clearFilters()">clear</button>` : ""}
  </div>
  ${list.length ? list.map(a => `
    <div class="card" id="art-${a.id}">
      <div class="a-head">
        <span class="aid mono">${a.id}</span>
        <span class="tier ${a.tier}">${a.tier.replace(/tier_\d_/,"")}</span>
        <span class="hl">${esc(a.headline)}</span>
      </div>
      <div class="dline">${esc(a.dateline)}</div>
      <div class="atext">${esc(a.text)}</div>
      <div class="cmp"><div class="lbl human">Human</div><div class="cell">
        ${a.gold.length ? `<div class="chips">${a.gold.map(g => chipHTML(g.c,{sent:g.s})).join("")}</div>
           <div class="atext" style="margin-top:7px">${a.gold.map(g => `<b>${esc(g.c)}:</b> ${esc(g.why)}`).join("<br>")}</div>`
          : `<span class="chip">&mdash; no material G-SIB risk impact (noise) &mdash;</span>`}
      </div></div>
    </div>`).join("") : `<div class="empty">No articles match that filter.</div>`}`;
}

function setFilter(k, v){
  state.filter[k] = v;
  document.getElementById("view").innerHTML = renderArticles();
  if(k === "q"){ const q = document.getElementById("q"); q.focus(); q.setSelectionRange(v.length, v.length); }
}
function clearFilters(){ state.filter = {tier:"",cat:"",q:""}; render(); }

// Jump from a stage tab to the full article. Clears the filters FIRST -- otherwise the target
// may simply not be in the filtered list and the jump silently does nothing.
function showArticle(id){
  state.filter = {tier:"",cat:"",q:""};
  go(1);
  requestAnimationFrame(() => {
    const el = document.getElementById("art-" + id);
    if(!el) return;
    el.scrollIntoView({block:"center"});
    el.classList.add("jumped");
    setTimeout(() => el.classList.remove("jumped"), 1700);
  });
}

/* ---------------------------------------------------------------- tabs 2 & 3 */
// Derives a column's running stat from state, so a re-render after the batch reproduces
// exactly what the live loop last wrote. Without this, render() at the end of runBatch()
// repaints the strips blank and the finished picture -- the whole point of the batch -- is
// lost the instant it completes.
function statLine(rest, m, mode, done){
  const shown = rest.filter(a => done[a.id]);
  if(!shown.length) return "—";
  const ok = shown.filter(a => pixelClass(a, m, mode) === "ok").length;
  // In stage 2 the LLMs make NO call, so attributing their stage-1 latency here would claim
  // time they never spent on sentiment -- and would double-count it against stage 1.
  const billed = (mode === "cat" || m === "jev");
  const ms = billed ? shown.reduce((t,a) => t + a.pred[m].ms, 0) : 0;
  return `${ok}/${shown.length} exact · ` + (billed ? `${(ms/1000).toFixed(1)}s` : "no 2nd call");
}

function stageHTML(stage){
  const mode = stage === 1 ? "cat" : "sent";
  const pins = PINNED["stage" + stage];
  const done = stage === 1 ? state.s1 : state.s2;
  const batchDone = stage === 1 ? state.s1BatchDone : state.s2BatchDone;
  const rest = DATA.articles.filter(a => !pins.includes(a.id) &&
      (stage === 1 || a.gold.length || MODELS.some(m => a.pred[m].r.length)));

  const head = stage === 1 ? {
    h: "Stage 1 — risk category mapping",
    p: `Each model reads the article and decides which of the ${CATS.length} Basel III risk categories it
        materially impacts. Jev screens all ${CATS.length} at once with typed yes/no questions and keeps those above
        0.50; the LLMs return a ranked list from a single call. Capped at 3 for everyone.`
  } : {
    h: "Stage 2 — category-anchored sentiment",
    p: `For each surviving category, is the bank's exposure getting worse, better, or unchanged?
        <b>Only Jev makes a second call here</b> — it asks a typed question per surviving category.
        Claude and Gemini already returned sentiment inside their single stage-1 call, so nothing re-runs
        for them and nothing further is billed.`
  };

  return `
  <div class="panel-head"><h2>${head.h}</h2><p>${head.p}</p></div>

  <div style="display:flex; gap:9px; flex-wrap:wrap; margin-bottom:14px;">
    <button class="btn" id="runAll${stage}" onclick="runBatch(${stage})">▶ Run remaining ${rest.length}</button>
    <button class="btn ghost" onclick="resetStage(${stage})">↺ Reset</button>
  </div>

  ${pins.map(id => {
    const a = byId[id];
    return `<div class="card pinned" id="pin-${stage}-${id}">
      <div class="a-head">
        <span class="pin-tag">walkthrough</span>
        <span class="aid mono">${a.id}</span>
        <span class="tier ${a.tier}">${a.tier.replace(/tier_\d_/,"")}</span>
        <a class="xref" href="#" onclick="showArticle('${a.id}');return false;">view article ↗</a>
      </div>
      <div class="hl">${esc(a.headline)}</div>
      <div class="dline" style="margin-top:3px">${esc(a.pred.jev.ms)}ms jev · ${esc(a.pred.claude.ms)}ms claude · ${esc(a.pred.gemini.ms)}ms gemini</div>
      ${stage === 1 ? `<div class="nouls" id="nouls-${a.id}" data-open="${!!done[id]}">
          <div class="noul-title">Jev — ${CATS.length} typed yes/no questions, one call · amber line = 0.50 keep threshold</div>
          ${nuolRowsHTML(a)}
        </div>` : ""}
      ${cmpHTML(a, mode, !!done[id])}
      <div style="margin-top:11px"><button class="btn" onclick="runPinned(${stage},'${id}')">▶ Walk through this one</button></div>
    </div>`;
  }).join("")}

  <div class="strips" id="strips-${stage}">
    <div class="noul-title">Batch replay — real relative speed, compressed to ${Math.round(BATCH_SCALE*100)}% of wall clock</div>
    ${MODELS.map(m => `
      <div class="strip-row">
        <div class="strip-name" style="color:var(--${m})">${m}</div>
        <div class="strip" id="strip-${stage}-${m}">${rest.map(a =>
            `<div class="px${done[a.id] ? " " + pixelClass(a, m, mode) : ""}" id="px-${stage}-${m}-${a.id}"></div>`).join("")}</div>
        <div class="strip-stat" id="stat-${stage}-${m}">${statLine(rest, m, mode, done)}</div>
      </div>`).join("")}
    <div class="legend">
      <span><b style="background:var(--good)"></b>exact match</span>
      <span><b style="background:var(--warn)"></b>partial</span>
      <span><b style="background:var(--bad)"></b>wrong / missed</span>
      <span><b style="background:#1b2230"></b>not yet run</span>
    </div>
  </div>

  ${batchDone ? `<div class="note">Batch complete. ${stage === 1
      ? "Jev's strip filled first because it really is ~7x faster per article; the strips move at the measured relative pace."
      : "Only Jev's strip moved — Claude and Gemini returned sentiment in stage 1, so there was nothing left to run."}</div>` : ""}

  ${rest.map(a => `
    <div class="card" id="row-${stage}-${a.id}">
      <div class="a-head">
        <span class="aid mono">${a.id}</span>
        <span class="tier ${a.tier}">${a.tier.replace(/tier_\d_/,"")}</span>
        <span class="hl" style="font-size:13px">${esc(a.headline)}</span>
        <a class="xref" href="#" onclick="showArticle('${a.id}');return false;">view article ↗</a>
      </div>
      ${cmpHTML(a, mode, !!done[a.id])}
    </div>`).join("")}`;
}

/* ---------------------------------------------------------------- replay */
async function runPinned(stage, id){
  if(state.running) return;
  state.running = true; const a = byId[id];
  const done = stage === 1 ? state.s1 : state.s2;

  if(stage === 1){
    // Reveal the 11 Nouls one at a time, highest first: the screening step made visible.
    const box = document.getElementById(`nouls-${id}`);
    if(box){
      box.setAttribute("data-open","true");
      const entries = Object.entries(a.pred.jev.p).sort((x,y) => y[1]-x[1]);
      for(const [c,p] of entries){
        const row = document.getElementById(`noul-${id}-${c}`);
        if(row){
          row.querySelector(".nfill").style.width = (p*100).toFixed(1) + "%";
          row.querySelector(".nval").textContent = p.toFixed(2);
        }
        await sleep(PIN_STEP);
      }
      await sleep(PIN_GAP);
    }
  }
  // Then each model's verdict, in speed order, so the ordering itself carries meaning.
  for(const m of MODELS){
    const cell = document.getElementById(`cell-${stage===1?"cat":"sent"}-${m}-${id}`);
    if(cell){
      cell.innerHTML = cellHTML(a, m, stage===1?"cat":"sent")
        + (stage===2 && m!=="jev" ? `<div class="freebie">returned in stage 1 — no additional call, $0.0000</div>` : "");
    }
    await sleep(PIN_GAP);
  }
  done[id] = true;
  state.running = false;
}

function pixelClass(a, m, mode){
  const gold = goldCats(a), pred = predCats(a,m);
  if(mode === "cat"){
    const inter = [...pred].filter(c => gold.has(c)).length;
    if(pred.size === gold.size && inter === gold.size) return "ok";
    return inter ? "part" : "bad";
  }
  const shared = [...pred].filter(c => gold.has(c));
  if(!shared.length) return "bad";
  const right = shared.filter(c => sentOf(a,m,c) === goldSent(a,c)).length;
  return right === shared.length ? "ok" : right ? "part" : "bad";
}

async function runBatch(stage){
  if(state.running) return;
  state.running = true;
  followBatch = true;
  const btn = document.getElementById("runAll"+stage); if(btn) btn.disabled = true;
  const mode = stage === 1 ? "cat" : "sent";
  const pins = PINNED["stage"+stage];
  const rest = DATA.articles.filter(a => !pins.includes(a.id) &&
      (stage === 1 || a.gold.length || MODELS.some(m => a.pred[m].r.length)));
  const done = stage === 1 ? state.s1 : state.s2;

  // One independent timeline per model, each paced by its OWN measured latency. This is
  // what makes the strips finish at different times, and the ratio is the real one.
  const counts = {}; MODELS.forEach(m => counts[m] = {n:0, ok:0, ms:0});
  const column = async (m) => {
    for(const a of rest){
      // stage 2 bills nothing for the LLMs, so their strip fills instantly rather than
      // pretending to spend time it did not spend.
      const wait = (stage === 2 && m !== "jev") ? 0 : a.pred[m].ms * BATCH_SCALE;
      if(wait) await sleep(wait);
      const px = document.getElementById(`px-${stage}-${m}-${a.id}`);
      if(px) px.className = "px " + pixelClass(a, m, mode);
      const cell = document.getElementById(`cell-${mode}-${m}-${a.id}`);
      if(cell) cell.innerHTML = cellHTML(a, m, mode)
        + (stage===2 && m!=="jev" ? `<div class="freebie">returned in stage 1 — no additional call</div>` : "");
      if(m === SLOWEST) followRow(document.getElementById(`row-${stage}-${a.id}`));
      const c = counts[m];
      const billed = (mode === "cat" || m === "jev");   // see statLine()
      c.n++; c.ms += billed ? a.pred[m].ms : 0;
      c.ok += (pixelClass(a,m,mode) === "ok") ? 1 : 0;
      const st = document.getElementById(`stat-${stage}-${m}`);
      if(st) st.textContent = `${c.ok}/${c.n} exact · `
        + (billed ? `${(c.ms/1000).toFixed(1)}s` : "no 2nd call");
      done[a.id] = true;
    }
  };
  await Promise.all(MODELS.map(column));
  if(stage === 1) state.s1BatchDone = true; else state.s2BatchDone = true;
  state.running = false;
  render();
}

function resetStage(stage){
  if(state.running) return;
  if(stage === 1){ state.s1 = {}; state.s1BatchDone = false; } else { state.s2 = {}; state.s2BatchDone = false; }
  render();
}

/* ---------------------------------------------------------------- tab 4 */
function summaryHTML(){
  const M = DATA.metrics.models, R = DATA.metrics._reference;
  const kw = R.keyword_only_floor, sb = R.sentiment_majority_baseline;
  const s1 = state.s1BatchDone, s2 = state.s2BatchDone;
  const nArt = DATA.articles.length;
  const nGold = DATA.articles.reduce((t,a) => t + a.gold.length, 0);

  // Plain counts, not rates. A reader meeting this table for the first time wants
  // "how many did it get right" before they want an F1 score, and a bare percentage
  // invites a verdict before the question is understood.
  const row = (name, color, found, missed, wrong, exact, ms, cost) => `
    <tr><td ${color?`style="color:${color}"`:""}><b>${name}</b></td>
      <td>${found}</td><td>${missed}</td><td>${wrong}</td><td>${exact}</td>
      <td>${ms}</td><td>${cost}</td></tr>`;

  const stage1 = `
  <table class="sum">
    <tr><th>model</th>
        <th>risks found<br><span class="sub">of ${nGold}</span></th>
        <th>missed</th>
        <th>flagged in error</th>
        <th>articles exactly right<br><span class="sub">of ${nArt}</span></th>
        <th>time per article</th>
        <th>cost per 1,000</th></tr>
    <tr class="floor">${row("keyword matching only &mdash; no AI", "", kw.found, kw.missed, kw.wrongly_flagged,
        Math.round(kw.exact_set_match_rate*nArt), "—", "—").replace(/^\s*<tr>|<\/tr>\s*$/g,"")}</tr>
    ${MODELS.map(m => { const x = M[m], r = x.retrieval, o = x.operational;
      return row(MODEL_NAME[m], `var(--${m})`, r.found, r.missed, r.wrongly_flagged, r.exact_articles,
                 `${o.latency_ms_p50.toFixed(0)} ms`, `$${money(o.cost_per_1k_articles_usd)}`); }).join("")}
  </table>

  <div class="note">
    <span class="hd"><b>How to read the columns.</b>
    A human reviewer marked <b>${nGold} risks</b> across <b>${nArt} articles</b>. <b>Risks found</b> is how many
    of those the model also named. <b>Flagged in error</b> is risks it named that the human did not &mdash; these
    are not mistakes the &ldquo;found&rdquo; column can show you, so read the two together. <b>Articles exactly
    right</b> is the strictest column: the model&rsquo;s whole list matched the human&rsquo;s for that article,
    including naming the right <i>number</i> of risks.</span>

    <span class="hd"><b>What the first row is.</b> Not a model, and not an AI &mdash; a few lines of code. Each of
    the ${CATS.length} risk categories has a written definition. For every article it counts how many words from
    each definition appear in the story, then keeps the <b>top ${kw.cap} categories that matched at least
    ${kw.min_hits} words</b>. That is the whole method: no reading, no reasoning, no API call.</span>

    <span class="sub">
      <span class="eg"><b>Worked example &mdash; <i>&ldquo;Capital One Boosts Credit Provisions to $3.1 Billion
      as Consumer Card Defaults Rise&rdquo;</i></b><br>
      The <i>retail credit</i> definition shares 11 words with that story &mdash; delinquency, charge-offs,
      consumer, lending, portfolios, cards, household, employment, retail&hellip; &mdash; so retail credit wins on
      word count alone. The human also said retail credit. No judgement was involved in getting that right.</span>
      Across all ${nArt} articles this finds <b>${kw.found} of the ${nGold} risks</b>, because the articles were
      written from those same definitions and the vocabulary leaks through.
      <b>Read every model as its distance above that line, not above zero.</b>
    </span>

    <span class="sub"><b>Why that row has no time or cost.</b> There is no model to call, so there is nothing to
    wait for and nothing to bill. The dashes are literal zeroes &mdash; which is also why clearing this line
    matters: whatever a model adds, it has to be worth paying for.</span>
  </div>

  <table class="sum">
    <tr><th>model</th>
        <th>when the article uses the taxonomy&rsquo;s own words<br><span class="sub">8 categories</span></th>
        <th>when it does not<br><span class="sub">${R.leak_buckets.low_leak.join(", ")}</span></th>
        <th>drop</th></tr>
    ${MODELS.map(m => { const L = M[m].retrieval_by_leak;
      const d = L.high_leak.micro_f1 - L.low_leak.micro_f1;
      return `<tr><td style="color:var(--${m})"><b>${MODEL_NAME[m]}</b></td>
        <td>${L.high_leak.micro_f1.toFixed(3)}</td><td>${L.low_leak.micro_f1.toFixed(3)}</td>
        <td>${d >= 0 ? "−" : "+"}${Math.abs(d).toFixed(3)}</td></tr>`; }).join("")}
  </table>
  <div class="note">
    <span class="hd"><b>What the numbers are.</b> Each one is a single score from 0 to 1 that folds together both
    kinds of mistake: risks the model <i>missed</i>, and risks it <i>flagged in error</i>. <b>1.00</b> would mean
    it named every risk in that group and invented none. Anything lower means it missed some, over-flagged some,
    or both &mdash; the score cannot tell you which, which is why the counts in the table above matter too.</span>

    <span class="hd"><b>Why the table is split.</b> The ${CATS.length} risk categories are not equally easy. Some
    have definitions whose wording tends to show up in the story itself &mdash; a default story says
    &ldquo;default&rdquo;, a liquidity story says &ldquo;deposits&rdquo;. Others
    (${R.leak_buckets.low_leak.join(", ")}) are abstract, with little vocabulary to copy, so the model has to
    actually infer them.</span>

    <span class="sub"><b>So the drop column is the interesting one.</b> It is how far a model falls when the
    words stop giving the answer away &mdash; in other words, how much of its score came from vocabulary rather
    than judgement.</span>
  </div>`;

  const stage2 = `
  <table class="sum">
    <tr><th>model</th>
        <th>risks found<br><span class="sub">of ${nGold}</span></th>
        <th>&hellip; and direction also right</th>
        <th>both right<br><span class="sub">of ${nGold}</span></th></tr>
    <tr class="floor"><td><b>always say &ldquo;${sb.label}&rdquo; (no model)</b></td><td>—</td><td>—</td>
        <td>${Math.round(sb.accuracy*nGold)}</td></tr>
    ${MODELS.map(m => { const x = M[m];
      const found = x.retrieval.found, both = x.sentiment.joint_correct;
      return `<tr><td style="color:var(--${m})"><b>${MODEL_NAME[m]}</b></td>
        <td>${found}</td><td>${both} of ${found}</td><td>${both}</td></tr>`; }).join("")}
  </table>
  <div class="note">
    <span class="hd"><b>How to read the columns.</b> Direction means: is the bank&rsquo;s exposure in that risk
    getting worse, better, or unchanged. It can only be judged on risks the model actually found, so the middle
    column is out of each model&rsquo;s own total &mdash; not out of ${nGold}.</span>

    <span class="hd"><b>What the first row is.</b> Again not a model: it answers
    &ldquo;${sb.label}&rdquo; for every risk, every time, without reading anything. Most risk news is bad news
    &mdash; ${Math.round(sb.accuracy*nGold)} of the ${nGold} human directions are
    &ldquo;${sb.label}&rdquo; &mdash; so that alone scores <b>${Math.round(sb.accuracy*nGold)}</b>.</span>

    <span class="sub">It has no &ldquo;risks found&rdquo; because it never identifies a risk; it only ever
    supplies a direction. It is here to set the bar for the last column: <b>a model has to clear
    ${Math.round(sb.accuracy*nGold)} before its direction judgement has shown you anything at all.</b></span>

    <span class="hd"><b>What to notice.</b> Every model gets the direction right on almost everything it found,
    so this stage barely separates them &mdash; on the 100 risks all three identified, they agreed <b>98%</b> of
    the time. <b>The spread in the last column is therefore carried over from stage 1</b>: find more risks,
    score higher here.</span>
  </div>`;

  return `
  <div class="panel-head"><h2>Summary</h2>
    <p>Scored against the human-reviewed labels. Each table has a &ldquo;no model&rdquo; row so you can see
       what the score is worth before comparing anything.</p></div>
  <h3 style="font-family:Sora;font-size:14px;margin:18px 0 0">Stage 1 &mdash; which risks does the story touch?</h3>
  ${s1 ? stage1 : `<div class="empty">Run stage 1 to populate.</div>`}
  <h3 style="font-family:Sora;font-size:14px;margin:26px 0 0">Stage 2 &mdash; is each risk getting worse or better?</h3>
  ${s2 ? stage2 : `<div class="empty">Run stage 2 to populate.</div>`}`;
}

/* ---------------------------------------------------------------- shell */
const TABS = [[1,"Articles & ground truth"],[2,"Risk categories"],[3,"Sentiment"],[4,"Summary"]];
function go(n){ tab = n; render(); window.scrollTo({top:0}); }
function render(){
  document.getElementById("tabs").innerHTML = TABS.map(([n,label]) =>
    `<button class="tab" data-on="${tab===n}" onclick="go(${n})"><span class="n">${n}</span>${label}</button>`).join("");
  const v = document.getElementById("view");
  v.innerHTML = tab===1 ? renderArticles() : tab===2 ? stageHTML(1) : tab===3 ? stageHTML(2) : summaryHTML();
}
document.getElementById("runmeta").textContent = DATA.meta.line;
render();
</script>
</body>
</html>
